                    life: 1.0, decay: Math.random() * 0.02 + 0.012,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 4.5 + 2
                });
            }
        }

        function resetHkPuck(serveTowardsPlayer) {
            hkPuck.x = hkTable.width / 2;
            hkPuck.y = hkTable.height / 2;
            const dirY = serveTowardsPlayer ? 2.6 : -2.6;
            const dirX = (Math.random() - 0.5) * 2.2;
            hkPuck.vx = dirX;
            hkPuck.vy = dirY;
            hkPuck.trail = [];
            hkPuck.angle = 0;
        }

        // ===================================================================
        //AIR HOCKEY ZERO-BUTTON FLUID CONTROLS & INITIALIZATION
        // ===================================================================
        function initAirHockeyGame() {
            if (typeof loopTimerInstance !== 'undefined' && loopTimerInstance) {
                clearInterval(loopTimerInstance);
                if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(loopTimerInstance);
                loopTimerInstance = null;
            }

            const canvas = document.getElementById('hockeyCanvas');
            if (!canvas) return;
            hockeyCanvasElement = canvas;
            hkCtx = canvas.getContext('2d');

            hkTable.width = canvas.width;
            hkTable.height = canvas.height;
            hkTable.goalWidth = Math.max(130, Math.floor(hkTable.width * 0.40));
            hkTable.goalDepth = 18;
            hkTable.cornerBevel = Math.max(38, Math.floor(hkTable.width * 0.11));

            hkPlayer.radius = Math.max(22, Math.min(28, Math.floor(hkTable.width * 0.065)));
            hkChefAI.radius = hkPlayer.radius;
            hkPuck.radius = Math.max(12, Math.min(16, Math.floor(hkTable.width * 0.036)));
            hkPuck.maxSpeed = 19;
            hkPuck.friction = 0.993;

            hkPlayer.x = hkTable.width / 2;
            hkPlayer.y = hkTable.height * 0.82;
            hkPlayer.targetX = hkPlayer.x;
            hkPlayer.targetY = hkPlayer.y;
            hkPlayer.vx = 0; hkPlayer.vy = 0;
            hkPlayer.isDragging = false;

            hkChefAI.x = hkTable.width / 2;
            hkChefAI.y = hkTable.height * 0.16;
            hkChefAI.targetX = hkChefAI.x;
            hkChefAI.targetY = hkChefAI.y;
            hkChefAI.vx = 0; hkChefAI.vy = 0;
            hkChefAI.baseSpeed = 5.2;
            hkChefAI.currentSpeed = 5.2;
            hkChefAI.dialogue = 'Chef AI: Ready to face the Kitchen Master? 🔥';
            hkChefAI.dialogueTimer = 180;

            hkScore.player = 0;
            hkScore.chef = 0;
            hkGameState = 'PLAYING';
            hkPauseTimer = 0;
            hkCameraShake = 0;
            hkParticles = [];
            hkShockwaves = [];
            hkIceScratches = [];
            hkBannerText = '';
            hkPuckStuckCounter = 0;
            hkGoalLightPulse = 0;
            hkLastScorer = '';

            resetHkPuck(true);

            // Bind Zero-Button Direct Touch / Pointer Controls
            if (!isHockeyInputBound) {
                const updatePointerPos = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : hkPlayer.x);
                    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : hkPlayer.y);
                    const canvasX = (clientX - rect.left) * scaleX;
                    const canvasY = (clientY - rect.top) * scaleY;

                    const minX = hkPlayer.radius + 10;
                    const maxX = hkTable.width - hkPlayer.radius - 10;
                    const minY = hkTable.height / 2 + hkPlayer.radius + 6;
                    const maxY = hkTable.height - hkPlayer.radius - 8;

                    hkPlayer.targetX = Math.max(minX, Math.min(maxX, canvasX));
                    hkPlayer.targetY = Math.max(minY, Math.min(maxY, canvasY));
                };

                const handleStart = (e) => {
                    if (activeGameMode !== 'HOCKEY') return;
                    if (e.cancelable) e.preventDefault();
                    getHkAudioCtx();
                    hkPlayer.isDragging = true;
                    updatePointerPos(e);
                };

                const handleMove = (e) => {
                    if (activeGameMode !== 'HOCKEY') return;
                    if (e.cancelable) e.preventDefault();
                    if (hkPlayer.isDragging || e.pointerType === 'mouse' || e.type === 'mousemove') {
                        updatePointerPos(e);
                    }
                };

                const handleEnd = (e) => {
                    if (activeGameMode !== 'HOCKEY') return;
                    hkPlayer.isDragging = false;
                    hkPlayer.vx = 0;
                    hkPlayer.vy = 0;
                };

                canvas.addEventListener('pointerdown', handleStart, { passive: false });
                window.addEventListener('pointermove', handleMove, { passive: false });
                window.addEventListener('pointerup', handleEnd, { passive: false });
                window.addEventListener('pointercancel', handleEnd, { passive: false });

                canvas.addEventListener('touchstart', handleStart, { passive: false });
                canvas.addEventListener('touchmove', handleMove, { passive: false });
                canvas.addEventListener('touchend', handleEnd, { passive: false });

                isHockeyInputBound = true;
            }

            loopTimerInstance = setInterval(frameUpdateAirHockey, 16);
        }

        // ===================================================================
        //AIR HOCKEY MAIN LOOP: PHYSICS, CHEF AI & RENDERING
        // ===================================================================
        function frameUpdateAirHockey() {
            if (!hockeyCanvasElement || !hkCtx || activeGameMode !== 'HOCKEY') return;

            hkChefAuraAngle += 0.05;
            if (hkChefAI.dialogueTimer > 0) hkChefAI.dialogueTimer--;
            if (hkGoalLightPulse > 0) hkGoalLightPulse--;

            // 1. Handle Pause / Celebration
            if (hkGameState === 'GOAL_PAUSE') {
                hkPauseTimer--;
                if (hkPauseTimer <= 0) {
                    hkGameState = 'PLAYING';
                    hkBannerText = '';
                }
            }

            // 2. Player Striker Physics Update
            if (hkGameState === 'PLAYING') {
                const targetX = hkPlayer.targetX;
                const targetY = hkPlayer.targetY;
                hkPlayer.vx = (targetX - hkPlayer.x);
                hkPlayer.vy = (targetY - hkPlayer.y);
                hkPlayer.x = targetX;
                hkPlayer.y = targetY;
            }

            // 3. Smart Chef AI Logic (Corner-Aware & Dynamic Scaling)
            if (hkGameState === 'PLAYING') {
                const speedBoost = Math.min(hkScore.player * 1.0, 4.5);
                hkChefAI.currentSpeed = hkChefAI.baseSpeed + speedBoost;

                const goalCenter = hkTable.width / 2;
                const puckInChefZone = hkPuck.y < (hkTable.height * 0.5);
                let aiTargetX = goalCenter;
                let aiTargetY = hkTable.height * 0.16;

                const minChefX = hkChefAI.radius + 12;
                const maxChefX = hkTable.width - hkChefAI.radius - 12;
                const minChefY = hkChefAI.radius + 12;
                const maxChefY = (hkTable.height * 0.48) - hkChefAI.radius;

                // Check if puck is in AI's deep corner or back zone
                const isDeepInCorner = hkPuck.y < minChefY + 35 && (hkPuck.x < hkTable.width * 0.35 || hkPuck.x > hkTable.width * 0.65);
                const isBehindAi = hkPuck.y < hkChefAI.y + 10;

                if (puckInChefZone) {
                    if (isDeepInCorner || isBehindAi) {
                        if (hkPuck.x < goalCenter) {
                            aiTargetX = Math.max(goalCenter - 25, hkPuck.x + hkChefAI.radius + 35);
                            aiTargetY = Math.max(minChefY + 30, hkPuck.y + 25);
                        } else {
                            aiTargetX = Math.min(goalCenter + 25, hkPuck.x - hkChefAI.radius - 35);
                            aiTargetY = Math.max(minChefY + 30, hkPuck.y + 25);
                        }
                    } else {
                        // Offensive / Defensive strike
                        const lateralOffset = (hkPuck.x - goalCenter) * 0.12;
                        aiTargetX = hkPuck.x - lateralOffset;
                        aiTargetY = Math.max(minChefY, hkPuck.y - hkChefAI.radius - 14);
                    }
                } else {
                    // Puck in Player zone: AI guards its goal
                    const predictedX = hkPuck.x + (hkPuck.vx * 8);
                    const goalMouthLeft = goalCenter - (hkTable.goalWidth / 2) + 20;
                    const goalMouthRight = goalCenter + (hkTable.goalWidth / 2) - 20;
                    aiTargetX = Math.max(goalMouthLeft, Math.min(goalMouthRight, predictedX));
                    aiTargetY = hkTable.height * 0.14 + Math.sin(hkChefAuraAngle * 1.5) * 8;
                }

                // AI Movement towards target
                const dx = aiTargetX - hkChefAI.x;
                const dy = aiTargetY - hkChefAI.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 1.5) {
                    const step = Math.min(dist, hkChefAI.currentSpeed);
                    hkChefAI.vx = (dx / dist) * step;
                    hkChefAI.vy = (dy / dist) * step;
                    hkChefAI.x += hkChefAI.vx;
                    hkChefAI.y += hkChefAI.vy;
                } else {
                    hkChefAI.vx = 0;
                    hkChefAI.vy = 0;
                }

                // Clamp AI inside its half
                hkChefAI.x = Math.max(minChefX, Math.min(maxChefX, hkChefAI.x));
                hkChefAI.y = Math.max(minChefY, Math.min(maxChefY, hkChefAI.y));
            }

            // 4. Puck Physics (2 sub-steps for smooth collision and anti-tunneling)
            if (hkGameState === 'PLAYING') {
                const subSteps = 2;
                const goalLeft = (hkTable.width - hkTable.goalWidth) / 2;
                const goalRight = (hkTable.width + hkTable.goalWidth) / 2;
                const railInset = 10;
                const bevel = hkTable.cornerBevel || 42;
                const nDiag = 0.70710678; // 1 / Math.sqrt(2)

                for (let step = 0; step < subSteps; step++) {
                    hkPuck.x += (hkPuck.vx / subSteps);
                    hkPuck.y += (hkPuck.vy / subSteps);

                    hkPuck.vx *= Math.pow(hkPuck.friction, 1 / subSteps);
                    hkPuck.vy *= Math.pow(hkPuck.friction, 1 / subSteps);

                    const currentVel = Math.hypot(hkPuck.vx, hkPuck.vy);
                    if (currentVel > hkPuck.maxSpeed) {
                        hkPuck.vx = (hkPuck.vx / currentVel) * hkPuck.maxSpeed;
                        hkPuck.vy = (hkPuck.vy / currentVel) * hkPuck.maxSpeed;
                    }

                    // --- 4A. ANGLED CORNER DEFLECTORS (PHYSICAL BEVELS) ---
                    // Top-Left Corner Deflector
                    const dTopLeft = (hkPuck.x - railInset) + (hkPuck.y - railInset);
                    if (dTopLeft < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dTopLeft;
                        hkPuck.x += overlap * nDiag;
                        hkPuck.y += overlap * nDiag;
                        const vDot = hkPuck.vx * nDiag + hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx - 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy - 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx < 2) hkPuck.vx = 2.5;
                            if (hkPuck.vy < 2) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 8, 1.4);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 4, maxRadius: 28, alpha: 0.85, color: '#39ff14', lineWidth: 2 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Top-Right Corner Deflector
                    const dTopRight = (hkTable.width - railInset - hkPuck.x) + (hkPuck.y - railInset);
                    if (dTopRight < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dTopRight;
                        hkPuck.x -= overlap * nDiag;
                        hkPuck.y += overlap * nDiag;
                        const vDot = -hkPuck.vx * nDiag + hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx + 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy - 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx > -2) hkPuck.vx = -2.5;
                            if (hkPuck.vy < 2) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 8, 1.4);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 4, maxRadius: 28, alpha: 0.85, color: '#39ff14', lineWidth: 2 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Bottom-Left Corner Deflector
                    const dBotLeft = (hkPuck.x - railInset) + (hkTable.height - railInset - hkPuck.y);
                    if (dBotLeft < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dBotLeft;
                        hkPuck.x += overlap * nDiag;
                        hkPuck.y -= overlap * nDiag;
                        const vDot = hkPuck.vx * nDiag - hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx - 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy + 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx < 2) hkPuck.vx = 2.5;
                            if (hkPuck.vy > -2) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00f2fe', 8, 1.4);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 4, maxRadius: 28, alpha: 0.85, color: '#00f2fe', lineWidth: 2 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Bottom-Right Corner Deflector
                    const dBotRight = (hkTable.width - railInset - hkPuck.x) + (hkTable.height - railInset - hkPuck.y);
                    if (dBotRight < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dBotRight;
                        hkPuck.x -= overlap * nDiag;
                        hkPuck.y -= overlap * nDiag;
                        const vDot = -hkPuck.vx * nDiag - hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx + 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy + 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx > -2) hkPuck.vx = -2.5;
                            if (hkPuck.vy > -2) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00f2fe', 8, 1.4);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 4, maxRadius: 28, alpha: 0.85, color: '#00f2fe', lineWidth: 2 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4B. WALL COLLISION: SIDES ---
                    if (hkPuck.x - hkPuck.radius < railInset) {
                        hkPuck.x = railInset + hkPuck.radius;
                        hkPuck.vx = Math.abs(hkPuck.vx) * 0.98;
                        if (hkPuck.vx < 1.5) hkPuck.vx = 2.0;
                        createHkSparks(hkPuck.x, hkPuck.y, '#00f2fe', 6, 1);
                        hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 3, maxRadius: 24, alpha: 0.75, color: '#00f2fe', lineWidth: 1.8 });
                        playHkSound('WALL_BOUNCE');
                    } else if (hkPuck.x + hkPuck.radius > hkTable.width - railInset) {
                        hkPuck.x = hkTable.width - railInset - hkPuck.radius;
                        hkPuck.vx = -Math.abs(hkPuck.vx) * 0.98;
                        if (hkPuck.vx > -1.5) hkPuck.vx = -2.0;
                        createHkSparks(hkPuck.x, hkPuck.y, '#00f2fe', 6, 1);
                        hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 3, maxRadius: 24, alpha: 0.75, color: '#00f2fe', lineWidth: 1.8 });
                        playHkSound('WALL_BOUNCE');
                    }

                    // --- 4C. WALL COLLISION: TOP (CHEF SIDE) ---
                    if (hkPuck.y - hkPuck.radius < railInset) {
                        if (hkPuck.x >= goalLeft && hkPuck.x <= goalRight) {
                            if (hkPuck.y < -4) {
                                handleGoalScored('PLAYER');
                                break;
                            }
                        } else {
                            hkPuck.y = railInset + hkPuck.radius;
                            hkPuck.vy = Math.abs(hkPuck.vy) * 0.98;
                            if (hkPuck.vy < 1.5) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#ff4757', 6, 1);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 3, maxRadius: 24, alpha: 0.75, color: '#ff4757', lineWidth: 1.8 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4D. WALL COLLISION: BOTTOM (PLAYER SIDE) ---
                    if (hkPuck.y + hkPuck.radius > hkTable.height - railInset) {
                        if (hkPuck.x >= goalLeft && hkPuck.x <= goalRight) {
                            if (hkPuck.y > hkTable.height + 4) {
                                handleGoalScored('CHEF');
                                break;
                            }
                        } else {
                            hkPuck.y = hkTable.height - railInset - hkPuck.radius;
                            hkPuck.vy = -Math.abs(hkPuck.vy) * 0.98;
                            if (hkPuck.vy > -1.5) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00f2fe', 6, 1);
                            hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 3, maxRadius: 24, alpha: 0.75, color: '#00f2fe', lineWidth: 1.8 });
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4E. STRIKER VS PUCK COLLISION ---
                    function resolveStrikerPuck(striker, isPlayer) {
                        const cdx = hkPuck.x - striker.x;
                        const cdy = hkPuck.y - striker.y;
                        const dist = Math.hypot(cdx, cdy);
                        const minDist = hkPuck.radius + striker.radius;

                        if (dist < minDist && dist > 0.001) {
                            const nx = cdx / dist;
                            const ny = cdy / dist;

                            // Prevent sandwich/pinching against walls
                            if (!isPlayer && hkPuck.y < 35 && ny < 0) {
                                striker.y = Math.max(striker.radius + 15, striker.y + 4);
                                hkPuck.vy = Math.max(4.0, Math.abs(hkPuck.vy) + 2.0);
                                hkPuck.vx += (hkPuck.x < goalCenter ? 2.5 : -2.5);
                            } else {
                                hkPuck.x = striker.x + nx * (minDist + 1);
                                hkPuck.y = striker.y + ny * (minDist + 1);
                            }

                            const rvx = hkPuck.vx - striker.vx;
                            const rvy = hkPuck.vy - striker.vy;
                            const velAlongNorm = rvx * nx + rvy * ny;

                            if (velAlongNorm < 0) {
                                const elasticity = 1.32;
                                const impulse = -(1 + elasticity) * velAlongNorm;
                                hkPuck.vx += nx * impulse + striker.vx * 0.65;
                                hkPuck.vy += ny * impulse + striker.vy * 0.65;

                                const hitSpeed = Math.hypot(hkPuck.vx, hkPuck.vy);
                                playHkSound('PUCK_HIT', hitSpeed);
                                createHkSparks(striker.x + nx * striker.radius, striker.y + ny * striker.radius, isPlayer ? '#00f2fe' : '#ffa502', 12, 1.4);

                                // Impact Shockwave ring
                                hkShockwaves.push({
                                    x: hkPuck.x, y: hkPuck.y,
                                    radius: 6, maxRadius: isPlayer ? 48 : 42,
                                    alpha: 1.0, color: isPlayer ? '#00f2fe' : '#ff4757',
                                    lineWidth: 2.5
                                });

                                // Ice scratch on powerful hit
                                if (hitSpeed > 7) {
                                    hkIceScratches.push({
                                        x1: striker.x, y1: striker.y,
                                        x2: striker.x + nx * (striker.radius + 18), y2: striker.y + ny * (striker.radius + 18),
                                        alpha: 0.75, width: Math.min(2.5, hitSpeed * 0.16)
                                    });
                                }

                                if (hitSpeed > 10) hkCameraShake = 5;
                            } else {
                                hkPuck.vx += nx * 2.5;
                                hkPuck.vy += ny * 2.5;
                            }
                        }
                    }

                    resolveStrikerPuck(hkPlayer, true);
                    resolveStrikerPuck(hkChefAI, false);
                }

                // --- 4F. ANTI-STUCK CYBER AIR-JET WATCHDOG ---
                const currentSpeed = Math.hypot(hkPuck.vx, hkPuck.vy);
                const isNearAiCorner = hkPuck.y < 95 && (hkPuck.x < 95 || hkPuck.x > hkTable.width - 95);
                const isNearDeadZone = hkPuck.y < 42;

                if (currentSpeed < 1.0 || (isNearAiCorner && currentSpeed < 2.0) || (isNearDeadZone && currentSpeed < 1.8)) {
                    hkPuckStuckCounter = (hkPuckStuckCounter || 0) + 1;
                    if (hkPuckStuckCounter > 40) { // ~0.65 seconds
                        const angleToCenter = Math.atan2((hkTable.height / 2) - hkPuck.y, (hkTable.width / 2) - hkPuck.x);
                        const kickSpeed = 6.0 + Math.random() * 2.0;
                        hkPuck.vx = Math.cos(angleToCenter) * kickSpeed;
                        hkPuck.vy = Math.sin(angleToCenter) * kickSpeed;
                        createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 18, 2.0);
                        hkShockwaves.push({ x: hkPuck.x, y: hkPuck.y, radius: 4, maxRadius: 36, alpha: 0.9, color: '#39ff14', lineWidth: 2 });
                        playHkSound('WALL_BOUNCE');
                        hkChefAI.dialogue = "Chef AI: Corner jet activated! Puck cleared! 💨";
                        hkChefAI.dialogueTimer = 140;
                        hkPuckStuckCounter = 0;
                    }
                } else {
                    hkPuckStuckCounter = 0;
                }

                // Update Puck Angle and Plasma Trail
                hkPuck.angle = (hkPuck.angle || 0) + (hkPuck.vx * 0.04 + hkPuck.vy * 0.02);
                hkPuck.trail.unshift({ x: hkPuck.x, y: hkPuck.y, speed: currentSpeed });
                if (hkPuck.trail.length > 10) hkPuck.trail.pop();
            }

            // 5. Goal Scored Handler
            function handleGoalScored(scorer) {
                hkGameState = 'GOAL_PAUSE';
                hkPauseTimer = 75;
                hkCameraShake = 16;
                hkGoalLightPulse = 75;
                hkLastScorer = scorer;

                if (scorer === 'PLAYER') {
                    hkScore.player++;
                    hkBannerText = '⚡ GOAL FOR PLAYER! ⚡';
                    hkBannerColor = '#00f2fe';
                    playHkSound('GOAL_PLAYER');
                    createHkConfetti(hkPuck.x, 20);
                    hkShockwaves.push({ x: hkPuck.x, y: 16, radius: 10, maxRadius: 110, alpha: 1.0, color: '#00f2fe', lineWidth: 3.5 });

                    const taunts = [
                        'Chef AI: Nice shot! Let me turn up the heat! 🔥',
                        'Chef AI: Wow, quick wrist! Time to get serious! 🔥',
                        'Chef AI: Chef Master Mode Sizzling! ⚡👨‍🍳🔥',
                        'Chef AI: Incredible angle! You are good! 🔥',
                        'Chef AI: MASTER OF THE AIR RINK! 🎉'
                    ];
                    hkChefAI.dialogue = taunts[Math.min(hkScore.player - 1, taunts.length - 1)];
                    hkChefAI.dialogueTimer = 220;

                    const targetTar = parseInt((window.rules && window.rules.hockeyTar) || 5);
                    const targetDisc = parseInt((window.rules && window.rules.hockeyDisc) || 15);

                    if (hkScore.player >= targetTar) {
                        playHkSound('MILESTONE');
                        createHkConfetti(hkTable.width / 2, hkTable.height / 2);
                        if (typeof triggerRewardCoupon === 'function') {
                            triggerRewardCoupon(targetDisc);
                        }
                        hkBannerText = `🎉 ${targetDisc}% OFF UNLOCKED! 🎉`;
                        hkBannerColor = '#39ff14';
                    }

                    resetHkPuck(false);
                } else {
                    hkScore.chef++;
                    hkBannerText = '👨‍🍳 CHEF AI SCORED! 👨‍🍳';
                    hkBannerColor = '#ff4757';
                    playHkSound('GOAL_CHEF');
                    createHkSparks(hkPuck.x, hkTable.height - 20, '#ff4757', 30, 2);
                    hkShockwaves.push({ x: hkPuck.x, y: hkTable.height - 16, radius: 10, maxRadius: 110, alpha: 1.0, color: '#ff4757', lineWidth: 3.5 });

                    const chefBrags = [
                        'Chef AI: Order up! Chef scores! 👨‍🍳🔥',
                        'Chef AI: Secret recipe smash! Delicious! 😋',
                        'Chef AI: Too fast for you, customer! ⚡'
                    ];
                    hkChefAI.dialogue = chefBrags[Math.floor(Math.random() * chefBrags.length)];
                    hkChefAI.dialogueTimer = 200;

                    resetHkPuck(true);
                }
            }

            // 6. Draw Table Scene
            renderCyberAirHockeyScene();
        }

        // ===================================================================
        //PRO ARCADE AIR HOCKEY HIGH-END 3D GRAPHICS RENDERER
        // ===================================================================
        function renderCyberAirHockeyScene() {
            const ctx = hkCtx;
            const W = hkTable.width;
            const H = hkTable.height;
            const goalLeft = (W - hkTable.goalWidth) / 2;
            const goalRight = (W + hkTable.goalWidth) / 2;
            const goalW = hkTable.goalWidth;

            ctx.save();

            // Screen Shake on Goal or Heavy Hit
            if (hkCameraShake > 0) {
                const sx = (Math.random() - 0.5) * hkCameraShake;
                const sy = (Math.random() - 0.5) * hkCameraShake;
                ctx.translate(sx, sy);
                hkCameraShake *= 0.88;
                if (hkCameraShake < 0.2) hkCameraShake = 0;
            }

            // LAYER 1: Rink Playing Field
            if (hkBackgroundImage && hkBackgroundImage.complete && hkBackgroundImage.naturalWidth > 0) {
                ctx.drawImage(hkBackgroundImage, 0, 0, W, H);
            } else {
                // High-End Radial Ice Arena Fallback
                const rinkGrad = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, H * 0.75);
                rinkGrad.addColorStop(0, '#101a2e');
                rinkGrad.addColorStop(0.65, '#080d19');
                rinkGrad.addColorStop(1, '#020408');
                ctx.fillStyle = rinkGrad;
                ctx.fillRect(0, 0, W, H);
            }

            // LAYER 2: Stadium Lighting & Vignette Overlay (Gives true stadium focus)
            const arenaVignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, H * 0.72);
            arenaVignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            arenaVignette.addColorStop(0.7, 'rgba(3, 8, 20, 0.20)');
            arenaVignette.addColorStop(1, 'rgba(1, 4, 10, 0.60)');
            ctx.fillStyle = arenaVignette;
            ctx.fillRect(0, 0, W, H);

            // LAYER 3: Dynamic Ice Surface Lighting (Puck & Striker Glows on Ice)
            const puckSpeed = Math.hypot(hkPuck.vx, hkPuck.vy);
            const puckGlowRad = Math.max(26, hkPuck.radius * 2.8 + puckSpeed * 1.5);
            let puckGlowColor = 'rgba(0, 242, 254, 0.22)';
            if (puckSpeed > 13) puckGlowColor = 'rgba(255, 215, 0, 0.35)';
            else if (puckSpeed > 7) puckGlowColor = 'rgba(255, 71, 87, 0.28)';

            const puckIceGrad = ctx.createRadialGradient(hkPuck.x, hkPuck.y, 2, hkPuck.x, hkPuck.y, puckGlowRad);
            puckIceGrad.addColorStop(0, puckGlowColor);
            puckIceGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = puckIceGrad;
            ctx.beginPath();
            ctx.arc(hkPuck.x, hkPuck.y, puckGlowRad, 0, Math.PI * 2);
            ctx.fill();

            // Player Striker Ice Glow
            const plyrIceGrad = ctx.createRadialGradient(hkPlayer.x, hkPlayer.y, 4, hkPlayer.x, hkPlayer.y, hkPlayer.radius * 2.2);
            plyrIceGrad.addColorStop(0, 'rgba(0, 210, 255, 0.22)');
            plyrIceGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = plyrIceGrad;
            ctx.beginPath();
            ctx.arc(hkPlayer.x, hkPlayer.y, hkPlayer.radius * 2.2, 0, Math.PI * 2);
            ctx.fill();

            // Chef AI Striker Ice Glow
            const chefIceGrad = ctx.createRadialGradient(hkChefAI.x, hkChefAI.y, 4, hkChefAI.x, hkChefAI.y, hkChefAI.radius * 2.2);
            chefIceGrad.addColorStop(0, 'rgba(255, 71, 87, 0.22)');
            chefIceGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = chefIceGrad;
            ctx.beginPath();
            ctx.arc(hkChefAI.x, hkChefAI.y, hkChefAI.radius * 2.2, 0, Math.PI * 2);
            ctx.fill();

            // LAYER 4: Dynamic Ice Scratches & Impact Shockwaves
            for (let i = hkIceScratches.length - 1; i >= 0; i--) {
                const sc = hkIceScratches[i];
                ctx.strokeStyle = `rgba(225, 245, 255, ${Math.max(0, sc.alpha)})`;
                ctx.lineWidth = sc.width || 1.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(sc.x1, sc.y1);
                ctx.lineTo(sc.x2, sc.y2);
                ctx.stroke();
                sc.alpha -= 0.015;
                if (sc.alpha <= 0) hkIceScratches.splice(i, 1);
            }

            for (let i = hkShockwaves.length - 1; i >= 0; i--) {
                const sw = hkShockwaves[i];
                ctx.save();
                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = Math.max(0, sw.alpha);
                ctx.lineWidth = sw.lineWidth || 2;
                ctx.shadowColor = sw.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                sw.radius += (sw.maxRadius - sw.radius) * 0.22 + 1.2;
                sw.alpha -= 0.045;
                if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
                    hkShockwaves.splice(i, 1);
                }
            }

            // LAYER 5: 3D Goal Pockets & Laser Sensor Lines
            // Top Goal Pocket (Chef AI)
            const topGoalPocket = ctx.createLinearGradient(0, 0, 0, 16);
            topGoalPocket.addColorStop(0, '#020408');
            topGoalPocket.addColorStop(0.5, '#080d19');
            topGoalPocket.addColorStop(1, 'rgba(255, 71, 87, 0.15)');
            ctx.fillStyle = topGoalPocket;
            ctx.fillRect(goalLeft, 0, goalW, 16);

            // Hex Net lines inside top goal
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = goalLeft + 8; x < goalRight; x += 12) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 16);
                ctx.stroke();
            }
            for (let y = 4; y < 16; y += 4) {
                ctx.beginPath();
                ctx.moveTo(goalLeft, y);
                ctx.lineTo(goalRight, y);
                ctx.stroke();
            }

            // Glowing Laser Sensor Line across Chef Goal Threshold
            ctx.save();
            const topLaserGlow = (hkGoalLightPulse > 0 && hkLastScorer === 'PLAYER');
            ctx.strokeStyle = topLaserGlow ? '#ff0033' : 'rgba(255, 71, 87, 0.85)';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = topLaserGlow ? 22 : 10;
            ctx.lineWidth = topLaserGlow ? 3.5 : 2;
            ctx.beginPath();
            ctx.moveTo(goalLeft, 16);
            ctx.lineTo(goalRight, 16);
            ctx.stroke();

            // Metallic Goal Posts (Left & Right)
            [goalLeft, goalRight].forEach(px => {
                const postGrad = ctx.createLinearGradient(px - 4, 0, px + 4, 0);
                postGrad.addColorStop(0, '#747d8c');
                postGrad.addColorStop(0.4, '#ffffff');
                postGrad.addColorStop(1, '#2f3542');
                ctx.fillStyle = postGrad;
                ctx.fillRect(px - 3.5, 0, 7, 18);
                // Siren LED beacon on post
                const beaconColor = topLaserGlow ? '#ff0033' : '#ff4757';
                ctx.fillStyle = beaconColor;
                ctx.shadowColor = beaconColor;
                ctx.shadowBlur = topLaserGlow ? 16 : 6;
                ctx.beginPath();
                ctx.arc(px, 16, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Bottom Goal Pocket (Player)
            const botGoalPocket = ctx.createLinearGradient(0, H - 16, 0, H);
            botGoalPocket.addColorStop(0, 'rgba(0, 242, 254, 0.15)');
            botGoalPocket.addColorStop(0.5, '#080d19');
            botGoalPocket.addColorStop(1, '#020408');
            ctx.fillStyle = botGoalPocket;
            ctx.fillRect(goalLeft, H - 16, goalW, 16);

            // Hex Net lines inside bottom goal
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = goalLeft + 8; x < goalRight; x += 12) {
                ctx.beginPath();
                ctx.moveTo(x, H - 16);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = H - 12; y < H; y += 4) {
                ctx.beginPath();
                ctx.moveTo(goalLeft, y);
                ctx.lineTo(goalRight, y);
                ctx.stroke();
            }

            // Glowing Laser Sensor Line across Player Goal Threshold
            ctx.save();
            const botLaserGlow = (hkGoalLightPulse > 0 && hkLastScorer === 'CHEF');
            ctx.strokeStyle = botLaserGlow ? '#00f2fe' : 'rgba(0, 242, 254, 0.85)';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = botLaserGlow ? 22 : 10;
            ctx.lineWidth = botLaserGlow ? 3.5 : 2;
            ctx.beginPath();
            ctx.moveTo(goalLeft, H - 16);
            ctx.lineTo(goalRight, H - 16);
            ctx.stroke();

            // Metallic Goal Posts (Bottom Left & Right)
            [goalLeft, goalRight].forEach(px => {
                const postGrad = ctx.createLinearGradient(px - 4, 0, px + 4, 0);
                postGrad.addColorStop(0, '#747d8c');
                postGrad.addColorStop(0.4, '#ffffff');
                postGrad.addColorStop(1, '#2f3542');
                ctx.fillStyle = postGrad;
                ctx.fillRect(px - 3.5, H - 18, 7, 18);
                // Siren LED beacon on post
                const beaconColor = botLaserGlow ? '#00f2fe' : '#4facfe';
                ctx.fillStyle = beaconColor;
                ctx.shadowColor = beaconColor;
                ctx.shadowBlur = botLaserGlow ? 16 : 6;
                ctx.beginPath();
                ctx.arc(px, H - 16, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // LAYER 6: Sleek Perimeter Dasher Trim & Corner Deflector Caps
            const bevel = hkTable.cornerBevel || 42;
            const rInset = 10;

            function drawCornerCap(cx, cy, angle) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bevel * 0.75, 0);
                ctx.lineTo(0, bevel * 0.75);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Micro Air-Jet LED emitter
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = '#39ff14';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(bevel * 0.22, bevel * 0.22, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawCornerCap(rInset, rInset, 0);
            drawCornerCap(W - rInset, rInset, Math.PI / 2);
            drawCornerCap(W - rInset, H - rInset, Math.PI);
            drawCornerCap(rInset, H - rInset, -Math.PI / 2);

            // Subtle Dasher Rails (Sleek brushed aluminum framing with thin ambient neon line)
            ctx.save();
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Top Chef Half Rails (Deep Crimson with soft glow)
            ctx.strokeStyle = 'rgba(255, 71, 87, 0.75)';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(goalLeft, rInset);
            ctx.lineTo(rInset + bevel, rInset);
            ctx.lineTo(rInset, rInset + bevel);
            ctx.lineTo(rInset, H / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(goalRight, rInset);
            ctx.lineTo(W - rInset - bevel, rInset);
            ctx.lineTo(W - rInset, rInset + bevel);
            ctx.lineTo(W - rInset, H / 2);
            ctx.stroke();

            // Bottom Player Half Rails (Deep Electric Cyan with soft glow)
            ctx.strokeStyle = 'rgba(0, 242, 254, 0.75)';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(rInset, H / 2);
            ctx.lineTo(rInset, H - rInset - bevel);
            ctx.lineTo(rInset + bevel, H - rInset);
            ctx.lineTo(goalLeft, H - rInset);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(W - rInset, H / 2);
            ctx.lineTo(W - rInset, H - rInset - bevel);
            ctx.lineTo(W - rInset - bevel, H - rInset);
            ctx.lineTo(goalRight, H - rInset);
            ctx.stroke();
            ctx.restore();

            // LAYER 7: Pro-Arcade 3D Air Hockey Puck with Dynamic Spin & Plasma Comet Trail
            const trailLen = hkPuck.trail.length;
            for (let i = 0; i < trailLen; i++) {
                const pt = hkPuck.trail[i];
                const factor = 1 - (i / trailLen);
                const trRad = hkPuck.radius * (0.35 + factor * 0.55);
                const trAlpha = factor * (pt.speed > 10 ? 0.65 : 0.40);

                let trColor = `rgba(0, 242, 254, ${trAlpha})`;
                if (pt.speed > 13) trColor = `rgba(255, 215, 0, ${trAlpha})`;
                else if (pt.speed > 7) trColor = `rgba(255, 71, 87, ${trAlpha})`;

                ctx.save();
                ctx.fillStyle = trColor;
                ctx.shadowColor = trColor;
                ctx.shadowBlur = 10 * factor;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, trRad, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 3D Puck Body
            ctx.save();
            const px = hkPuck.x;
            const py = hkPuck.y;
            const pr = hkPuck.radius;

            // 1. Soft Floor Shadow on Ice
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.beginPath();
            ctx.ellipse(px + 2, py + 4, pr * 1.05, pr * 0.88, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. Beveled Dark Carbon Composite Outer Cylinder
            const puckRimGrad = ctx.createRadialGradient(px - pr * 0.35, py - pr * 0.35, 2, px, py, pr);
            puckRimGrad.addColorStop(0, '#485460');
            puckRimGrad.addColorStop(0.5, '#1e272e');
            puckRimGrad.addColorStop(1, '#05070a');
            ctx.fillStyle = puckRimGrad;
            ctx.beginPath();
            ctx.arc(px, py, pr, 0, Math.PI * 2);
            ctx.fill();

            // Outer Polished Bevel Stroke
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 3. Inner Recessed Face
            const innerR = pr * 0.76;
            const puckFaceGrad = ctx.createRadialGradient(px + pr * 0.2, py + pr * 0.2, 1, px, py, innerR);
            puckFaceGrad.addColorStop(0, '#1e272e');
            puckFaceGrad.addColorStop(0.8, '#0f1318');
            puckFaceGrad.addColorStop(1, '#000000');
            ctx.fillStyle = puckFaceGrad;
            ctx.beginPath();
            ctx.arc(px, py, innerR, 0, Math.PI * 2);
            ctx.fill();

            // 4. Rotating Dynamic Spin Turbine Slots (Gives authentic motion blur & spin)
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(hkPuck.angle || 0);

            const slotColor = puckSpeed > 13 ? '#ffd32a' : (puckSpeed > 7 ? '#ff4757' : '#00f2fe');
            ctx.fillStyle = slotColor;
            ctx.shadowColor = slotColor;
            ctx.shadowBlur = puckSpeed > 7 ? 12 : 5;

            for (let s = 0; s < 4; s++) {
                ctx.rotate(Math.PI / 2);
                ctx.beginPath();
                ctx.arc(innerR * 0.55, 0, innerR * 0.18, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(innerR * 0.25, -1, innerR * 0.38, 2);
            }
            ctx.restore();

            // 5. Center Reactor Core
            const coreColor = puckSpeed > 13 ? '#ffffff' : (puckSpeed > 7 ? '#ff9ff3' : '#e0ffff');
            ctx.fillStyle = coreColor;
            ctx.shadowColor = slotColor;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(px, py, innerR * 0.32, 0, Math.PI * 2);
            ctx.fill();

            // Specular Glass Glare across top
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
            ctx.beginPath();
            ctx.ellipse(px - pr * 0.28, py - pr * 0.28, pr * 0.28, pr * 0.14, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // LAYER 8: Pro-Arcade 3D Ergonomic Pushers / Mallets (Chef & Player)
            function drawProPusher(x, y, radius, isPlayer) {
                ctx.save();

                // 1. Soft Physical Drop Shadow on Ice
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                ctx.beginPath();
                ctx.ellipse(x + 4, y + 7, radius * 1.05, radius * 0.88, 0, 0, Math.PI * 2);
                ctx.fill();

                // 2. Base Flange / Protective Bumper (Lower wide ring)
                const baseGrad = ctx.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.1, x, y, radius);
                if (isPlayer) {
                    baseGrad.addColorStop(0, '#e0f7fa');
                    baseGrad.addColorStop(0.25, '#00e5ff');
                    baseGrad.addColorStop(0.65, '#00838f');
                    baseGrad.addColorStop(1, '#00363a');
                } else {
                    baseGrad.addColorStop(0, '#ffebee');
                    baseGrad.addColorStop(0.25, '#ff5252');
                    baseGrad.addColorStop(0.65, '#c62828');
                    baseGrad.addColorStop(1, '#4a0e17');
                }
                ctx.fillStyle = baseGrad;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();

                // Outer Bumper Chamfer Stroke
                ctx.strokeStyle = isPlayer ? 'rgba(0, 242, 254, 0.85)' : 'rgba(255, 71, 87, 0.85)';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                // 3. Recessed Inner Well (Dish)
                const wellR = radius * 0.72;
                const wellGrad = ctx.createRadialGradient(x + wellR * 0.2, y + wellR * 0.2, 1, x, y, wellR);
                if (isPlayer) {
                    wellGrad.addColorStop(0, '#002538');
                    wellGrad.addColorStop(0.7, '#001420');
                    wellGrad.addColorStop(1, '#004866');
                } else {
                    wellGrad.addColorStop(0, '#380008');
                    wellGrad.addColorStop(0.7, '#200004');
                    wellGrad.addColorStop(1, '#660012');
                }
                ctx.fillStyle = wellGrad;
                ctx.beginPath();
                ctx.arc(x, y, wellR, 0, Math.PI * 2);
                ctx.fill();

                // Radial Tech Ticks inside Well
                ctx.strokeStyle = isPlayer ? 'rgba(0, 242, 254, 0.45)' : 'rgba(255, 170, 0, 0.45)';
                ctx.lineWidth = 1.2;
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    const cosA = Math.cos(a);
                    const sinA = Math.sin(a);
                    ctx.beginPath();
                    ctx.moveTo(x + cosA * (wellR * 0.75), y + sinA * (wellR * 0.75));
                    ctx.lineTo(x + cosA * (wellR * 0.95), y + sinA * (wellR * 0.95));
                    ctx.stroke();
                }

                // 4. Center Ergonomic Grip Knob (Handle Dome)
                const knobR = radius * 0.44;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.beginPath();
                ctx.arc(x + 1.5, y + 2.5, knobR, 0, Math.PI * 2);
                ctx.fill();

                const knobGrad = ctx.createRadialGradient(x - knobR * 0.35, y - knobR * 0.35, 1, x, y, knobR);
                if (isPlayer) {
                    knobGrad.addColorStop(0, '#ffffff');
                    knobGrad.addColorStop(0.3, '#00f2fe');
                    knobGrad.addColorStop(0.75, '#0984e3');
                    knobGrad.addColorStop(1, '#003366');
                } else {
                    knobGrad.addColorStop(0, '#fff3e0');
                    knobGrad.addColorStop(0.3, '#ffa502');
                    knobGrad.addColorStop(0.75, '#ff4757');
                    knobGrad.addColorStop(1, '#53000d');
                }
                ctx.fillStyle = knobGrad;
                ctx.beginPath();
                ctx.arc(x, y, knobR, 0, Math.PI * 2);
                ctx.fill();

                // Knob Specular Glint
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.beginPath();
                ctx.ellipse(x - knobR * 0.32, y - knobR * 0.32, knobR * 0.28, knobR * 0.16, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                // Center Crest Emblem
                if (isPlayer) {
                    ctx.fillStyle = '#00f2fe';
                    ctx.shadowColor = '#00f2fe';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(x, y, 7.5, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 15px Segoe UI, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👨‍🍳', x, y);
                }

                ctx.restore();
            }

            // Draw Chef AI Mallet
            drawProPusher(hkChefAI.x, hkChefAI.y, hkChefAI.radius, false);

            // Draw Player Mallet
            drawProPusher(hkPlayer.x, hkPlayer.y, hkPlayer.radius, true);

            // LAYER 9: Impact Sparks & Celebratory Particles
            for (let i = hkParticles.length - 1; i >= 0; i--) {
                const p = hkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    hkParticles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // LAYER 10: Cyber Arcade Scoreboard HUD (Top Glass Capsule)
            const hudW = Math.min(W * 0.88, 360);
            const hudH = 46;
            const hudX = (W - hudW) / 2;
            const hudY = 18;

            ctx.save();
            const bezelGrad = ctx.createLinearGradient(hudX, hudY, hudX, hudY + hudH);
            bezelGrad.addColorStop(0, 'rgba(15, 23, 42, 0.92)');
            bezelGrad.addColorStop(1, 'rgba(7, 11, 20, 0.94)');
            ctx.fillStyle = bezelGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.roundRect(hudX, hudY, hudW, hudH, hudH / 2);
            ctx.fill();

            // Border rim with dual neon accent
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Flashing Siren Beacons at ends of scoreboard
            const isGoalSirens = (hkGoalLightPulse > 0);
            // Left Siren (Chef Side)
            ctx.fillStyle = (isGoalSirens && hkLastScorer === 'PLAYER') ? '#ff0033' : '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = (isGoalSirens && hkLastScorer === 'PLAYER') ? 18 : 6;
            ctx.beginPath();
            ctx.arc(hudX + 16, hudY + hudH / 2, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Right Siren (Player Side)
            ctx.fillStyle = (isGoalSirens && hkLastScorer === 'CHEF') ? '#00f2fe' : '#00e5ff';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = (isGoalSirens && hkLastScorer === 'CHEF') ? 18 : 6;
            ctx.beginPath();
            ctx.arc(hudX + hudW - 16, hudY + hudH / 2, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Chef AI Score (Left Section)
            const chefSectionX = hudX + hudW * 0.25;
            ctx.font = 'bold 9px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ff6b81';
            ctx.textAlign = 'center';
            ctx.fillText('CHEF AI', chefSectionX, hudY + 14);

            ctx.font = '900 24px "Segoe UI", sans-serif';
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 10;
            ctx.fillText(`${hkScore.chef}`, chefSectionX, hudY + 37);
            ctx.shadowBlur = 0;

            // VS & Speedometer Badge (Center Section)
            const centerHudX = hudX + hudW / 2;
            ctx.font = '900 11px "Segoe UI", sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fillText('VS', centerHudX, hudY + 16);

            ctx.font = 'bold 10px "Segoe UI", sans-serif';
            const speedDisplay = (puckSpeed * 4.6).toFixed(0);
            ctx.fillStyle = puckSpeed > 13 ? '#ffd32a' : (puckSpeed > 7 ? '#ff7675' : '#74b9ff');
            ctx.fillText(`⚡ ${speedDisplay} KM/H`, centerHudX, hudY + 34);

            // Player Score (Right Section)
            const plyrSectionX = hudX + hudW * 0.75;
            ctx.font = 'bold 9px "Segoe UI", sans-serif';
            ctx.fillStyle = '#70a1ff';
            ctx.fillText('YOU (P1)', plyrSectionX, hudY + 14);

            ctx.font = '900 24px "Segoe UI", sans-serif';
            ctx.fillStyle = '#00f2fe';
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 10;
            ctx.fillText(`${hkScore.player}`, plyrSectionX, hudY + 37);
            ctx.shadowBlur = 0;
            ctx.restore();

            // LAYER 11: Chef AI Communicator Pod
            if (hkChefAI.dialogue && hkChefAI.dialogueTimer > 0) {
                const commY = hudY + hudH + 8;
                ctx.font = '600 11px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                const textW = ctx.measureText(hkChefAI.dialogue).width;
                const commW = Math.min(W * 0.92, textW + 30);

                ctx.save();
                ctx.fillStyle = 'rgba(10, 15, 28, 0.92)';
                ctx.strokeStyle = 'rgba(255, 71, 87, 0.65)';
                ctx.lineWidth = 1.2;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect((W - commW) / 2, commY, commW, 24, 12);
                ctx.fill();
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#f1f2f6';
                ctx.fillText(hkChefAI.dialogue, W / 2, commY + 16);
                ctx.restore();
            }

            // LAYER 12: Target Matrix & Reward Progress Bar (Bottom Floating HUD)
            const targetTar = parseInt((window.rules && window.rules.hockeyTar) || 5);
            const targetDisc = parseInt((window.rules && window.rules.hockeyDisc) || 15);
            const isUnlocked = hkScore.player >= targetTar;

            const pillW = Math.min(W * 0.88, 340);
            const pillH = 34;
            const pillX = (W - pillW) / 2;
            const pillY = H - pillH - 14;

            ctx.save();
            ctx.fillStyle = 'rgba(12, 17, 30, 0.9)';
            ctx.strokeStyle = isUnlocked ? 'rgba(57, 255, 20, 0.7)' : 'rgba(0, 242, 254, 0.4)';
            ctx.lineWidth = 1.2;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(pillX, pillY, pillW, pillH, pillH / 2);
            ctx.fill();
            ctx.stroke();

            // Progress bar underlay
            const progressRatio = Math.min(1.0, hkScore.player / targetTar);
            const barW = pillW - 24;
            const barH = 4;
            const barX = pillX + 12;
            const barY = pillY + pillH - 8;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, barH, 2);
            ctx.fill();

            const fillGrad = ctx.createLinearGradient(barX, 0, barX + barW * progressRatio, 0);
            fillGrad.addColorStop(0, '#00f2fe');
            fillGrad.addColorStop(1, isUnlocked ? '#39ff14' : '#ffd32a');
            ctx.fillStyle = fillGrad;
            ctx.shadowColor = isUnlocked ? '#39ff14' : '#00f2fe';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW * progressRatio, barH, 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.font = 'bold 11px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            if (isUnlocked) {
                ctx.fillStyle = '#39ff14';
                ctx.fillText(`🎉 TARGET WON: ${targetDisc}% OFF UNLOCKED! (${hkScore.player}/${targetTar})`, W / 2, pillY + 16);
            } else {
                ctx.fillStyle = '#dfe4ea';
                ctx.fillText(`🎯 CHALLENGE: Score ${targetTar} Goals for ${targetDisc}% OFF (${hkScore.player}/${targetTar})`, W / 2, pillY + 16);
            }
            ctx.restore();

            // LAYER 13: Celebratory Goal Banner with 3D Holographic Sweep
            if (hkBannerText && hkGameState === 'GOAL_PAUSE') {
                ctx.save();
                ctx.fillStyle = 'rgba(2, 6, 16, 0.82)';
                ctx.fillRect(0, H / 2 - 50, W, 100);

                ctx.strokeStyle = hkBannerColor;
                ctx.shadowColor = hkBannerColor;
                ctx.shadowBlur = 18;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, H / 2 - 50);
                ctx.lineTo(W, H / 2 - 50);
                ctx.moveTo(0, H / 2 + 50);
                ctx.lineTo(W, H / 2 + 50);
                ctx.stroke();

                ctx.font = 'bold 12px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'center';
                ctx.fillText('CYBER AIR HOCKEY ARENA', W / 2, H / 2 - 24);

                ctx.font = '900 26px "Segoe UI", sans-serif';
                ctx.fillStyle = hkBannerColor;
                ctx.shadowColor = hkBannerColor;
                ctx.shadowBlur = 20;
                ctx.fillText(hkBannerText, W / 2, H / 2 + 12);
                ctx.restore();
            }

            ctx.restore();
        }

        // Global exports
        if (typeof safeExport === 'function') {
            safeExport('initAirHockeyGame', typeof initAirHockeyGame !== 'undefined' ? initAirHockeyGame : undefined);
            safeExport('frameUpdateAirHockey', typeof frameUpdateAirHockey !== 'undefined' ? frameUpdateAirHockey : undefined);
        }
        window.initAirHockeyGame = initAirHockeyGame;
        window.frameUpdateAirHockey = frameUpdateAirHockey;

        window.returnToCustomerMenu = returnToCustomerMenu;
    </script>
</body>

</html>
