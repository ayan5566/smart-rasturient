        function frameUpdateTowerBloxx() {
            if (!towerCanvasElement || !twCtx) return;

            twCtx.clearRect(0, 0, towerCanvasElement.width, towerCanvasElement.height);

            //1. SMOOTH CINEMATIC MONOTONIC CAMERA TRACKING LOGIC
            let surfaceAnchorBaseBlock = activeTowerBlocksArray[activeTowerBlocksArray.length - 1];
            let structuralTargetLandingY = surfaceAnchorBaseBlock.y;

            // Crane stays fixed in relative distance above top floor
            currentSwingingBlock.pivotY = structuralTargetLandingY - 175;

            // Smooth monotonic upward tracking: lock crane to comfortable view below HUD (~64px)
            // Eliminates any bouncing, dipping down and up at 4-5 blocks!
            const targetScreenCraneY = 64;
            towerTargetCameraY = Math.max(0, targetScreenCraneY - currentSwingingBlock.pivotY);

            // Progressive altitude zoom (subtle 0.88 cap at high altitude)
            towerTargetZoom = Math.max(0.88, 1.0 - (towerScoreCounter * 0.0025));

            // Smooth Lerp Interpolation
            towerSmoothCameraY += (towerTargetCameraY - towerSmoothCameraY) * 0.085;
            towerCameraZoom += (towerTargetZoom - towerCameraZoom) * 0.05;
            towerCameraOffsetOffsetY = towerSmoothCameraY;

            // 2. Render 50-Floor Continuous Dynamic Atmosphere
            render50FloorAtmosphere(towerScoreCounter);

            // ==========================================
            //START WORLD SPACE MATRIX
            // ==========================================
            twCtx.save();

            // Camera Scroll & Screen Shake Vibration (Applied first in screen space)
            twCtx.translate(towerVisualVibrationScaleX, towerCameraOffsetOffsetY);

            // Focal-Point Zoom anchored directly at the Crane Pivot (zero vertical drift or jumping!)
            let canvasCenterX = towerCanvasElement.width / 2;
            let craneWorldPivotY = currentSwingingBlock.pivotY;
            twCtx.translate(canvasCenterX, craneWorldPivotY);
            twCtx.scale(towerCameraZoom, towerCameraZoom);
            twCtx.translate(-canvasCenterX, -craneWorldPivotY);

            if (towerVisualVibrationScaleX !== 0) {
                towerVisualVibrationScaleX *= -0.78;
                if (Math.abs(towerVisualVibrationScaleX) < 0.2) towerVisualVibrationScaleX = 0;
            }

            // Damped Spring Elastic Squash & Stretch Settling
            if (towerStackSquashY !== 0) {
                towerStackSquashY *= -0.72;
                if (Math.abs(towerStackSquashY) < 0.005) towerStackSquashY = 0;
            }

            // Stack Dynamic Structural Sway Settling
            if (towerStackSwayVel !== 0 || towerStackSwayAngle !== 0) {
                towerStackSwayAngle += towerStackSwayVel;
                towerStackSwayVel += -towerStackSwayAngle * 0.14;
                towerStackSwayVel *= 0.88;
                if (Math.abs(towerStackSwayAngle) < 0.001 && Math.abs(towerStackSwayVel) < 0.001) {
                    towerStackSwayAngle = 0;
                    towerStackSwayVel = 0;
                }
            }

            // 4. Render Placed Skyscraper Floors (with Elastic Spring Compression & Sway)
            let totalBlocks = activeTowerBlocksArray.length;
            activeTowerBlocksArray.forEach((block, idx) => {
                twCtx.save();

                // Compute elastic compression ripple on topmost placed blocks
                let distFromTop = totalBlocks - 1 - idx;
                let squashFactor = distFromTop <= 4 ? Math.max(0, 1 - (distFromTop * 0.24)) : 0;
                let currentBlockSquashY = towerStackSquashY * block.h * squashFactor;

                // Subtle structural sway ripple along height
                let swayX = distFromTop <= 8 ? (towerStackSwayAngle * (8 - distFromTop) * 2.8) : 0;

                drawStylizedSquareBlock(
                    block.x + swayX,
                    block.y + currentBlockSquashY,
                    block.w,
                    block.h,
                    block.color,
                    idx,
                    block.isAnchor
                );

                twCtx.restore();
            });

            // 5. Update and Render Expanding Shockwave Rings
            for (let i = towerShockwavesArray.length - 1; i >= 0; i--) {
                let sw = towerShockwavesArray[i];
                sw.radius += 2.8;
                sw.alpha -= 0.045;
                if (sw.alpha <= 0) {
                    towerShockwavesArray.splice(i, 1);
                    continue;
                }
                twCtx.save();
                twCtx.strokeStyle = sw.color || '#facc15';
                twCtx.globalAlpha = Math.max(0, sw.alpha);
                twCtx.lineWidth = 2.4;
                twCtx.beginPath();
                twCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                twCtx.stroke();
                twCtx.restore();
            }

            // 6. Update and Render Particles (Sparks & Smoke Dust)
            for (let i = towerParticlesArray.length - 1; i >= 0; i--) {
                let p = towerParticlesArray[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;
                if (p.alpha <= 0) {
                    towerParticlesArray.splice(i, 1);
                    continue;
                }
                twCtx.fillStyle = p.color || `rgba(255, 255, 255, ${p.alpha})`;
                twCtx.globalAlpha = Math.max(0, p.alpha);
                twCtx.beginPath();
                twCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                twCtx.fill();
                twCtx.globalAlpha = 1.0;
            }

            // Update Concrete Pebble Debris
            for (let i = towerDebrisArray.length - 1; i >= 0; i--) {
                let d = towerDebrisArray[i];
                d.x += d.vx;
                d.y += d.vy;
                d.vy += 0.35; // gravity
                d.alpha -= 0.03;
                if (d.alpha <= 0) {
                    towerDebrisArray.splice(i, 1);
                    continue;
                }
                twCtx.fillStyle = d.color;
                twCtx.globalAlpha = Math.max(0, d.alpha);
                twCtx.fillRect(d.x, d.y, d.size, d.size);
                twCtx.globalAlpha = 1.0;
            }

            // Render Floating Text FX (PERFECT! / COMBOS)
            for (let i = towerFloatingTexts.length - 1; i >= 0; i--) {
                let ft = towerFloatingTexts[i];
                ft.y -= 0.9;
                ft.alpha -= 0.024;
                if (ft.alpha <= 0) {
                    towerFloatingTexts.splice(i, 1);
                    continue;
                }
                twCtx.save();
                twCtx.font = '900 14px "Segoe UI", system-ui, sans-serif';
                twCtx.fillStyle = `rgba(250, 204, 21, ${ft.alpha})`;
                twCtx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                twCtx.shadowBlur = 6;
                twCtx.fillText(ft.text, ft.x, ft.y);
                twCtx.restore();
            }

            // 7. â›“ï¸ SUSPENSION CABLE & CLAW (INFINITY âˆž MOTION ENGINE)
            let cranePivotX = currentSwingingBlock.pivotX;
            let cranePivotY = currentSwingingBlock.pivotY;

            if (!isTowerBlockDropping && towerGameState === 'PLAYING') {
                // â™¾ï¸ Mathematical Lemniscate (Infinity Symbol âˆž) Harmonic Motion
                currentSwingingBlock.swingTimer += currentSwingingBlock.speed;
                let t = currentSwingingBlock.swingTimer;

                // Horizontal Infinity âˆž Path: X ~ sin(t), Y ~ sin(2t)
                let infinityAmpX = currentSwingingBlock.length * Math.sin(currentSwingingBlock.maxAngle);
                let infinityAmpY = 18; // Vertical lobe loop elevation

                let offsetX = infinityAmpX * Math.sin(t);
                let offsetY = currentSwingingBlock.length + (infinityAmpY * Math.sin(2 * t));

                currentSwingingBlock.x = currentSwingingBlock.pivotX + offsetX - (currentSwingingBlock.w / 2);
                currentSwingingBlock.y = currentSwingingBlock.pivotY + offsetY - (currentSwingingBlock.h / 2);

                let blockCenterX = currentSwingingBlock.x + (currentSwingingBlock.w / 2);
                let blockTopY = currentSwingingBlock.y;

                // Suspension Cables Hanging Freely from Sky (Bar Removed!)
                twCtx.save();
                twCtx.strokeStyle = '#94a3b8';
                twCtx.lineWidth = 1.8;
                [-2.5, 2.5].forEach(offsetCable => {
                    twCtx.beginPath();
                    twCtx.moveTo(cranePivotX + offsetCable, cranePivotY - 50);
                    twCtx.lineTo(blockCenterX + offsetCable, blockTopY);
                    twCtx.stroke();
                });

                // Heavy Hydraulic Spreader Beam
                twCtx.fillStyle = '#475569';
                twCtx.fillRect(blockCenterX - (currentSwingingBlock.w * 0.45), blockTopY - 6, currentSwingingBlock.w * 0.9, 6);

                // Articulated Claw Arms Gripping the Block
                twCtx.fillStyle = '#f59e0b';
                let clawW = 5;
                let clawH = 10;
                // Left arm
                twCtx.fillRect(blockCenterX - (currentSwingingBlock.w * 0.48), blockTopY - 5, clawW, clawH);
                // Right arm
                twCtx.fillRect(blockCenterX + (currentSwingingBlock.w * 0.48) - clawW, blockTopY - 5, clawW, clawH);

                // Subtle Downward Plumb Laser Alignment Guide
                twCtx.strokeStyle = 'rgba(0, 255, 255, 0.22)';
                twCtx.lineWidth = 1.0;
                twCtx.setLineDash([4, 4]);
                twCtx.beginPath();
                twCtx.moveTo(blockCenterX, currentSwingingBlock.y + currentSwingingBlock.h);
                twCtx.lineTo(blockCenterX, structuralTargetLandingY);
                twCtx.stroke();
                twCtx.setLineDash([]);
                twCtx.restore();

                // Draw the Swinging Skyscraper Block
                drawStylizedSquareBlock(
                    currentSwingingBlock.x,
                    currentSwingingBlock.y,
                    currentSwingingBlock.w,
                    currentSwingingBlock.h,
                    currentSwingingBlock.color,
                    towerScoreCounter,
                    false
                );

            } else if (isTowerBlockDropping && towerGameState === 'PLAYING') {
                // 8. â›“ï¸ FREE FALL ACCELERATING GRAVITY PHYSICS
                currentSwingingBlock.dropSpeedY = Math.min(16.0, currentSwingingBlock.dropSpeedY + currentSwingingBlock.dropAccY);
                currentSwingingBlock.dropY += currentSwingingBlock.dropSpeedY;

                // Draw Clean Suspension Cable from Sky (No top bar)
                twCtx.save();
                let cableEndBlockX = currentSwingingBlock.dropX + (currentSwingingBlock.w / 2);
                let cableEndBlockY = currentSwingingBlock.pivotY + 85;
                [-2.5, 2.5].forEach(offsetCable => {
                    twCtx.strokeStyle = '#64748b';
                    twCtx.lineWidth = 1.5;
                    twCtx.beginPath();
                    twCtx.moveTo(cranePivotX + offsetCable, cranePivotY - 50);
                    twCtx.lineTo(cableEndBlockX + offsetCable, cableEndBlockY);
                    twCtx.stroke();
                });
                twCtx.fillStyle = '#f59e0b';
                // Claw arms open wide
                twCtx.fillRect(cableEndBlockX - 16, cableEndBlockY, 5, 8);
                twCtx.fillRect(cableEndBlockX + 11, cableEndBlockY, 5, 8);
                twCtx.restore();

                // Draw Falling Block
                drawStylizedSquareBlock(
                    currentSwingingBlock.dropX,
                    currentSwingingBlock.dropY,
                    currentSwingingBlock.w,
                    currentSwingingBlock.h,
                    currentSwingingBlock.color,
                    towerScoreCounter,
                    false
                );

                // Collision / Landing Check
                if ((currentSwingingBlock.dropY + currentSwingingBlock.h) >= structuralTargetLandingY) {
                    isTowerBlockDropping = false;
                    let blockContactX = currentSwingingBlock.dropX;
                    let structuralOffsetErrorX = Math.abs(blockContactX - surfaceAnchorBaseBlock.x);
                    let maximumAllowableMarginWidth = surfaceAnchorBaseBlock.w * 0.70;

                    if (structuralOffsetErrorX <= maximumAllowableMarginWidth) {
                        // Successful Landing!
                        towerScoreCounter++;
                        towerMaxCombo = Math.max(towerMaxCombo, towerPerfectCombo);

                        // Trigger elastic spring squash & structural sway
                        towerStackSquashY = -0.20;
                        let offsetDir = (blockContactX - surfaceAnchorBaseBlock.x) / surfaceAnchorBaseBlock.w;
                        towerStackSwayVel += offsetDir * 0.07;

                        if (structuralOffsetErrorX <= 4) {
                            // Perfect drop!
                            towerPerfectCombo++;
                            towerVisualVibrationScaleX = 5.5;
                            playTowerSound('IMPACT_PERFECT', towerPerfectCombo);
                            createPerfectDropVFX(blockContactX + (currentSwingingBlock.w / 2), structuralTargetLandingY);
                        } else {
                            // Good landing!
                            if (structuralOffsetErrorX > maximumAllowableMarginWidth * 0.65) {
                                playTowerSound('WOBBLE');
                            }
                            towerPerfectCombo = 0;
                            towerVisualVibrationScaleX = 2.8;
                            playTowerSound('IMPACT_GOOD');
                            createLandingDustParticles(blockContactX, structuralTargetLandingY);
                        }

                        // Vibrant Modern Skyscraper Color Spectrum
                        const blockSpectrumColors = ['#f39c12', '#9b59b6', '#0284c7', '#10b981', '#e11d48', '#8b5cf6', '#d97706'];
                        let chosenColorHex = blockSpectrumColors[towerScoreCounter % blockSpectrumColors.length];

                        activeTowerBlocksArray.push({
                            x: blockContactX,
                            y: structuralTargetLandingY - currentSwingingBlock.h,
                            w: currentSwingingBlock.w,
                            h: currentSwingingBlock.h,
                            color: chosenColorHex,
                            isAnchor: false
                        });

                        // Discount Rule Check (Preserved 100%)
                        if (currentTowerLevelState === (parseInt(rules.towerTar) || 3)) {
                            if (typeof triggerRewardCoupon === 'function') {
                                let earnedPercent = parseInt(rules.towerDisc) || 0;
                                triggerRewardCoupon(earnedPercent);
                                playTowerSound('REWARD');
                            }
                        }

                        // Level Up Logic (Preserved 100%)
                        let calculatedLevel = calculateTowerLevel(towerScoreCounter);
                        if (calculatedLevel > currentTowerLevelState) {
                            currentTowerLevelState = calculatedLevel;
                            playTowerSound('LEVEL_UP');
                            showOnScreenNotification(`🏗 Level Up! Advanced to Tower Level ${currentTowerLevelState}`);
                        }

                        // Grand Victory Check (50 Floors)
                        if (towerScoreCounter >= 50) {
                            clearInterval(loopTimerInstance);
                            playTowerSound('REWARD');
                            alert("👑 GRAND VICTORY! You built the ultimate 50-story space skyscraper!");
                            if (typeof switchGameMode === 'function') switchGameMode('FLAPPY');
                            return;
                        }

                        // Reset Swinging Block for next floor
                        currentSwingingBlock.swingTimer = Math.random() * Math.PI * 2;
                        currentSwingingBlock.speed = calculateTowerSwingSpeed(towerScoreCounter);
                        currentSwingingBlock.color = chosenColorHex;
                        towerClawOpen = 0;

                    } else {
                        //Collapse Failure Animation
                        towerGameState = 'COLLAPSING';
                        playTowerSound('COLLAPSE');
                        towerVisualVibrationScaleX = 16.0;

                        towerCollapseAnim = {
                            x: blockContactX,
                            y: structuralTargetLandingY - currentSwingingBlock.h,
                            w: currentSwingingBlock.w,
                            h: currentSwingingBlock.h,
                            vx: (blockContactX > surfaceAnchorBaseBlock.x ? 3.5 : -3.5),
                            vy: -2.0,
                            rot: 0,
                            vRot: (blockContactX > surfaceAnchorBaseBlock.x ? 0.08 : -0.08),
                            color: currentSwingingBlock.color
                        };

                        setTimeout(() => {
                            finalizeFailedRun("\u{1F3D7}\uFE0F Tower Collapsed! Stack alignment balance failure.");
                        }, 850);
                    }
                }
            } else if (towerGameState === 'COLLAPSING' && towerCollapseAnim) {
                // Tumble tumbling block with gravity
                towerCollapseAnim.x += towerCollapseAnim.vx;
                towerCollapseAnim.y += towerCollapseAnim.vy;
                towerCollapseAnim.vy += 0.55;
                towerCollapseAnim.rot += towerCollapseAnim.vRot;

                twCtx.save();
                twCtx.translate(towerCollapseAnim.x + (towerCollapseAnim.w / 2), towerCollapseAnim.y + (towerCollapseAnim.h / 2));
                twCtx.rotate(towerCollapseAnim.rot);
                drawStylizedSquareBlock(
                    -towerCollapseAnim.w / 2,
                    -towerCollapseAnim.h / 2,
                    towerCollapseAnim.w,
                    towerCollapseAnim.h,
                    towerCollapseAnim.color,
                    towerScoreCounter,
                    false
                );
                twCtx.restore();
            }

            // ==========================================
            //END WORLD SPACE MATRIX
            // ==========================================
            twCtx.restore();

            // Screen Glow Flash Overlay for Perfect Alignment
            if (towerGlowFlashAlpha > 0) {
                twCtx.fillStyle = `rgba(250, 204, 21, ${towerGlowFlashAlpha * 0.35})`;
                twCtx.fillRect(0, 0, towerCanvasElement.width, towerCanvasElement.height);
                towerGlowFlashAlpha -= 0.04;
            }

            // ==========================================
            //MODERN GLASSMORPHIC HUD & ALTIMETER
            // ==========================================
            twCtx.save();
            const canvasW = towerCanvasElement.width;

            // Tier Zone Names
            const zoneTitles = [
                'Downtown',

        //UTILITY COLOR GRADIENT HELPERS
        function interpolateColor(color1, color2, factor) {
            let c1 = hexToRgb(color1);
            let c2 = hexToRgb(color2);
            let r = Math.round(c1.r + factor * (c2.r - c1.r));
            let g = Math.round(c1.g + factor * (c2.g - c1.g));
            let b = Math.round(c1.b + factor * (c2.b - c1.b));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
            let num = parseInt(hex, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function lightenColor(color, percent) {
            let rgb = hexToRgb(color);
            let r = Math.min(255, Math.floor(rgb.r + (255 - rgb.r) * (percent / 100)));
            let g = Math.min(255, Math.floor(rgb.g + (255 - rgb.g) * (percent / 100)));
            let b = Math.min(255, Math.floor(rgb.b + (255 - rgb.b) * (percent / 100)));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function darkenColor(color, percent) {
            let rgb = hexToRgb(color);
            let r = Math.max(0, Math.floor(rgb.r * (1 - percent / 100)));
            let g = Math.max(0, Math.floor(rgb.g * (1 - percent / 100)));
            let b = Math.max(0, Math.floor(rgb.b * (1 - percent / 100)));
            return `rgb(${r}, ${g}, ${b})`;
        }

            // Theme colour palettes: deep twilight hues ensuring > 10:1 contrast ratio against bright bricks

                // L1: Mystic Moonlit Forest (Deep midnight indigo to pine teal)
                { top: '#04070f', mid: '#08151b', bot: '#020608', glow: 'rgba(0, 210, 211, 0.08)', mist: 'rgba(12, 35, 42, 0.35)', tree: '#030a08' },

            ];

            const theme = naturalThemes[Math.min(themeIdx, naturalThemes.length - 1)] || naturalThemes[0];

            // 1. Deep atmospheric natural sky gradient
            let skyGrd = ctx.createLinearGradient(0, 0, 0, height);
            skyGrd.addColorStop(0, theme.top);
            skyGrd.addColorStop(0.55, theme.mid);
            skyGrd.addColorStop(1, theme.bot);
            ctx.fillStyle = skyGrd;
            ctx.fillRect(0, 0, width, height);

            // 2. Ethereal celestial / moonlight radiance in upper sky
            let radGrd = ctx.createRadialGradient(width * 0.5, height * 0.22, 10, width * 0.5, height * 0.22, width * 0.7);
            radGrd.addColorStop(0, theme.glow);
            radGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = radGrd;
            ctx.fillRect(0, 0, width, height);

            // 3. Distant layered silhouetted mountain ridges (gentle organic depth)
            ctx.fillStyle = theme.mist;
            ctx.beginPath();
            ctx.moveTo(0, height * 0.72);
            ctx.bezierCurveTo(width * 0.25, height * 0.68, width * 0.45, height * 0.74, width * 0.7, height * 0.69);

            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fill();

                ctx.lineTo(x + w, y + h * 0.55);
                ctx.lineTo(x + w * 0.8, y + h * 0.55);
                ctx.lineTo(x + w * 0.95, y + h);
                ctx.lineTo(x + w * 0.05, y + h);
                ctx.lineTo(x + w * 0.2, y + h * 0.55);
                ctx.lineTo(x, y + h * 0.55);
                ctx.closePath();
                ctx.fill();

            drawPineSilhouette(22, height - 85, 30, 85);

            for (let f of brickFirefliesArray) {
                f.phase += f.pulseSpeed;
                f.x += f.vx + Math.sin(time * 1.5 + f.phase) * 0.35;
                f.y += f.vy;

                // Screen wrapping
                if (f.y < 45) { f.y = height + 10; f.x = Math.random() * width; }
                if (f.x < -10) f.x = width + 10;
                if (f.x > width + 10) f.x = -10;

                let alpha = (Math.sin(f.phase) * 0.45 + 0.55) * 0.85;
                if (alpha <= 0.05) continue;

                // Firefly glowing halo
                let haloGrd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 3.5);

                haloGrd.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = haloGrd;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size * 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Bright core

                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

        // --- 5. TOUCH & DIRECT SCREEN CONTROL ENGINE ---
        function bindBrickCanvasDirectControls(canvas) {
            if (brickCanvasTouchBound || !canvas) return;

            let isDragging = false;

            const getCanvasPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const handleStart = (e) => {
                if (activeGameMode !== 'BRICK') return;
                if (e.cancelable) e.preventDefault();
                const pos = getCanvasPos(e);

                // Pause button toggle (top-right icon)
                if (pos.x > canvas.width - 45 && pos.y < 42) {
                    isBrickPaused = !isBrickPaused;
                    return;
                }

                // Audio Mute toggle (top-right second icon)
                if (pos.x > canvas.width - 80 && pos.x <= canvas.width - 45 && pos.y < 42) {
                    brickAudioMuted = !brickAudioMuted;
                    return;
                }

                // Left Sidebar Power-up icons (matching mobile arcade screenshot)
                if (pos.x >= 6 && pos.x <= 42) {
                    if (pos.y >= 130 && pos.y <= 165) {
                        activateBrickPowerup('laser');
                        return;
                    } else if (pos.y >= 175 && pos.y <= 210) {
                        activateBrickPowerup('multiball');
                        return;
                    } else if (pos.y >= 220 && pos.y <= 255) {
                        activateBrickPowerup('wide');
                        return;
                    }
                }

                isDragging = true;

                if (!isBallLaunched) {
                    bPaddle.x = Math.max(0, Math.min(canvas.width - bPaddle.w, pos.x - bPaddle.w / 2));
                    if (activeBallsArray.length > 0) {
                        activeBallsArray[0].x = bPaddle.x + bPaddle.w / 2;
                    }
                } else {
                    bPaddle.x = Math.max(0, Math.min(canvas.width - bPaddle.w, pos.x - bPaddle.w / 2));
                }
            };

            const handleMove = (e) => {
                if (!isDragging || activeGameMode !== 'BRICK') return;
                if (e.cancelable) e.preventDefault();
                const pos = getCanvasPos(e);
                bPaddle.x = Math.max(0, Math.min(canvas.width - bPaddle.w, pos.x - bPaddle.w / 2));
                if (!isBallLaunched && activeBallsArray.length > 0) {
                    activeBallsArray[0].x = bPaddle.x + bPaddle.w / 2;
                }
            };

            const handleEnd = (e) => {
                if (!isDragging || activeGameMode !== 'BRICK') return;
                isDragging = false;
                if (!isBallLaunched) {
                    launchBrickBall();
                }
            };

            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            canvas.addEventListener('touchend', handleEnd, { passive: false });

            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('mouseup', handleEnd);

            brickCanvasTouchBound = true;
        }

        function activateBrickPowerup(type) {
            if (type === 'laser') {
                if (brickPowerupInventory.laser > 0) {
                    brickPowerupInventory.laser--;
                    firePaddleLasers();
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');
                    brickFloatingTexts.push({ x: bPaddle.x + bPaddle.w / 2, y: bPaddle.y - 15, text: '⚡ TWIN LASERS!', color: '#ff9f43', alpha: 1.0, dy: -1.2 });
                }
            } else if (type === 'multiball') {
                if (brickPowerupInventory.multiball > 0) {
                    brickPowerupInventory.multiball--;
                    spawnMultiBalls();
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');
                    brickFloatingTexts.push({ x: bPaddle.x + bPaddle.w / 2, y: bPaddle.y - 15, text: '🔵 MULTI-BALL x3!', color: '#00d2d3', alpha: 1.0, dy: -1.2 });
                }
            } else if (type === 'wide') {
                if (brickPowerupInventory.wide > 0) {
                    brickPowerupInventory.wide--;
                    bPaddle.w = Math.min(bPaddle.w + 40, brickCanvasElement ? brickCanvasElement.width * 0.6 : 140);
                    setTimeout(() => { bPaddle.w = Math.max(70, bPaddle.w - 40); }, 9000);
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');
                    brickFloatingTexts.push({ x: bPaddle.x + bPaddle.w / 2, y: bPaddle.y - 15, text: '🌱 WIDE PADDLE!', color: '#2ecc71', alpha: 1.0, dy: -1.2 });
                }
            }
        }

        function spawnMultiBalls() {
            if (activeBallsArray.length === 0) return;
            let base = activeBallsArray[0];
            let offsets = [-0.5, 0.5];
            offsets.forEach(offsetAngle => {
                let currentAngle = Math.atan2(base.dy, base.dx) + offsetAngle;
                let speed = Math.sqrt(base.dx * base.dx + base.dy * base.dy) || base.baseSpeed || 4.2;
                activeBallsArray.push({
                    x: base.x,
                    y: base.y,
                    r: base.r || 6,
                    dx: Math.cos(currentAngle) * speed,
                    dy: Math.sin(currentAngle) * speed,
                    baseSpeed: base.baseSpeed,
                    isSuper: base.isSuper,
                    trail: []
                });
            });
        }

        function firePaddleLasers() {
            brickLaserBeams.push({ x: bPaddle.x + 12, y: bPaddle.y - 4, dy: -8, w: 3, h: 14 });
            brickLaserBeams.push({ x: bPaddle.x + bPaddle.w - 15, y: bPaddle.y - 4, dy: -8, w: 3, h: 14 });
        }

        function launchBrickBall(angleBias) {
            if (isBallLaunched || activeBallsArray.length === 0) return;
            isBallLaunched = true;
            let b = activeBallsArray[0];
            let speed = b.baseSpeed || 4.2;
            let angle = (-Math.PI / 2);
            if (typeof angleBias === 'number') {
                angle += angleBias;
            } else if (brickAimAngle) {
                angle = brickAimAngle;
            }
            b.dx = Math.cos(angle) * speed;
            b.dy = Math.sin(angle) * speed;
            if (b.dy > -1.5) b.dy = -speed * 0.85;
            if (Math.abs(b.dx) < 0.6) b.dx = (Math.random() > 0.5 ? 1 : -1) * 1.4;

            if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') {
                triggerAudioBeepAlert(null, 'BALL_LAUNCH');
            }
        }

        // ===================================================================
        // 6. INITIALIZATION: PIXEL-ART GRID GEOMETRY & LEVEL SETUP
        // ===================================================================
        function initBrickBreakerGame() {
            clearInterval(loopTimerInstance);
            const bCanvas = document.getElementById('brickCanvas');
            if (!bCanvas) return;
            brCtx = bCanvas.getContext('2d');

            if (currentActiveLevelIndex === 1) {
                if (!currentSelectedPackName) currentSelectedPackName = 'A';
                gameHeartsRemaining = 3;
            }

            brickPaddleDir = 0;
            activeDropsArray = [];
            isBallLaunched = false;
            ballChargeMeter = 0;
            isSuperBallActive = false;
            brickComboCounter = 0;
            brickFloatingTexts = [];
            brickLaserBeams = [];
            isBrickPaused = false;

            let targetPack = totalBrickPacksDataMatrix[currentSelectedPackName] || totalBrickPacksDataMatrix['A'];
            let currentMapBlueprint = targetPack.layouts[Math.min(currentActiveLevelIndex - 1, targetPack.layouts.length - 1)];

            let baseSpeedOffset = 3.6 + (currentActiveLevelIndex * 0.3);

            bPaddle = { x: (bCanvas.width / 2) - 45, y: bCanvas.height - 35, w: 90, h: 10 };
            bBall = { x: bCanvas.width / 2, y: bCanvas.height - 52, r: 6, dx: 0, dy: 0, baseSpeed: baseSpeedOffset, isSuper: false, trail: [] };
            activeBallsArray = [bBall];

            // Setup Fireflies & Natural Backdrop
            initBrickFireflies(bCanvas.width, bCanvas.height);

            // Compute true square pixel brick dimensions
            activeBricksArray = [];
            let rRows = currentMapBlueprint.length;
            let cCols = typeof currentMapBlueprint[0] === 'string' ? currentMapBlueprint[0].length : currentMapBlueprint[0].length;

            let horizontalMargin = 20;
            let paddingWidth = 1.2;
            let availableWidth = bCanvas.width - (horizontalMargin * 2);
            let calcBrickW = Math.floor((availableWidth - (paddingWidth * (cCols + 1))) / cCols);
            let calcBrickH = calcBrickW; // True square pixel brick tile!
            let startOffsetY = 55;

            for (let r = 0; r < rRows; r++) {
                let rowData = currentMapBlueprint[r];
                for (let c = 0; c < cCols; c++) {
                    let itemKey = typeof rowData === 'string' ? rowData[c] : rowData[c];
                    if (itemKey !== '0' && brickPixelPalette[itemKey]) {
                        let bX = horizontalMargin + (c * (calcBrickW + paddingWidth)) + paddingWidth;
                        let bY = startOffsetY + (r * (calcBrickH + paddingWidth)) + paddingWidth;

                        let paletteInfo = brickPixelPalette[itemKey];
                        let isSpecialNode = paletteInfo.special || 'NONE';

                        activeBricksArray.push({
                            x: bX, y: bY, w: calcBrickW, h: calcBrickH,
                            color: paletteInfo.color,
                            hi: paletteInfo.hi,
                            sh: paletteInfo.sh,
                            special: isSpecialNode,
                            status: isSpecialNode === 'BOSS' ? 8 : 1,
                            hitFlash: 0
                        });
                    }
                }
            }

            // Bind Direct Canvas Controls & Keyboard
            bindBrickCanvasDirectControls(bCanvas);

            if (!isBrickKeyboardBound) {
                window.addEventListener('keydown', (e) => {
                    if (activeGameMode === 'BRICK') {
                        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') brickPaddleDir = -7;
                        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') brickPaddleDir = 7;
                        if (e.key === ' ' || e.key === 'Enter') {
                            if (!isBallLaunched) launchBrickBall();
                        }
                        if (e.key === 'p' || e.key === 'P') isBrickPaused = !isBrickPaused;
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (activeGameMode === 'BRICK') {
                        if (((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && brickPaddleDir < 0) ||
                            ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && brickPaddleDir > 0)) {
                            brickPaddleDir = 0;
                        }
                    }
                });
                isBrickKeyboardBound = true;
            }

            loopTimerInstance = setInterval(frameUpdateBrickBreaker, 16);
        }

        // ===================================================================
        // 7. HIGH-PERFORMANCE 60 FPS AAA CANVAS RENDER & PHYSICS LOOP
        // ===================================================================
        function frameUpdateBrickBreaker() {
            if (!brickCanvasElement) brickCanvasElement = document.getElementById('brickCanvas');
            if (!brickCanvasElement || !brCtx) return;

            // --- A. CAMERA SHAKE SETUP ---
            let camOffsetX = 0, camOffsetY = 0;
            if (brickCameraShake > 0) {
                camOffsetX = (Math.random() - 0.5) * brickCameraShake;
                camOffsetY = (Math.random() - 0.5) * brickCameraShake;
                brickCameraShake *= 0.85;
                if (brickCameraShake < 0.5) brickCameraShake = 0;
            }

            brCtx.save();
            brCtx.translate(camOffsetX, camOffsetY);

            // --- B. NATURAL HIGH-CONTRAST CANOPY ENVIRONMENT ---
            brickBgPulseTime += 0.02;
            drawNaturalContrastBackground(brCtx, brickCanvasElement.width, brickCanvasElement.height, currentActiveLevelIndex - 1, brickBgPulseTime);

            // If Game is Paused, render pause overlay & skip physics
            if (isBrickPaused) {
                brCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                brCtx.fillRect(0, 0, brickCanvasElement.width, brickCanvasElement.height);
                brCtx.fillStyle = '#ffffff';
                brCtx.font = 'bold 22px Segoe UI, sans-serif';
                brCtx.textAlign = 'center';
                brCtx.fillText("⏸️ GAME PAUSED", brickCanvasElement.width / 2, brickCanvasElement.height / 2);
                brCtx.font = '13px Segoe UI, sans-serif';
                brCtx.fillStyle = '#00d2d3';
                brCtx.fillText("Tap top-right to resume playing", brickCanvasElement.width / 2, brickCanvasElement.height / 2 + 30);
                brCtx.restore();
                return;
            }

            // --- C. PADDLE MOVEMENT & 3D CYBER-ORGANIC RENDER ---
            bPaddle.x += brickPaddleDir;
            if (bPaddle.x < 0) bPaddle.x = 0;
            if (bPaddle.x > brickCanvasElement.width - bPaddle.w) bPaddle.x = brickCanvasElement.width - bPaddle.w;

            // Spring return for squash & stretch
            brickPaddleSquash += (1.0 - brickPaddleSquash) * 0.18;

            let curPadH = bPaddle.h * brickPaddleSquash;
            let curPadY = bPaddle.y + (bPaddle.h - curPadH);

            brCtx.save();
            brCtx.shadowColor = isSuperBallActive ? '#00d2d3' : '#feca57';
            brCtx.shadowBlur = brickPaddleDir !== 0 ? 14 : 6;

            // Sleek Metallic Gradient Runner Body
            let padGrad = brCtx.createLinearGradient(bPaddle.x, curPadY, bPaddle.x, curPadY + curPadH);
            padGrad.addColorStop(0, '#ffffff');
            padGrad.addColorStop(0.3, '#cbd5e1');
            padGrad.addColorStop(1, '#334155');

            brCtx.fillStyle = padGrad;
            brCtx.beginPath();
            brCtx.roundRect(bPaddle.x, curPadY, bPaddle.w, curPadH, 5);
            brCtx.fill();

            // Glowing neon energy runner strip inside paddle
            brCtx.fillStyle = isSuperBallActive ? '#00f2fe' : '#f1c40f';
            brCtx.shadowBlur = 10;
            brCtx.fillRect(bPaddle.x + 10, curPadY + 2, bPaddle.w - 20, 2.5);

            // Natural edge accent caps
            brCtx.fillStyle = '#2ecc71';
            brCtx.fillRect(bPaddle.x + 2, curPadY + 1, 4, curPadH - 2);
            brCtx.fillRect(bPaddle.x + bPaddle.w - 6, curPadY + 1, 4, curPadH - 2);
            brCtx.restore();

            // --- D. LASER BEAMS UPDATE & RENDER ---
            for (let lIdx = brickLaserBeams.length - 1; lIdx >= 0; lIdx--) {
                let l = brickLaserBeams[lIdx];
                l.y += l.dy;
                brCtx.fillStyle = '#ff9f43';
                brCtx.shadowColor = '#ff9f43';
                brCtx.shadowBlur = 8;
                brCtx.fillRect(l.x, l.y, l.w, l.h);
                brCtx.shadowBlur = 0;

                // Laser vs Bricks collision
                let hitBrick = false;
                for (let br of activeBricksArray) {
                    if (br.status > 0 && l.x >= br.x && l.x <= br.x + br.w && l.y >= br.y && l.y <= br.y + br.h) {
                        br.status--;
                        br.hitFlash = 1.0;
                        createBrickExplosion(l.x, l.y, br.color, 4, false);
                        if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'BRICK_HIT', 1);
                        hitBrick = true;
                        break;
                    }
                }
                if (hitBrick || l.y < 40) {
                    brickLaserBeams.splice(lIdx, 1);
                }
            }

            // --- E. AIMING TRAJECTORY GUIDELINE (WHEN BALL NOT LAUNCHED) ---
            if (!isBallLaunched && activeBallsArray.length > 0) {
                let b = activeBallsArray[0];
                b.x = bPaddle.x + (bPaddle.w / 2);
                b.y = bPaddle.y - b.r - 3;

                brCtx.save();
                brCtx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                brCtx.lineWidth = 1.5;
                brCtx.setLineDash([4, 5]);
                brCtx.beginPath();
                brCtx.moveTo(b.x, b.y - b.r);

                // Calculate aiming point: straight up or angled
                let aimEndX = b.x;
                let aimEndY = 65;
                brCtx.lineTo(aimEndX, aimEndY);
                brCtx.stroke();
                brCtx.setLineDash([]);

                // Pulsing glowing targeting crosshair at the tip
                let reticlePulse = 4.5 + Math.sin(brickBgPulseTime * 8) * 1.5;
                brCtx.strokeStyle = '#00f2fe';
                brCtx.shadowColor = '#00f2fe';
                brCtx.shadowBlur = 10;
                brCtx.beginPath();
                brCtx.arc(aimEndX, aimEndY, reticlePulse, 0, Math.PI * 2);
                brCtx.stroke();

                // Arrow head pointing upward
                brCtx.fillStyle = '#ffffff';
                brCtx.beginPath();
                brCtx.moveTo(b.x, b.y - b.r - 8);
                brCtx.lineTo(b.x - 4, b.y - b.r - 1);
                brCtx.lineTo(b.x + 4, b.y - b.r - 1);
                brCtx.closePath();
                brCtx.fill();

                // Launch instruction prompt badge
                let launchAlpha = 0.65 + Math.sin(brickBgPulseTime * 6) * 0.35;
                brCtx.fillStyle = `rgba(0, 242, 254, ${launchAlpha})`;
                brCtx.font = 'bold 10px Segoe UI, sans-serif';
                brCtx.textAlign = 'center';
                brCtx.fillText("▲ TAP SCREEN OR ◀ ▶ TO LAUNCH", bPaddle.x + bPaddle.w / 2, bPaddle.y - 24);
                brCtx.restore();
            }

            // --- F. MULTI-BALL PHYSICS & RENDER LOOP ---
            for (let bIdx = activeBallsArray.length - 1; bIdx >= 0; bIdx--) {
                let ball = activeBallsArray[bIdx];

                if (isBallLaunched) {
                    ball.x += ball.dx;
                    ball.y += ball.dy;

                    // Light Motion Trail
                    ball.trail = ball.trail || [];
                    ball.trail.push({ x: ball.x, y: ball.y, alpha: 0.85 });
                    if (ball.trail.length > (isSuperBallActive ? 14 : 6)) ball.trail.shift();

                    // Anti-Stuck & Speed Normalizer
                    if (Math.abs(ball.dx) < 0.6) ball.dx = ball.dx < 0 ? -0.8 : 0.8;
                    if (Math.abs(ball.dy) < 0.6) ball.dy = ball.dy < 0 ? -0.8 : 0.8;

                    let curSpd = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                    if (curSpd > 0) {
                        ball.dx = (ball.dx / curSpd) * ball.baseSpeed;
                        ball.dy = (ball.dy / curSpd) * ball.baseSpeed;
                    }
                }

                // Render Motion Trail
                if (ball.trail) {
                    ball.trail.forEach(t => {
                        t.alpha -= isSuperBallActive ? 0.06 : 0.12;
                        if (t.alpha <= 0) return;
                        brCtx.globalAlpha = Math.max(0, t.alpha);
                        brCtx.fillStyle = isSuperBallActive ? '#00f2fe' : '#feca57';
                        brCtx.beginPath();
                        brCtx.arc(t.x, t.y, ball.r * t.alpha, 0, Math.PI * 2);
                        brCtx.fill();
                    });
                    brCtx.globalAlpha = 1.0;
                }

                // Render Glowing Energy Ball Core
                brCtx.save();
                brCtx.shadowColor = isSuperBallActive ? '#00f2fe' : '#feca57';
                brCtx.shadowBlur = 12;
                brCtx.fillStyle = '#ffffff';
                brCtx.beginPath();
                brCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                brCtx.fill();

                // Inner jewel core
                brCtx.fillStyle = isSuperBallActive ? '#00d2d3' : '#e67e22';
                brCtx.beginPath();
                brCtx.arc(ball.x, ball.y, ball.r * 0.5, 0, Math.PI * 2);
                brCtx.fill();
                brCtx.restore();

                // Wall Collisions
                if (ball.x + ball.r > brickCanvasElement.width) {
                    ball.x = brickCanvasElement.width - ball.r;
                    ball.dx *= -1;
                    createBrickExplosion(ball.x, ball.y, '#c8d6e5', 4, false);
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'WALL_HIT');
                } else if (ball.x - ball.r < 0) {
                    ball.x = ball.r;
                    ball.dx *= -1;
                    createBrickExplosion(ball.x, ball.y, '#c8d6e5', 4, false);
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'WALL_HIT');
                }

                // Ceiling Collision
                if (ball.y - ball.r < 40) {
                    ball.y = 40 + ball.r;
                    ball.dy *= -1;
                    createBrickExplosion(ball.x, ball.y, '#c8d6e5', 4, false);
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'WALL_HIT');
                }

                // Paddle Collision (anti-tunneling)
                if (ball.dy > 0 && ball.y + ball.r >= bPaddle.y && ball.y - ball.r <= bPaddle.y + bPaddle.h + 8 &&
                    ball.x >= bPaddle.x - ball.r && ball.x <= bPaddle.x + bPaddle.w + ball.r) {

                    ball.y = bPaddle.y - ball.r;
                    let relImpact = (ball.x - (bPaddle.x + bPaddle.w / 2)) / (bPaddle.w / 2);
                    ball.dx = relImpact * (ball.baseSpeed + 1.2) + (Math.random() - 0.5) * 0.3;
                    ball.dy = -Math.abs(ball.baseSpeed);

                    brickPaddleSquash = 0.72;
                    applyBrickCameraShake(2.5);
                    createBrickExplosion(ball.x, bPaddle.y, '#feca57', 8, false);

                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') {
                        triggerAudioBeepAlert(null, 'PADDLE_HIT');
                    }
                    brickComboCounter = 0; // Reset combo when striking paddle
                }

                // Ball Below Screen (Death Check)
                if (ball.y - ball.r > brickCanvasElement.height) {
                    activeBallsArray.splice(bIdx, 1);
                }
            }

            // Life Loss if all active balls dropped
            if (isBallLaunched && activeBallsArray.length === 0) {
                if (!isLifeBeingProcessed) {
                    isLifeBeingProcessed = true;
                    gameHeartsRemaining--;
                    isBallLaunched = false;
                    isSuperBallActive = false;
                    applyBrickCameraShake(16);

                    if (gameHeartsRemaining <= 0) {
                        currentActiveLevelIndex = 1;
                        isLifeBeingProcessed = false;
                        if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'GAME_OVER');
                        finalizeFailedRun("\u{1F494} All Hearts Shattered! Try Again.");
                        brCtx.restore();
                        return;
                    } else {
                        // Reset single ball on paddle
                        let baseSpd = 3.6 + (currentActiveLevelIndex * 0.3);
                        bBall = { x: bPaddle.x + (bPaddle.w / 2), y: bPaddle.y - 10, r: 6, dx: 0, dy: 0, baseSpeed: baseSpd, isSuper: false, trail: [] };
                        activeBallsArray = [bBall];
                        isLifeBeingProcessed = false;
                        if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'LIFE_LOST');
                    }
                }
            }

            // --- G. BRICK TILES RENDERING & PIXEL COLLISION ENGINE ---
            let remainingActiveBricksCount = 0;

            activeBricksArray.forEach(br => {
                if (br.status <= 0) return;
                remainingActiveBricksCount++;

                // Decay Hit Flash
                if (br.hitFlash > 0) br.hitFlash -= 0.12;

                brCtx.save();

                // 3D Beveled Specular Square Pixel Brick Tile
                let bGrad = brCtx.createLinearGradient(br.x, br.y, br.x, br.y + br.h);
                bGrad.addColorStop(0, br.hi || '#ffffff');
                bGrad.addColorStop(0.35, br.color);
                bGrad.addColorStop(1, br.sh || '#000000');

                brCtx.fillStyle = bGrad;
                brCtx.beginPath();
                brCtx.roundRect(br.x, br.y, br.w, br.h, 2);
                brCtx.fill();

                // 3D Top-Left Specular Sheen Highlight
                brCtx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                brCtx.fillRect(br.x + 1, br.y + 1, br.w - 2, 1.8);
                brCtx.fillRect(br.x + 1, br.y + 1, 1.8, br.h - 2);

                // Bottom-Right Ambient Occlusion Shadow
                brCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                brCtx.fillRect(br.x + 1, br.y + br.h - 1.8, br.w - 1, 1.8);
                brCtx.fillRect(br.x + br.w - 1.8, br.y + 1, 1.8, br.h - 1);

                // Special Brick Iconography
                if (br.special === 'TNT') {
                    let fusePulse = Math.floor(Date.now() / 180) % 2 === 0;
                    brCtx.fillStyle = fusePulse ? '#ffffff' : '#000000';
                    brCtx.font = "bold 8px Arial";
                    brCtx.textAlign = "center";
                    brCtx.textBaseline = "middle";
                    brCtx.fillText("💥", br.x + (br.w / 2), br.y + (br.h / 2));
                } else if (br.special === 'POWER') {
                    brCtx.fillStyle = '#ffffff';
                    brCtx.font = "8px Arial";
                    brCtx.textAlign = "center";
                    brCtx.textBaseline = "middle";
                    brCtx.fillText("⭐", br.x + (br.w / 2), br.y + (br.h / 2));
                }

                // White Hit Flash Wash
                if (br.hitFlash > 0) {
                    brCtx.fillStyle = `rgba(255, 255, 255, ${Math.min(1.0, br.hitFlash)})`;
                    brCtx.beginPath();
                    brCtx.roundRect(br.x, br.y, br.w, br.h, 2);
                    brCtx.fill();
                }

                brCtx.restore();

                // Check Ball vs Brick Collisions for all active balls
                for (let ball of activeBallsArray) {
                    if (ball.x + ball.r > br.x && ball.x - ball.r < br.x + br.w &&
                        ball.y + ball.r > br.y && ball.y - ball.r < br.y + br.h) {

                        br.status--;
                        br.hitFlash = 1.0;
                        brickComboCounter++;

                        // Tuned ascending pentatonic marimba chime based on combo count
                        if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') {
                            triggerAudioBeepAlert(null, br.special === 'TNT' ? 'EXPLOSION' : 'BRICK_HIT', brickComboCounter);
                        }

                        createBrickExplosion(ball.x, ball.y, br.color, br.special === 'TNT' ? 18 : 6, br.special === 'TNT');

                        // Super Ball blasts straight through; regular ball bounces
                        if (!isSuperBallActive) {
                            // Determine collision normal for realistic bounce
                            let overlapLeft = (ball.x + ball.r) - br.x;
                            let overlapRight = (br.x + br.w) - (ball.x - ball.r);
                            let overlapTop = (ball.y + ball.r) - br.y;
                            let overlapBottom = (br.y + br.h) - (ball.y - ball.r);

                            let minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                            if (minOverlap === overlapLeft || minOverlap === overlapRight) {
                                ball.dx *= -1;
                            } else {
                                ball.dy *= -1;
                            }
                        }

                        // Score increment with combo multiplier
                        let pts = 10 * Math.max(1, brickComboCounter);
                        brickScoreCounter += pts;
                        ballChargeMeter = Math.min(100, ballChargeMeter + 8);

                        // Floating score text
                        let comboTxt = brickComboCounter > 2 ? `+${pts} COMBO x${brickComboCounter}!` : `+${pts}`;
                        brickFloatingTexts.push({
                            x: br.x + br.w / 2, y: br.y - 8,
                            text: comboTxt,
                            color: brickComboCounter > 2 ? '#feca57' : '#ffffff',
                            alpha: 1.0,
                            dy: -1.0
                        });

                        // Super ball charge trigger
                        if (ballChargeMeter >= 100 && !isSuperBallActive) {
                            isSuperBallActive = true;
                            ballChargeMeter = 0;
                            brickScreenFlashAlpha = 0.45;
                            brickFloatingTexts.push({ x: bPaddle.x + bPaddle.w / 2, y: bPaddle.y - 25, text: '🔥 SUPER BALL ACTIVE!', color: '#00f2fe', alpha: 1.0, dy: -1.2 });
                        }

                        // TNT Chain Explosion
                        if (br.special === 'TNT') {
                            applyBrickCameraShake(12);
                            activeBricksArray.forEach(subBr => {
                                if (subBr.status > 0) {
                                    let dist = Math.hypot(subBr.x - br.x, subBr.y - br.y);
                                    if (dist < 45) {
                                        subBr.status = 0;
                                        brickScoreCounter += 20;
                                        createBrickExplosion(subBr.x + subBr.w / 2, subBr.y + subBr.h / 2, subBr.color, 8, false);
                                    }
                                }
                            });
                        }

                        // Random or Guaranteed Powerup Drops
                        if ((Math.random() < 0.16 || br.special === 'POWER') && !isSuperBallActive) {
                            let typeAllocated = Math.random() > 0.65 ? 'MULTI' : (Math.random() > 0.4 ? 'GROW' : 'HEART');
                            activeDropsArray.push({ x: br.x + (br.w / 2), y: br.y, type: typeAllocated, rot: 0 });
                        }

                        break; // Ball handled for this brick
                    }
                }
            });

            if (isSuperBallActive && activeBallsArray.some(b => b.y < 50)) {
                isSuperBallActive = false;
            }

            // --- H. ANIMATED POWER-UP CAPSULE DROPS ---
            for (let dIndex = activeDropsArray.length - 1; dIndex >= 0; dIndex--) {
                let drop = activeDropsArray[dIndex];
                drop.y += 2.4;
                drop.rot = (drop.rot || 0) + 0.05;

                brCtx.save();
                brCtx.translate(drop.x, drop.y);
                brCtx.rotate(drop.rot);

                let dropColor = drop.type === 'GROW' ? '#2ecc71' : (drop.type === 'MULTI' ? '#00d2d3' : '#ff4757');
                brCtx.fillStyle = dropColor;
                brCtx.shadowColor = dropColor;
                brCtx.shadowBlur = 10;
                brCtx.beginPath();
                brCtx.roundRect(-10, -5, 20, 10, 4);
                brCtx.fill();

                brCtx.fillStyle = '#ffffff';
                brCtx.shadowBlur = 0;
                brCtx.font = "bold 8px Arial";
                brCtx.textAlign = "center";
                brCtx.textBaseline = "middle";
                brCtx.fillText(drop.type === 'GROW' ? '↔' : (drop.type === 'MULTI' ? 'x3' : '♥'), 0, 0);
                brCtx.restore();

                // Collection by Paddle
                if (drop.y + 6 >= bPaddle.y && drop.x >= bPaddle.x && drop.x <= bPaddle.x + bPaddle.w) {
                    createBrickExplosion(drop.x, bPaddle.y, dropColor, 14, false);
                    if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');

                    if (drop.type === 'GROW') {
                        bPaddle.w = Math.min(bPaddle.w + 35, brickCanvasElement.width * 0.6);
                        setTimeout(() => { bPaddle.w = Math.max(70, bPaddle.w - 35); }, 9000);
                        brickFloatingTexts.push({ x: drop.x, y: bPaddle.y - 12, text: 'WIDE PADDLE!', color: '#2ecc71', alpha: 1.0, dy: -1.0 });
                    } else if (drop.type === 'MULTI') {
                        spawnMultiBalls();
                        brickFloatingTexts.push({ x: drop.x, y: bPaddle.y - 12, text: 'MULTI-BALL!', color: '#00d2d3', alpha: 1.0, dy: -1.0 });
                    } else if (drop.type === 'HEART') {
                        if (gameHeartsRemaining < 3) gameHeartsRemaining++;
                        brickFloatingTexts.push({ x: drop.x, y: bPaddle.y - 12, text: '+1 HEART!', color: '#ff4757', alpha: 1.0, dy: -1.0 });
                    }

                    activeDropsArray.splice(dIndex, 1);
                } else if (drop.y > brickCanvasElement.height) {
                    activeDropsArray.splice(dIndex, 1);
                }
            }

            // --- I. FLOATING COMBAT TEXT ENGINE ---
            for (let tIdx = brickFloatingTexts.length - 1; tIdx >= 0; tIdx--) {
                let ft = brickFloatingTexts[tIdx];
                ft.y += ft.dy;
                ft.alpha -= 0.022;
                if (ft.alpha <= 0) {
                    brickFloatingTexts.splice(tIdx, 1);
                    continue;
                }
                brCtx.save();
                brCtx.globalAlpha = Math.max(0, ft.alpha);
                brCtx.fillStyle = ft.color;
                brCtx.font = "bold 11px Segoe UI, sans-serif";
                brCtx.textAlign = "center";
                brCtx.shadowColor = ft.color;
                brCtx.shadowBlur = 6;
                brCtx.fillText(ft.text, ft.x, ft.y);
                brCtx.restore();
            }

            // --- J. PARTICLE ENGINE RENDERER (SQUARE PIXELS & SPARKS) ---
            for (let i = brickParticlesArray.length - 1; i >= 0; i--) {
                let p = brickParticlesArray[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0;
                p.rot = (p.rot || 0) + (p.vRot || 0);
                p.life -= p.decay;

                if (p.life <= 0) {
                    brickParticlesArray.splice(i, 1);
                    continue;
                }

                brCtx.save();
                brCtx.globalAlpha = Math.max(0, p.life);
                brCtx.translate(p.x, p.y);
                brCtx.rotate(p.rot);
                brCtx.fillStyle = p.color;

                if (p.isPixel) {
                    brCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                } else {
                    brCtx.beginPath();
                    brCtx.arc(0, 0, p.size, 0, Math.PI * 2);
                    brCtx.fill();
                }
                brCtx.restore();
            }

            brCtx.restore(); // Restore camera shake

            // Screen Flash on Super/Bomb detonation
            if (brickScreenFlashAlpha > 0) {
                brCtx.fillStyle = `rgba(255, 255, 255, ${brickScreenFlashAlpha})`;
                brCtx.fillRect(0, 0, brickCanvasElement.width, brickCanvasElement.height);
                brickScreenFlashAlpha -= 0.04;
            }

            // --- K. STAGE COMPLETION / VICTORY CHECK ---
            if (remainingActiveBricksCount === 0 && isBallLaunched) {
                clearInterval(loopTimerInstance);
                isBallLaunched = false;

                if (!brickAudioMuted && typeof triggerAudioBeepAlert === 'function') {
                    triggerAudioBeepAlert(null, 'LEVEL_CLEAR');
                }

                if (currentActiveLevelIndex === (parseInt(rules.brickTar) || 3)) {
                    if (typeof triggerRewardCoupon === 'function') {
                        let earnedPercent = parseInt(rules.brickDisc) || 0;
                        triggerRewardCoupon(earnedPercent);
                    }
                }

                if (currentActiveLevelIndex < 5) {
                    currentActiveLevelIndex++;
                    initBrickBreakerGame();
                } else {
                    currentActiveLevelIndex = 1;
                    alert(`🎉 GRAND VICTORY! You mastered Pack ${currentSelectedPackName}!`);
                    if (typeof switchGameMode === 'function') switchGameMode('FLAPPY');
                }
                return;
            }

            // --- L. SIDE POWER-UP INVENTORY HUD (MATCHING SCREENSHOT) ---
            const sideIcons = [
                { type: 'laser', label: '⚡', count: brickPowerupInventory.laser, y: 145, color: '#ff793f', bg: 'rgba(255, 121, 63, 0.2)' },
                { type: 'multiball', label: '🔵', count: brickPowerupInventory.multiball, y: 190, color: '#00d2d3', bg: 'rgba(0, 210, 211, 0.2)' },
                { type: 'wide', label: '🌱', count: brickPowerupInventory.wide, y: 235, color: '#2ecc71', bg: 'rgba(46, 204, 113, 0.2)' }
            ];

            sideIcons.forEach(ic => {
                brCtx.save();
                brCtx.fillStyle = ic.bg;
                brCtx.strokeStyle = ic.color;
                brCtx.lineWidth = 1.2;
                brCtx.beginPath();
                brCtx.arc(22, ic.y, 13, 0, Math.PI * 2);
                brCtx.fill();
                brCtx.stroke();

                brCtx.font = '12px Segoe UI, sans-serif';
                brCtx.textAlign = 'center';
                brCtx.textBaseline = 'middle';
                brCtx.fillText(ic.label, 22, ic.y);

                brCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                brCtx.font = 'bold 9px monospace';
                brCtx.fillText(`x${ic.count}`, 22, ic.y + 18);
                brCtx.restore();
            });

            // --- M. MODERN GLASSMORPHISM TOP STATUS HUD ---
            brCtx.fillStyle = "rgba(4, 7, 15, 0.88)";
            brCtx.fillRect(0, 0, brickCanvasElement.width, 42);
            brCtx.strokeStyle = "rgba(0, 210, 211, 0.25)";
            brCtx.beginPath();
            brCtx.moveTo(0, 42);
            brCtx.lineTo(brickCanvasElement.width, 42);
            brCtx.stroke();

            // Glowing Hearts ❤️
            for (let h = 0; h < 3; h++) {
                brCtx.shadowColor = h < gameHeartsRemaining ? '#ff4757' : 'transparent';
                brCtx.shadowBlur = h < gameHeartsRemaining ? 8 : 0;
                brCtx.fillStyle = h < gameHeartsRemaining ? '#ff4757' : 'rgba(255,255,255,0.15)';
                brCtx.beginPath();
                brCtx.arc(16 + (h * 15), 21, 5, 0, Math.PI * 2);
                brCtx.fill();
            }
            brCtx.shadowBlur = 0;

            // Charge Energy Bar
            let barX = 66, barY = 17, barW = 75, barH = 8;
            brCtx.fillStyle = 'rgba(255,255,255,0.12)';
            brCtx.beginPath();
            brCtx.roundRect(barX, barY, barW, barH, 4);
            brCtx.fill();

            brCtx.fillStyle = ballChargeMeter >= 100 ? '#00f2fe' : '#f1c40f';
            brCtx.shadowColor = brCtx.fillStyle;
            brCtx.shadowBlur = ballChargeMeter >= 100 ? 10 : 0;
            let currentRenderedWidth = (ballChargeMeter / 100) * barW;
            brCtx.beginPath();
            brCtx.roundRect(barX, barY, Math.max(0, currentRenderedWidth), barH, 4);
            brCtx.fill();
            brCtx.shadowBlur = 0;

            // Level Title & Theme Name
            brCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
            brCtx.font = "bold 11px Segoe UI, sans-serif";
            brCtx.textAlign = "left";
            let activePackMetadata = totalBrickPacksDataMatrix[currentSelectedPackName] || totalBrickPacksDataMatrix['A'];
            let activeLevelNameString = activePackMetadata.themes[Math.min(currentActiveLevelIndex - 1, activePackMetadata.themes.length - 1)];
            brCtx.fillText(`L${currentActiveLevelIndex} : ${activeLevelNameString.toUpperCase()}`, barX + barW + 10, 25);

            // Score with padded digits
            brCtx.fillStyle = "#ffffff";
            brCtx.font = "900 13px monospace";
            brCtx.textAlign = "right";
            let scoreDisplay = String(brickScoreCounter).padStart(5, '0');
            brCtx.fillText(scoreDisplay, brickCanvasElement.width - 85, 25);

            // Sound Toggle Button [ 🔊 / 🔇 ]
            brCtx.save();
            brCtx.strokeStyle = brickAudioMuted ? 'rgba(255, 255, 255, 0.25)' : 'rgba(0, 210, 211, 0.5)';
            brCtx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            brCtx.lineWidth = 1;

        // ===================================================================
        //FIXED: FLAPPY BIRD FLUID PHYSICS ENGINE (AAA UPGRADE)
        // ===================================================================
        function frameUpdateFlappy() {
            if (!flappyCanvasElement || !flCtx) return;

            flappyTime += 0.05;

            // --- 1. DYNAMIC DIFFICULTY PROGRESSION ---
            let difficultyLevel = Math.floor(flappyScoreTracker / 5);
            let currentSpeed = 2.2 + Math.min(2.0, difficultyLevel * 0.3); // Caps at +2.0 speed

            //VERTICAL GAP: Upar aur neeche wale pipe ke beech ka rasta (Bird ke nikalne ki jagah)
            let currentGapSize = Math.max(90, 130 - (difficultyLevel * 5));

            // Dynamic Theme Shifting
            if (difficultyLevel >= 4) flappyLevelTheme = { sky: '#0f2027', pipe: '#e74c3c', ground: '#c0392b' }; // Lava / Expert
            else if (difficultyLevel >= 2) flappyLevelTheme = { sky: '#2b5876', pipe: '#f39c12', ground: '#d35400' }; // Sunset / Hard
            else flappyLevelTheme = { sky: '#70c5ce', pipe: '#2ecc71', ground: '#27ae60' }; // Day / Easy

            // --- 2. CAMERA SHAKE & PARALLAX BACKGROUND ---
            let camOffsetX = 0, camOffsetY = 0;
            if (flappyCameraShake > 0) {
                camOffsetX = (Math.random() - 0.5) * flappyCameraShake;
                camOffsetY = (Math.random() - 0.5) * flappyCameraShake;
                flappyCameraShake *= 0.85;
                if (flappyCameraShake < 0.5) flappyCameraShake = 0;
            }

            flCtx.save();
            flCtx.translate(camOffsetX, camOffsetY);

            // Deep Sky Background
            flCtx.fillStyle = flappyLevelTheme.sky;
            flCtx.fillRect(0, 0, flappyCanvasElement.width, flappyCanvasElement.height);

            // Parallax Clouds
            flCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            flappyClouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.size < 0) { cloud.x = flappyCanvasElement.width + cloud.size; cloud.y = Math.random() * 150 + 20; }
                flCtx.beginPath();
                flCtx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                flCtx.arc(cloud.x + 15, cloud.y - 10, cloud.size * 0.8, 0, Math.PI * 2);
                flCtx.fill();
            });

            // --- 3. BIRD PHYSICS & ANIMATION ---
            let previousVelocity = fBird.velocity;
            fBird.velocity += 0.23;
            fBird.y += fBird.velocity;

            if (previousVelocity > 0 && fBird.velocity < -3) onFlappyJump();

            // Smooth Pitch Rotation
            let targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, fBird.velocity * 0.12));

            flCtx.save();
            flCtx.translate(50, fBird.y);
            flCtx.rotate(targetRotation);

            // Glowing Aura
            flCtx.shadowColor = '#f39c12';
            flCtx.shadowBlur = 12;

            // Plump 3D Bird Body (Spherical radial gradient)
            let birdBodyGrad = flCtx.createRadialGradient(-3, -3, 2, 0, 0, 15);
            birdBodyGrad.addColorStop(0, '#fff6a9');
            birdBodyGrad.addColorStop(0.35, '#ffd32a');
            birdBodyGrad.addColorStop(0.85, '#ff9f1a');
            birdBodyGrad.addColorStop(1, '#e58e26');
            flCtx.fillStyle = birdBodyGrad;
            flCtx.beginPath();
            flCtx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
            flCtx.fill();
            flCtx.shadowBlur = 0;

            // Rosy Cheek
            flCtx.fillStyle = "rgba(255, 107, 129, 0.55)";
            flCtx.beginPath();
            flCtx.arc(4, 2, 4, 0, Math.PI * 2);
            flCtx.fill();

            // Wing Flap Animation (3D layered wing with feathers)
            let flapSpeed = fBird.velocity < 0 ? 25 : 8;
            let wingY = Math.sin(flappyTime * flapSpeed) * 5;
            let wingGrad = flCtx.createLinearGradient(-10, wingY - 6, 2, wingY + 6);
            wingGrad.addColorStop(0, '#fff3a3');
            wingGrad.addColorStop(0.5, '#ffa801');
            wingGrad.addColorStop(1, '#d35400');
            flCtx.fillStyle = wingGrad;
            flCtx.beginPath();
            flCtx.ellipse(-4, wingY, 9, 6, -0.25, 0, Math.PI * 2);
            flCtx.fill();

            // Large Cute Anime Eye & Blinking
            let isBlinking = Math.random() > 0.985;
            flCtx.fillStyle = "white";
            flCtx.beginPath(); flCtx.arc(6, -4, 5.5, 0, Math.PI * 2); flCtx.fill();
            if (!isBlinking) {
                // Pupil
                flCtx.fillStyle = "#1e272e";
                flCtx.beginPath(); flCtx.arc(7.5, -4, 3, 0, Math.PI * 2); flCtx.fill();
                // Specular eye catchlights
                flCtx.fillStyle = "#ffffff";
                flCtx.beginPath(); flCtx.arc(6.5, -5.5, 1.3, 0, Math.PI * 2); flCtx.fill();
                flCtx.beginPath(); flCtx.arc(8.5, -3, 0.7, 0, Math.PI * 2); flCtx.fill();
            }

            // Beak (Curved glossy orange beak)
            let beakGrad = flCtx.createLinearGradient(10, -2, 22, 2);
            beakGrad.addColorStop(0, '#ff9f1a');
            beakGrad.addColorStop(1, '#c0392b');
            flCtx.fillStyle = beakGrad;
            flCtx.beginPath();
            flCtx.moveTo(9, -2);
            flCtx.quadraticCurveTo(18, -4, 21, 0);
            flCtx.quadraticCurveTo(16, 5, 9, 3);
            flCtx.closePath();
            flCtx.fill();

            // Tiny bird tail feathers
            flCtx.fillStyle = "#e58e26";
            flCtx.beginPath();
            flCtx.moveTo(-13, 0);
            flCtx.lineTo(-20, -5);
            flCtx.lineTo(-17, 0);
            flCtx.lineTo(-20, 5);
            flCtx.closePath();
            flCtx.fill();

            flCtx.restore();

            // --- 4. FLOOR CRASH DETECTOR ---
            let groundY = flappyCanvasElement.height - 30;
            if (fBird.y > groundY - 11 || fBird.y < -20) {
                flappyCameraShake = 15;
                onFlappyCrash();
                createFlappyParticles(50, fBird.y, '#ffd700', 30, true);
                finalizeFailedRun("\u{1F4A5} Bird Crashed! Try Again.");
                return;
            }

            // --- 5. PREMIUM PIPES & COLLISION (3D Cylindrical Shader) ---
            fPipes.forEach((p, idx) => {
                p.x -= currentSpeed;
                let pipeW = 50;

                // 3D Cylindrical Pipe Gradients
                let pipeGradTop = flCtx.createLinearGradient(p.x, 0, p.x + pipeW, 0);
                pipeGradTop.addColorStop(0, '#1e5f38');
                pipeGradTop.addColorStop(0.18, '#2ecc71');
                pipeGradTop.addColorStop(0.4, '#a8e6cf');
                pipeGradTop.addColorStop(0.7, '#27ae60');
                pipeGradTop.addColorStop(1, '#143d24');

                // Pipe Bodies
                flCtx.fillStyle = pipeGradTop;
                flCtx.fillRect(p.x, 0, pipeW, p.gapTop);
                flCtx.fillRect(p.x, p.gapBottom, pipeW, flappyCanvasElement.height - p.gapBottom);

                // Pipe Collar Flanges (Rim Lips)
                let lipH = 18;
                let lipExtra = 5;
                let lipGrad = flCtx.createLinearGradient(p.x - lipExtra, 0, p.x + pipeW + lipExtra, 0);
                lipGrad.addColorStop(0, '#1e5f38');
                lipGrad.addColorStop(0.2, '#3ae374');
                lipGrad.addColorStop(0.4, '#ffffff');
                lipGrad.addColorStop(0.75, '#27ae60');
                lipGrad.addColorStop(1, '#0e2f1b');

                flCtx.fillStyle = lipGrad;
                flCtx.beginPath();
                flCtx.roundRect(p.x - lipExtra, p.gapTop - lipH, pipeW + (lipExtra * 2), lipH, 3);
                flCtx.fill();

                flCtx.beginPath();
                flCtx.roundRect(p.x - lipExtra, p.gapBottom, pipeW + (lipExtra * 2), lipH, 3);
                flCtx.fill();

                // Collar Inner Dark Shadows
                flCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                flCtx.fillRect(p.x - lipExtra, p.gapTop - 3, pipeW + (lipExtra * 2), 3);
                flCtx.fillRect(p.x - lipExtra, p.gapBottom, pipeW + (lipExtra * 2), 3);

                //HORIZONTAL DISTANCE FIX: Agla pillar kitni door aayega
                // 175 ek dam perfect arcade distance hai. Isko 150 karoge toh paas ho jayenge, 200 karoge toh door ho jayenge.
                let horizontalDistanceBetweenPillars = 175;

                // Spawn Next Pipe
                if (p.x <= (flappyCanvasElement.width - horizontalDistanceBetweenPillars) && !p.registered) {
                    p.registered = true;
                    let minTop = 40;
                    let maxTop = groundY - currentGapSize - 40;
                    let nextTop = Math.random() * (maxTop - minTop) + minTop;
                    fPipes.push({
                        x: flappyCanvasElement.width,
                        gapTop: nextTop,
                        gapBottom: nextTop + currentGapSize,
                        registered: false
                    });
                }

                // AAA Collision Detection 
                let birdLeft = 50 - 9, birdRight = 50 + 9;
                let birdTop = fBird.y - 9, birdBottom = fBird.y + 9;

                if (p.x < birdRight && p.x + pipeW > birdLeft) {
                    if (birdTop < p.gapTop || birdBottom > p.gapBottom) {
                        flappyCameraShake = 12;
                        onFlappyCrash();
                        createFlappyParticles(50, fBird.y, '#ffd700', 25, true);
                        finalizeFailedRun("\u{1F4A5} Collision with Pipe! Try Again.");
                        return;
                    }
                }

                // AAA Scoring & Combo Hooks
                if (p.x + pipeW < 50 && p.registered === true && idx === 0) {
                    flappyScoreTracker++;
                    flappyCameraY = 5;
                    onFlappyPass();
                    createFlappyParticles(50, fBird.y, '#2ecc71', 15, false);

                    if (flappyScoreTracker >= (parseInt(rules.flappyTar) || 5)) {
                        onFlappyReward();
                        createFlappyParticles(50, fBird.y, '#f1c40f', 40, true);
                        triggerRewardCoupon(parseInt(rules.flappyDisc) || 0);
                    }
                    fPipes.shift();
                }
            });

            // --- 6. SCROLLING GROUND ---
            flappyGroundScroll = (flappyGroundScroll - currentSpeed) % 30;
            flCtx.fillStyle = flappyLevelTheme.ground;
            flCtx.fillRect(0, groundY, flappyCanvasElement.width, 30);
            flCtx.fillStyle = "rgba(0,0,0,0.15)";
            flCtx.fillRect(0, groundY, flappyCanvasElement.width, 4);

            flCtx.fillStyle = "rgba(0,0,0,0.1)";
            for (let gx = flappyGroundScroll; gx < flappyCanvasElement.width; gx += 30) {
                flCtx.beginPath();
                flCtx.moveTo(gx, groundY);
                flCtx.lineTo(gx + 15, groundY);
                flCtx.lineTo(gx + 5, flappyCanvasElement.height);
                flCtx.lineTo(gx - 10, flappyCanvasElement.height);
                flCtx.fill();
            }

            // --- 7. PARTICLE ENGINE RENDERER ---
            for (let i = flappyParticles.length - 1; i >= 0; i--) {
                let p = flappyParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) { flappyParticles.splice(i, 1); continue; }
                flCtx.globalAlpha = Math.max(0, p.life);
                flCtx.fillStyle = p.color;
                flCtx.beginPath(); flCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); flCtx.fill();
            }
            flCtx.globalAlpha = 1.0;

            flCtx.restore();

            // --- 8. MODERN GLASSMORPHISM HUD ---
            flCtx.fillStyle = "rgba(15, 23, 42, 0.75)";
            flCtx.beginPath(); flCtx.roundRect(10, 10, 110, 32, 8); flCtx.fill();

            flCtx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            flCtx.lineWidth = 1;
            flCtx.stroke();

            flCtx.fillStyle = "#ffffff";
            flCtx.font = "900 15px Segoe UI";
            flCtx.textAlign = "left";
            flCtx.fillText(` Pts: ${flappyScoreTracker}`, 18, 32);

            flCtx.fillStyle = "rgba(255, 255, 255, 0.5)";
            flCtx.font = "bold 10px Segoe UI";
            flCtx.textAlign = "right";
            flCtx.fillText(`Lvl ${difficultyLevel + 1}`, flappyCanvasElement.width - 15, 20);

            if (flappyCameraY > 0) flappyCameraY -= 0.5;
        }
