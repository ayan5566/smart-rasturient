                        twCtx.fill();
                    }
                    twCtx.fillStyle = '#22c55e';
                    for (let fx = winX + 3; fx < winX + winW - 3; fx += 8) {
                        twCtx.beginPath();
                        twCtx.arc(fx, winY + winH + 1, 2.2, 0, Math.PI * 2);
                        twCtx.fill();
                    }

                } else if (zoneTier === 3) {
                    // ========================================================
                    // ☁️ TIER 3 (FLOORS 21-30): TWILIGHT REFLECTIVE SPIRE
                    // Seamless reflective curtain wall with specular diagonal glares
                    // ========================================================
                    let glassW = w - 6;
                    let glassH = h - 6;
                    let glassX = x + 3;
                    let glassY = y + 3;

                    let cGrad = twCtx.createLinearGradient(glassX, glassY, glassX + glassW, glassY + glassH);
                    cGrad.addColorStop(0, '#1e1b4b');
                    cGrad.addColorStop(0.4, '#4338ca');
                    cGrad.addColorStop(0.8, '#06b6d4');
                    cGrad.addColorStop(1, '#0f172a');
                    twCtx.fillStyle = cGrad;
                    twCtx.fillRect(glassX, glassY, glassW, glassH);

                    // Vertical architectural louver mullions
                    twCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    twCtx.lineWidth = 0.8;
                    for (let mx = glassX + 8; mx < glassX + glassW; mx += 10) {
                        twCtx.beginPath();
                        twCtx.moveTo(mx, glassY);
                        twCtx.lineTo(mx, glassY + glassH);
                        twCtx.stroke();
                    }

                    // Bright specular glint
                    twCtx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    twCtx.beginPath();
                    twCtx.moveTo(glassX + (glassW * 0.2), glassY + glassH);
                    twCtx.lineTo(glassX + (glassW * 0.65), glassY);
                    twCtx.lineTo(glassX + (glassW * 0.72), glassY);
                    twCtx.lineTo(glassX + (glassW * 0.27), glassY + glassH);
                    twCtx.fill();

                } else if (zoneTier === 4) {
                    // ========================================================
                    // 🌙 TIER 4 (FLOORS 31-40): STRATOSPHERE PENTHOUSE
                    // Luxury champagne penthouse suites & ambient recessed downlights
                    // ========================================================
                    let suiteW = w - 8;
                    let suiteH = h - 8;
                    let suiteX = x + 4;
                    let suiteY = y + 4;

                    let sGrad = twCtx.createLinearGradient(suiteX, suiteY, suiteX, suiteY + suiteH);
                    sGrad.addColorStop(0, '#fef08a');
                    sGrad.addColorStop(0.6, '#f59e0b');
                    sGrad.addColorStop(1, '#090d16');
                    twCtx.fillStyle = sGrad;
                    twCtx.fillRect(suiteX, suiteY, suiteW, suiteH);

                    // Gold luxury frame
                    twCtx.strokeStyle = '#facc15';
                    twCtx.lineWidth = 1.0;
                    twCtx.strokeRect(suiteX, suiteY, suiteW, suiteH);

                    // Recessed ceiling spotlights
                    twCtx.fillStyle = '#ffffff';
                    for (let sx = suiteX + 6; sx < suiteX + suiteW; sx += 9) {
                        twCtx.beginPath();
                        twCtx.arc(sx, suiteY + 2, 1.0, 0, Math.PI * 2);
                        twCtx.fill();
                    }

                } else {
                    // ========================================================
                    // 🌌 TIER 5 (FLOORS 41-50): ORBITAL TITANIUM APEX
                    // Modular aerospace titanium panels & photon energy conduits
                    // ========================================================
                    let tW = w - 6;
                    let tH = h - 6;
                    let tX = x + 3;
                    let tY = y + 3;

                    twCtx.fillStyle = '#0f172a';
                    twCtx.fillRect(tX, tY, tW, tH);

                    // Glowing Cyan Photon Conduit Lines
                    twCtx.strokeStyle = '#00ffff';
                    twCtx.shadowColor = '#00ffff';
                    twCtx.shadowBlur = 6;
                    twCtx.lineWidth = 1.2;
                    twCtx.strokeRect(tX + 2, tY + 2, tW - 4, tH - 4);
                    twCtx.shadowBlur = 0;

                    // Central Observation Dome Window
                    let domeRad = Math.min(8, (h / 2) - 4);
                    let dGrad = twCtx.createRadialGradient(x + (w / 2), y + (h / 2), 1, x + (w / 2), y + (h / 2), domeRad);
                    dGrad.addColorStop(0, '#67e8f9');
                    dGrad.addColorStop(0.7, '#0891b2');
                    dGrad.addColorStop(1, '#164e63');
                    twCtx.fillStyle = dGrad;
                    twCtx.beginPath();
                    twCtx.arc(x + (w / 2), y + (h / 2), domeRad, 0, Math.PI * 2);
                    twCtx.fill();

                    // If Grand Spire (Floor 50): Add observation spire with pulsing aviation beacon
                    if (floorIndex >= 49 || towerScoreCounter >= 49) {
                        twCtx.fillStyle = '#e2e8f0';
                        twCtx.fillRect(x + (w / 2) - 2, y - 18, 4, 18);

                        // Pulsing red navigation strobe
                        let strobe = (Math.sin(Date.now() * 0.008) + 1) / 2;
                        twCtx.fillStyle = `rgba(239, 68, 68, ${0.4 + strobe * 0.6})`;
                        twCtx.beginPath();
                        twCtx.arc(x + (w / 2), y - 19, 3.5, 0, Math.PI * 2);
                        twCtx.fill();
                    }
                }
            }

            twCtx.restore();
        }

        // ✨ PERFECT ALIGNMENT SPARK & EXPANDING SHOCKWAVE VFX
        function createPerfectDropVFX(x, y) {
            towerGlowFlashAlpha = 0.55;

            // Radiant expanding circular shockwave ring
            towerShockwavesArray.push({
                x: x,
                y: y,
                radius: 6,
                maxRadius: 48,
                alpha: 1.0,
                color: '#facc15'
            });

            // 28 High-energy stardust particles
            for (let i = 0; i < 28; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2.5 + Math.random() * 5.5;
                towerParticlesArray.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.2,
                    size: Math.random() * 3.5 + 1.5,
                    alpha: 1.0,
                    color: ['#facc15', '#f59e0b', '#38bdf8', '#4ade80', '#ffffff'][Math.floor(Math.random() * 5)]
                });
            }

            // Bouncy celebratory combo text
            towerFloatingTexts.push({
                text: towerPerfectCombo > 1 ? `PERFECT x${towerPerfectCombo}! 🔥` : `PERFECT! 🎯`,
                x: x - 20,
                y: y - 18,
                alpha: 1.0,
                scale: 1.35
            });
        }

        // 💨 GOOD DROP BILLOWING DUST PARTICLES & CONCRETE CHIPS
        function createLandingDustParticles(x, y) {
            // Billowing soft dust smoke puffs
            for (let i = 0; i < 14; i++) {
                towerParticlesArray.push({
                    x: x + Math.random() * 45,
                    y: y,
                    vx: (Math.random() - 0.5) * 4.0,
                    vy: -Math.random() * 2.2 - 0.6,
                    size: Math.random() * 3.8 + 1.5,
                    alpha: 0.9,
                    color: '#cbd5e1'
                });
            }
            // Small concrete chips / pebbles
            for (let i = 0; i < 6; i++) {
                towerDebrisArray.push({
                    x: x + Math.random() * 40,
                    y: y - 2,
                    vx: (Math.random() - 0.5) * 5.0,
                    vy: -Math.random() * 3.5 - 1.0,
                    size: Math.random() * 2.2 + 1.0,
                    alpha: 1.0,
                    color: '#64748b'
                });
            }
        }

        function frameUpdateTowerBloxx() {
            if (!towerCanvasElement || !twCtx) return;

            twCtx.clearRect(0, 0, towerCanvasElement.width, towerCanvasElement.height);

            // 🎥 1. SMOOTH CINEMATIC MONOTONIC CAMERA TRACKING LOGIC
            let surfaceAnchorBaseBlock = activeTowerBlocksArray[activeTowerBlocksArray.length - 1];
            let structuralTargetLandingY = surfaceAnchorBaseBlock.y;

            // Crane stays fixed in relative distance above top floor
            currentSwingingBlock.pivotY = structuralTargetLandingY - 175;

            // Smooth monotonic upward tracking: lock crane to comfortable view below HUD (~64px)
            // Eliminates any bouncing, dipping down and up at 4-5 blocks!
            const targetScreenCraneY = 64;
            towerTargetCameraY = Math.max(0, targetScreenCraneY - currentSwingingBlock.pivotY);

            // Progressive altitude zoom (subtle 0.88 cap at high altitude)
            towerTargetZoom = Math.max(0.88, 1.0 - (towerScoreCounter * 0.0025));

            // Smooth Lerp Interpolation
            towerSmoothCameraY += (towerTargetCameraY - towerSmoothCameraY) * 0.085;
            towerCameraZoom += (towerTargetZoom - towerCameraZoom) * 0.05;
            towerCameraOffsetOffsetY = towerSmoothCameraY;

            // 2. Render 50-Floor Continuous Dynamic Atmosphere
            render50FloorAtmosphere(towerScoreCounter);

            // ==========================================
            // 🌍 START WORLD SPACE MATRIX
            // ==========================================
            twCtx.save();

            // Camera Scroll & Screen Shake Vibration (Applied first in screen space)
            twCtx.translate(towerVisualVibrationScaleX, towerCameraOffsetOffsetY);

            // Focal-Point Zoom anchored directly at the Crane Pivot (zero vertical drift or jumping!)
            let canvasCenterX = towerCanvasElement.width / 2;
            let craneWorldPivotY = currentSwingingBlock.pivotY;
            twCtx.translate(canvasCenterX, craneWorldPivotY);
            twCtx.scale(towerCameraZoom, towerCameraZoom);
            twCtx.translate(-canvasCenterX, -craneWorldPivotY);

            if (towerVisualVibrationScaleX !== 0) {
                towerVisualVibrationScaleX *= -0.78;
                if (Math.abs(towerVisualVibrationScaleX) < 0.2) towerVisualVibrationScaleX = 0;
            }

            // Damped Spring Elastic Squash & Stretch Settling
            if (towerStackSquashY !== 0) {
                towerStackSquashY *= -0.72;
                if (Math.abs(towerStackSquashY) < 0.005) towerStackSquashY = 0;
            }

            // Stack Dynamic Structural Sway Settling
            if (towerStackSwayVel !== 0 || towerStackSwayAngle !== 0) {
                towerStackSwayAngle += towerStackSwayVel;
                towerStackSwayVel += -towerStackSwayAngle * 0.14;
                towerStackSwayVel *= 0.88;
                if (Math.abs(towerStackSwayAngle) < 0.001 && Math.abs(towerStackSwayVel) < 0.001) {
                    towerStackSwayAngle = 0;
                    towerStackSwayVel = 0;
                }
            }

            // 4. Render Placed Skyscraper Floors (with Elastic Spring Compression & Sway)
            let totalBlocks = activeTowerBlocksArray.length;
            activeTowerBlocksArray.forEach((block, idx) => {
                twCtx.save();

                // Compute elastic compression ripple on topmost placed blocks
                let distFromTop = totalBlocks - 1 - idx;
                let squashFactor = distFromTop <= 4 ? Math.max(0, 1 - (distFromTop * 0.24)) : 0;
                let currentBlockSquashY = towerStackSquashY * block.h * squashFactor;

                // Subtle structural sway ripple along height
                let swayX = distFromTop <= 8 ? (towerStackSwayAngle * (8 - distFromTop) * 2.8) : 0;

                drawStylizedSquareBlock(
                    block.x + swayX,
                    block.y + currentBlockSquashY,
                    block.w,
                    block.h,
                    block.color,
                    idx,
                    block.isAnchor
                );

                twCtx.restore();
            });

            // 5. Update and Render Expanding Shockwave Rings
            for (let i = towerShockwavesArray.length - 1; i >= 0; i--) {
                let sw = towerShockwavesArray[i];
                sw.radius += 2.8;
                sw.alpha -= 0.045;
                if (sw.alpha <= 0) {
                    towerShockwavesArray.splice(i, 1);
                    continue;
                }
                twCtx.save();
                twCtx.strokeStyle = sw.color || '#facc15';
                twCtx.globalAlpha = Math.max(0, sw.alpha);
                twCtx.lineWidth = 2.4;
                twCtx.beginPath();
                twCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                twCtx.stroke();
                twCtx.restore();
            }

            // 6. Update and Render Particles (Sparks & Smoke Dust)
            for (let i = towerParticlesArray.length - 1; i >= 0; i--) {
                let p = towerParticlesArray[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.035;
                if (p.alpha <= 0) {
                    towerParticlesArray.splice(i, 1);
                    continue;
                }
                twCtx.fillStyle = p.color || `rgba(255, 255, 255, ${p.alpha})`;
                twCtx.globalAlpha = Math.max(0, p.alpha);
                twCtx.beginPath();
                twCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                twCtx.fill();
                twCtx.globalAlpha = 1.0;
            }

            // Update Concrete Pebble Debris
            for (let i = towerDebrisArray.length - 1; i >= 0; i--) {
                let d = towerDebrisArray[i];
                d.x += d.vx;
                d.y += d.vy;
                d.vy += 0.35; // gravity
                d.alpha -= 0.03;
                if (d.alpha <= 0) {
                    towerDebrisArray.splice(i, 1);
                    continue;
                }
                twCtx.fillStyle = d.color;
                twCtx.globalAlpha = Math.max(0, d.alpha);
                twCtx.fillRect(d.x, d.y, d.size, d.size);
                twCtx.globalAlpha = 1.0;
            }

            // Render Floating Text FX (PERFECT! / COMBOS)
            for (let i = towerFloatingTexts.length - 1; i >= 0; i--) {
                let ft = towerFloatingTexts[i];
                ft.y -= 0.9;
                ft.alpha -= 0.024;
                if (ft.alpha <= 0) {
                    towerFloatingTexts.splice(i, 1);
                    continue;
                }
                twCtx.save();
                twCtx.font = '900 14px "Segoe UI", system-ui, sans-serif';
                twCtx.fillStyle = `rgba(250, 204, 21, ${ft.alpha})`;
                twCtx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                twCtx.shadowBlur = 6;
                twCtx.fillText(ft.text, ft.x, ft.y);
                twCtx.restore();
            }

            // 7. ⛓️ SUSPENSION CABLE & CLAW (INFINITY ∞ MOTION ENGINE)
            let cranePivotX = currentSwingingBlock.pivotX;
            let cranePivotY = currentSwingingBlock.pivotY;

            if (!isTowerBlockDropping && towerGameState === 'PLAYING') {
                // ♾️ Mathematical Lemniscate (Infinity Symbol ∞) Harmonic Motion
                currentSwingingBlock.swingTimer += currentSwingingBlock.speed;
                let t = currentSwingingBlock.swingTimer;

                // Horizontal Infinity ∞ Path: X ~ sin(t), Y ~ sin(2t)
                let infinityAmpX = currentSwingingBlock.length * Math.sin(currentSwingingBlock.maxAngle);
                let infinityAmpY = 18; // Vertical lobe loop elevation

                let offsetX = infinityAmpX * Math.sin(t);
                let offsetY = currentSwingingBlock.length + (infinityAmpY * Math.sin(2 * t));

                currentSwingingBlock.x = currentSwingingBlock.pivotX + offsetX - (currentSwingingBlock.w / 2);
                currentSwingingBlock.y = currentSwingingBlock.pivotY + offsetY - (currentSwingingBlock.h / 2);

                let blockCenterX = currentSwingingBlock.x + (currentSwingingBlock.w / 2);
                let blockTopY = currentSwingingBlock.y;

                // Suspension Cables Hanging Freely from Sky (Bar Removed!)
                twCtx.save();
                twCtx.strokeStyle = '#94a3b8';
                twCtx.lineWidth = 1.8;
                [-2.5, 2.5].forEach(offsetCable => {
                    twCtx.beginPath();
                    twCtx.moveTo(cranePivotX + offsetCable, cranePivotY - 50);
                    twCtx.lineTo(blockCenterX + offsetCable, blockTopY);
                    twCtx.stroke();
                });

                // Heavy Hydraulic Spreader Beam
                twCtx.fillStyle = '#475569';
                twCtx.fillRect(blockCenterX - (currentSwingingBlock.w * 0.45), blockTopY - 6, currentSwingingBlock.w * 0.9, 6);

                // Articulated Claw Arms Gripping the Block
                twCtx.fillStyle = '#f59e0b';
                let clawW = 5;
                let clawH = 10;
                // Left arm
                twCtx.fillRect(blockCenterX - (currentSwingingBlock.w * 0.48), blockTopY - 5, clawW, clawH);
                // Right arm
                twCtx.fillRect(blockCenterX + (currentSwingingBlock.w * 0.48) - clawW, blockTopY - 5, clawW, clawH);

                // Subtle Downward Plumb Laser Alignment Guide
                twCtx.strokeStyle = 'rgba(0, 255, 255, 0.22)';
                twCtx.lineWidth = 1.0;
                twCtx.setLineDash([4, 4]);
                twCtx.beginPath();
                twCtx.moveTo(blockCenterX, currentSwingingBlock.y + currentSwingingBlock.h);
                twCtx.lineTo(blockCenterX, structuralTargetLandingY);
                twCtx.stroke();
                twCtx.setLineDash([]);
                twCtx.restore();

                // Draw the Swinging Skyscraper Block
                drawStylizedSquareBlock(
                    currentSwingingBlock.x,
                    currentSwingingBlock.y,
                    currentSwingingBlock.w,
                    currentSwingingBlock.h,
                    currentSwingingBlock.color,
                    towerScoreCounter,
                    false
                );

            } else if (isTowerBlockDropping && towerGameState === 'PLAYING') {
                // 8. ⛓️ FREE FALL ACCELERATING GRAVITY PHYSICS
                currentSwingingBlock.dropSpeedY = Math.min(16.0, currentSwingingBlock.dropSpeedY + currentSwingingBlock.dropAccY);
                currentSwingingBlock.dropY += currentSwingingBlock.dropSpeedY;

                // Draw Clean Suspension Cable from Sky (No top bar)
                twCtx.save();
                let cableEndBlockX = currentSwingingBlock.dropX + (currentSwingingBlock.w / 2);
                let cableEndBlockY = currentSwingingBlock.pivotY + 85;
                [-2.5, 2.5].forEach(offsetCable => {
                    twCtx.strokeStyle = '#64748b';
                    twCtx.lineWidth = 1.5;
                    twCtx.beginPath();
                    twCtx.moveTo(cranePivotX + offsetCable, cranePivotY - 50);
                    twCtx.lineTo(cableEndBlockX + offsetCable, cableEndBlockY);
                    twCtx.stroke();
                });
                twCtx.fillStyle = '#f59e0b';
                // Claw arms open wide
                twCtx.fillRect(cableEndBlockX - 16, cableEndBlockY, 5, 8);
                twCtx.fillRect(cableEndBlockX + 11, cableEndBlockY, 5, 8);
                twCtx.restore();

                // Draw Falling Block
                drawStylizedSquareBlock(
                    currentSwingingBlock.dropX,
                    currentSwingingBlock.dropY,
                    currentSwingingBlock.w,
                    currentSwingingBlock.h,
                    currentSwingingBlock.color,
                    towerScoreCounter,
                    false
                );

                // Collision / Landing Check
                if ((currentSwingingBlock.dropY + currentSwingingBlock.h) >= structuralTargetLandingY) {
                    isTowerBlockDropping = false;
                    let blockContactX = currentSwingingBlock.dropX;
                    let structuralOffsetErrorX = Math.abs(blockContactX - surfaceAnchorBaseBlock.x);
                    let maximumAllowableMarginWidth = surfaceAnchorBaseBlock.w * 0.70;

                    if (structuralOffsetErrorX <= maximumAllowableMarginWidth) {
                        // Successful Landing!
                        towerScoreCounter++;
                        towerMaxCombo = Math.max(towerMaxCombo, towerPerfectCombo);

                        // Trigger elastic spring squash & structural sway
                        towerStackSquashY = -0.20;
                        let offsetDir = (blockContactX - surfaceAnchorBaseBlock.x) / surfaceAnchorBaseBlock.w;
                        towerStackSwayVel += offsetDir * 0.07;

                        if (structuralOffsetErrorX <= 4) {
                            // Perfect drop!
                            towerPerfectCombo++;
                            towerVisualVibrationScaleX = 5.5;
                            playTowerSound('IMPACT_PERFECT', towerPerfectCombo);
                            createPerfectDropVFX(blockContactX + (currentSwingingBlock.w / 2), structuralTargetLandingY);
                        } else {
                            // Good landing!
                            if (structuralOffsetErrorX > maximumAllowableMarginWidth * 0.65) {
                                playTowerSound('WOBBLE');
                            }
                            towerPerfectCombo = 0;
                            towerVisualVibrationScaleX = 2.8;
                            playTowerSound('IMPACT_GOOD');
                            createLandingDustParticles(blockContactX, structuralTargetLandingY);
                        }

                        // Vibrant Modern Skyscraper Color Spectrum
                        const blockSpectrumColors = ['#f39c12', '#9b59b6', '#0284c7', '#10b981', '#e11d48', '#8b5cf6', '#d97706'];
                        let chosenColorHex = blockSpectrumColors[towerScoreCounter % blockSpectrumColors.length];

                        activeTowerBlocksArray.push({
                            x: blockContactX,
                            y: structuralTargetLandingY - currentSwingingBlock.h,
                            w: currentSwingingBlock.w,
                            h: currentSwingingBlock.h,
                            color: chosenColorHex,
                            isAnchor: false
                        });

                        // Discount Rule Check (Preserved 100%)
                        if (currentTowerLevelState === (parseInt(rules.towerTar) || 3)) {
                            if (typeof triggerRewardCoupon === 'function') {
                                let earnedPercent = parseInt(rules.towerDisc) || 0;
                                triggerRewardCoupon(earnedPercent);
                                playTowerSound('REWARD');
                            }
                        }

                        // Level Up Logic (Preserved 100%)
                        let calculatedLevel = calculateTowerLevel(towerScoreCounter);
                        if (calculatedLevel > currentTowerLevelState) {
                            currentTowerLevelState = calculatedLevel;
                            playTowerSound('LEVEL_UP');
                            showOnScreenNotification(`🏢 Level Up! Advanced to Tower Level ${currentTowerLevelState}`);
                        }

                        // Grand Victory Check (50 Floors)
                        if (towerScoreCounter >= 50) {
                            clearInterval(loopTimerInstance);
                            playTowerSound('REWARD');
                            alert("👑 GRAND VICTORY! You built the ultimate 50-story space skyscraper!");
                            if (typeof switchGameMode === 'function') switchGameMode('FLAPPY');
                            return;
                        }

                        // Reset Swinging Block for next floor
                        currentSwingingBlock.swingTimer = Math.random() * Math.PI * 2;
                        currentSwingingBlock.speed = calculateTowerSwingSpeed(towerScoreCounter);
                        currentSwingingBlock.color = chosenColorHex;
                        towerClawOpen = 0;

                    } else {
                        // 💥 Collapse Failure Animation
                        towerGameState = 'COLLAPSING';
                        playTowerSound('COLLAPSE');
                        towerVisualVibrationScaleX = 16.0;

                        towerCollapseAnim = {
                            x: blockContactX,
                            y: structuralTargetLandingY - currentSwingingBlock.h,
                            w: currentSwingingBlock.w,
                            h: currentSwingingBlock.h,
                            vx: (blockContactX > surfaceAnchorBaseBlock.x ? 3.5 : -3.5),
                            vy: -2.0,
                            rot: 0,
                            vRot: (blockContactX > surfaceAnchorBaseBlock.x ? 0.08 : -0.08),
                            color: currentSwingingBlock.color
                        };

                        setTimeout(() => {
                            finalizeFailedRun("💥 Tower Collapsed! Stack alignment balance failure.");
                        }, 850);
                    }
                }
            } else if (towerGameState === 'COLLAPSING' && towerCollapseAnim) {
                // Tumble tumbling block with gravity
                towerCollapseAnim.x += towerCollapseAnim.vx;
                towerCollapseAnim.y += towerCollapseAnim.vy;
                towerCollapseAnim.vy += 0.55;
                towerCollapseAnim.rot += towerCollapseAnim.vRot;

                twCtx.save();
                twCtx.translate(towerCollapseAnim.x + (towerCollapseAnim.w / 2), towerCollapseAnim.y + (towerCollapseAnim.h / 2));
                twCtx.rotate(towerCollapseAnim.rot);
                drawStylizedSquareBlock(
                    -towerCollapseAnim.w / 2,
                    -towerCollapseAnim.h / 2,
                    towerCollapseAnim.w,
                    towerCollapseAnim.h,
                    towerCollapseAnim.color,
                    towerScoreCounter,
                    false
                );
                twCtx.restore();
            }

            // ==========================================
            // 🌍 END WORLD SPACE MATRIX
            // ==========================================
            twCtx.restore();

            // Screen Glow Flash Overlay for Perfect Alignment
            if (towerGlowFlashAlpha > 0) {
                twCtx.fillStyle = `rgba(250, 204, 21, ${towerGlowFlashAlpha * 0.35})`;
                twCtx.fillRect(0, 0, towerCanvasElement.width, towerCanvasElement.height);
                towerGlowFlashAlpha -= 0.04;
            }

            // ==========================================
            // 💎 MODERN GLASSMORPHIC HUD & ALTIMETER
            // ==========================================
            twCtx.save();
            const canvasW = towerCanvasElement.width;

            // Tier Zone Names
            const zoneTitles = [
                'Downtown',
                'Sky Gardens',
                'Twilight Spire',
                'Stratosphere',
                'Orbital Apex'
            ];
            const zoneIcons = ['🏗️', '🌿', '☁️', '🌙', '🌌'];
            let currentZoneName = zoneTitles[currentTowerLevelState - 1] || 'Apex';
            let currentZoneIcon = zoneIcons[currentTowerLevelState - 1] || '🏢';

            // Top Left Chip: Level & Zone

        function interpolateColor(color1, color2, factor) {
            let c1 = hexToRgb(color1);
            let c2 = hexToRgb(color2);
            let r = Math.round(c1.r + factor * (c2.r - c1.r));
            let g = Math.round(c1.g + factor * (c2.g - c1.g));
            let b = Math.round(c1.b + factor * (c2.b - c1.b));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
            let num = parseInt(hex, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function lightenColor(color, percent) {
            let rgb = hexToRgb(color);
            let r = Math.min(255, Math.floor(rgb.r + (255 - rgb.r) * (percent / 100)));
            let g = Math.min(255, Math.floor(rgb.g + (255 - rgb.g) * (percent / 100)));
            let b = Math.min(255, Math.floor(rgb.b + (255 - rgb.b) * (percent / 100)));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function darkenColor(color, percent) {
            let rgb = hexToRgb(color);
            let r = Math.max(0, Math.floor(rgb.r * (1 - percent / 100)));
            let g = Math.max(0, Math.floor(rgb.g * (1 - percent / 100)));
            let b = Math.max(0, Math.floor(rgb.b * (1 - percent / 100)));
            return `rgb(${r}, ${g}, ${b})`;
        }

        var isBrickKeyboardBound = false;

        function initBrickBreakerGame() {
            clearInterval(loopTimerInstance);
            const bCanvas = document.getElementById('brickCanvas');
            if (!bCanvas) return;
            brCtx = bCanvas.getContext('2d');

            if (currentActiveLevelIndex === 1) {
                let packOptions = ['A', 'B', 'C', 'D'];
                currentSelectedPackName = packOptions[Math.floor(Math.random() * packOptions.length)];
                gameHeartsRemaining = 3;
            }

            brickPaddleDir = 0;
            activeDropsArray = [];
            isBallLaunched = false;
            ballChargeMeter = 0;
            isSuperBallActive = false;

            let targetPack = totalBrickPacksDataMatrix[currentSelectedPackName];

            if (!targetPack) {
                console.error(`Pack "${currentSelectedPackName}" not found in totalBrickPacksDataMatrix.`);
                return; // Exit the function to prevent the crash
            }

            let currentMapBlueprint = targetPack.layouts[currentActiveLevelIndex - 1];

            let baseSpeedOffset = 3.2 + (currentActiveLevelIndex * 0.3);

            bPaddle = { x: (bCanvas.width / 2) - 45, y: bCanvas.height - 35, w: 90, h: 10 };
            bBall = { x: bCanvas.width / 2, y: bCanvas.height - 55, r: 6, dx: 0, dy: 0, baseSpeed: baseSpeedOffset };

            activeBricksArray = [];
            let rRows = currentMapBlueprint.length;
            let cCols = currentMapBlueprint[0].length;

            let paddingWidth = 3;
            let calcBrickW = Math.floor((bCanvas.width - (paddingWidth * (cCols + 1))) / cCols);
            let calcBrickH = 11;

            const colorDictionary = { '1': '#4facfe', '2': '#ff4b5c', '3': '#ffcc00', '4': '#1dd1a1' };

            for (let r = 0; r < rRows; r++) {
                for (let c = 0; c < cCols; c++) {
                    let itemKey = currentMapBlueprint[r][c];
                    if (itemKey !== '0') {
                        let bX = (c * (calcBrickW + paddingWidth)) + paddingWidth;
                        let bY = (r * (calcBrickH + paddingWidth)) + 65;

                        let isSpecialNode = itemKey === 'H' ? 'HIDDEN' : (itemKey === 'T' ? 'TNT' : 'NONE');
                        let assignedColor = isSpecialNode === 'TNT' ? '#e67e22' : (colorDictionary[itemKey] || '#ffffff');

                        activeBricksArray.push({
                            x: bX, y: bY, w: calcBrickW, h: calcBrickH,
                            color: assignedColor, special: isSpecialNode, status: 1
                        });
                    }
                }
            }

            // Bind Keyboard Listeners ONCE only to prevent duplicate handler memory leaks
            if (!isBrickKeyboardBound) {
                window.addEventListener('keydown', (e) => {
                    if (activeGameMode === 'BRICK') {
                        if (e.key === 'ArrowLeft') brickPaddleDir = -7;
                        if (e.key === 'ArrowRight') brickPaddleDir = 7;
                    }
                });
                window.addEventListener('keyup', (e) => {
                    if (activeGameMode === 'BRICK') {
                        if ((e.key === 'ArrowLeft' && brickPaddleDir < 0) || (e.key === 'ArrowRight' && brickPaddleDir > 0)) brickPaddleDir = 0;
                    }
                });
                isBrickKeyboardBound = true;
            }

            loopTimerInstance = setInterval(frameUpdateBrickBreaker, 16);
        }

        // ===================================================================
        // 2️⃣ HIGH-PERFORMANCE AAA RENDER TICK ENGINE (60 FPS STABLE)
        // ===================================================================
        function frameUpdateBrickBreaker() {
            if (!brickCanvasElement) brickCanvasElement = document.getElementById('brickCanvas');
            if (!brickCanvasElement || !brCtx) return;

            // --- 1. CAMERA SHAKE SETUP ---
            let camOffsetX = 0, camOffsetY = 0;
            if (brickCameraShake > 0) {
                camOffsetX = (Math.random() - 0.5) * brickCameraShake;
                camOffsetY = (Math.random() - 0.5) * brickCameraShake;
                brickCameraShake *= 0.85;
                if (brickCameraShake < 0.5) brickCameraShake = 0;
            }

            brCtx.save();
            brCtx.translate(camOffsetX, camOffsetY);

            // --- 2. DYNAMIC AAA BACKGROUND ---
            brickBgPulseTime += 0.02;
            let bgGrd = brCtx.createLinearGradient(0, 0, 0, brickCanvasElement.height);

            if (currentActiveLevelIndex === 5) {
                // Boss Level Environment (Intense Red/Purple)
                bgGrd.addColorStop(0, '#1a0505');
                bgGrd.addColorStop(0.5, '#2c0b1e');
                bgGrd.addColorStop(1, '#0f020a');
            } else {
                // Standard Cyber Grid
                bgGrd.addColorStop(0, '#0f111a');
                bgGrd.addColorStop(1, currentActiveLevelIndex > 2 ? '#0b1d28' : '#16192b');
            }

            brCtx.fillStyle = bgGrd;
            brCtx.fillRect(0, 0, brickCanvasElement.width, brickCanvasElement.height);

            // Animated glowing background grid
            brCtx.strokeStyle = currentActiveLevelIndex === 5 ? 'rgba(231, 76, 60, 0.08)' : 'rgba(0, 210, 211, 0.05)';
            brCtx.lineWidth = 1;
            let gridSpacer = 20;
            let scrollOffset = (brickBgPulseTime * 15) % gridSpacer;
            for (let x = 0; x < brickCanvasElement.width; x += gridSpacer) {
                brCtx.beginPath(); brCtx.moveTo(x, 40); brCtx.lineTo(x, brickCanvasElement.height); brCtx.stroke();
            }
            for (let y = 40; y < brickCanvasElement.height + gridSpacer; y += gridSpacer) {
                brCtx.beginPath(); brCtx.moveTo(0, y + scrollOffset); brCtx.lineTo(brickCanvasElement.width, y + scrollOffset); brCtx.stroke();
            }

            // --- 3. PADDLE MOVEMENT & RENDER ---
            bPaddle.x += brickPaddleDir;
            if (bPaddle.x < 0) bPaddle.x = 0;
            if (bPaddle.x > brickCanvasElement.width - bPaddle.w) bPaddle.x = brickCanvasElement.width - bPaddle.w;

            brCtx.save();
            brCtx.shadowColor = isSuperBallActive ? '#00d2d3' : '#f39c12';
            brCtx.shadowBlur = brickPaddleDir !== 0 ? 15 : 5; // Glows brighter when moving

            // Metallic 3D Paddle Gradient
            let padGrad = brCtx.createLinearGradient(bPaddle.x, bPaddle.y, bPaddle.x, bPaddle.y + bPaddle.h);
            padGrad.addColorStop(0, '#ffffff');
            padGrad.addColorStop(0.3, '#bdc3c7');
            padGrad.addColorStop(1, '#2c3e50');

            brCtx.fillStyle = padGrad;
            brCtx.beginPath();
            brCtx.roundRect(bPaddle.x, bPaddle.y, bPaddle.w, bPaddle.h, 6);
            brCtx.fill();

            // Neon Energy Strip inside Paddle
            brCtx.fillStyle = isSuperBallActive ? '#00ffff' : '#f1c40f';
            brCtx.shadowBlur = 10;
            brCtx.fillRect(bPaddle.x + 12, bPaddle.y + 3, bPaddle.w - 24, 3);
            brCtx.restore();

            // --- 4. BALL PHYSICS & RENDER ---
            if (!isBallLaunched) {
                brickBallTrailArray = [];
                if (brickPaddleDir !== 0) {
                    isBallLaunched = true;
                    bBall.dx = brickPaddleDir > 0 ? bBall.baseSpeed : -bBall.baseSpeed;
                    bBall.dy = -bBall.baseSpeed;
                } else {
                    bBall.x = bPaddle.x + (bPaddle.w / 2);
                    bBall.y = bPaddle.y - bBall.r - 4; // Slight hover
                }
            } else {
                bBall.x += bBall.dx;
                bBall.y += bBall.dy;

                // Ball Light Trail Logic
                brickBallTrailArray.push({ x: bBall.x, y: bBall.y, alpha: 0.8 });
                if (brickBallTrailArray.length > (isSuperBallActive ? 12 : 5)) brickBallTrailArray.shift();
            }

            // Render Trail
            brickBallTrailArray.forEach((t) => {
                t.alpha -= isSuperBallActive ? 0.05 : 0.12;
                if (t.alpha <= 0) return;
                brCtx.globalAlpha = Math.max(0, t.alpha);
                brCtx.fillStyle = isSuperBallActive ? '#00d2d3' : '#f1c40f';
                brCtx.beginPath(); brCtx.arc(t.x, t.y, bBall.r * (t.alpha), 0, Math.PI * 2); brCtx.fill();
            });
            brCtx.globalAlpha = 1.0;

            // Render Ball Core
            brCtx.save();
            brCtx.shadowColor = isSuperBallActive ? '#00ffff' : '#f39c12';
            brCtx.shadowBlur = 12;
            brCtx.fillStyle = '#ffffff';
            brCtx.beginPath(); brCtx.arc(bBall.x, bBall.y, bBall.r, 0, Math.PI * 2); brCtx.fill();
            brCtx.fillStyle = isSuperBallActive ? '#00d2d3' : '#e67e22';
            brCtx.beginPath(); brCtx.arc(bBall.x, bBall.y, bBall.r * 0.5, 0, Math.PI * 2); brCtx.fill();
            brCtx.restore();

            // --- 5. WALL & PADDLE COLLISIONS ---
            if (bBall.x + bBall.r > brickCanvasElement.width || bBall.x - bBall.r < 0) {
                bBall.dx *= -1;
                createBrickExplosion(bBall.x, bBall.y, '#bdc3c7', 4, false); // Wall spark
                if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'WALL_HIT');
            }
            if (bBall.y - bBall.r < 40) {
                bBall.dy *= -1;
                createBrickExplosion(bBall.x, bBall.y, '#bdc3c7', 4, false); // Ceiling spark
                if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'WALL_HIT');
            }

            // Paddle Impact
            if (bBall.y + bBall.r >= bPaddle.y && bBall.x >= bPaddle.x && bBall.x <= bPaddle.x + bPaddle.w) {
                if (bBall.dy > 0) {
                    let relativeFactor = (bBall.x - (bPaddle.x + bPaddle.w / 2)) / (bPaddle.w / 2);
                    bBall.dx = relativeFactor * (bBall.baseSpeed + 1.5); // Slightly wider angle
                    bBall.dy = -Math.abs(bBall.baseSpeed);

                    // 🛡️ Add tiny random variation to prevent perfectly repeated bounce loops
                    bBall.dx += (Math.random() - 0.5) * 0.4;

                    applyBrickCameraShake(2);
                    createBrickExplosion(bBall.x, bBall.y, '#f1c40f', 8, false); // Paddle hit spark
                    if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'PADDLE_HIT');
                }
            }

            // 🛡️ ANTI-STUCK & SPEED NORMALIZER
            if (isBallLaunched) {
                // Prevent pure vertical loops (90°)
                if (Math.abs(bBall.dx) < 0.6) {
                    bBall.dx = bBall.dx < 0 ? -0.8 : 0.8;
                }
                // Prevent pure horizontal loops (0°)
                if (Math.abs(bBall.dy) < 0.6) {
                    bBall.dy = bBall.dy < 0 ? -0.8 : 0.8;
                }

                // Normalize ball speed vector to maintain constant velocity without speed spikes
                let currentSpeed = Math.sqrt(bBall.dx * bBall.dx + bBall.dy * bBall.dy);
                if (currentSpeed > 0) {
                    bBall.dx = (bBall.dx / currentSpeed) * bBall.baseSpeed;
                    bBall.dy = (bBall.dy / currentSpeed) * bBall.baseSpeed;
                }
            }

            // ✅ SAFE LIFE PROCESSOR
            if (bBall.y + bBall.r > brickCanvasElement.height) {
                if (!isLifeBeingProcessed) {
                    isLifeBeingProcessed = true;
                    gameHeartsRemaining--;
                    isBallLaunched = false;
                    isSuperBallActive = false;
                    applyBrickCameraShake(15); // Hard death shake

                    if (gameHeartsRemaining <= 0) {
                        currentActiveLevelIndex = 1;
                        isLifeBeingProcessed = false;
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'GAME_OVER');
                        finalizeFailedRun("💥 All Hearts Shattered! Try Again.");
                        return;
                    } else {
                        bBall.x = bPaddle.x + (bPaddle.w / 2);
                        bBall.y = bPaddle.y - bBall.r - 4;
                        bBall.dx = 0; bBall.dy = 0;
                        isLifeBeingProcessed = false;
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'LIFE_LOST');
                    }
                }
            }

            // --- 6. ANIMATED POWER-UPS (DROPS) ---
            for (let dIndex = activeDropsArray.length - 1; dIndex >= 0; dIndex--) {
                let drop = activeDropsArray[dIndex];
                drop.y += 2.5;
                drop.rot = (drop.rot || 0) + 0.05;

                brCtx.save();
                brCtx.translate(drop.x, drop.y);
                brCtx.rotate(drop.rot);

                let dropColor = drop.type === 'GROW' ? '#e74c3c' : '#2ecc71';
                brCtx.fillStyle = dropColor;
                brCtx.shadowColor = dropColor;
                brCtx.shadowBlur = 10;

                brCtx.beginPath();
                if (drop.type === 'GROW') {
                    brCtx.roundRect(-10, -4, 20, 8, 3); // Wide paddle pill shape
                } else {
                    brCtx.arc(0, 0, 7, 0, Math.PI * 2); // Ball / Heart core shape
                }
                brCtx.fill();

                brCtx.fillStyle = '#ffffff';
                brCtx.shadowBlur = 0;
                brCtx.beginPath();
                if (drop.type === 'GROW') {
                    brCtx.roundRect(-4, -1, 8, 2, 1);
                } else {
                    brCtx.arc(0, 0, 3, 0, Math.PI * 2);
                }
                brCtx.fill();
                brCtx.restore();

                // 💥 COLLISION DETECTION: Jab power-up Paddle se takraye
                if (drop.y + 8 >= bPaddle.y && drop.x >= bPaddle.x && drop.x <= bPaddle.x + bPaddle.w) {
                    createBrickExplosion(drop.x, bPaddle.y, dropColor, 15, false); // Collection burst
                    if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');

                    if (drop.type === 'GROW') {
                        bPaddle.w = 130;
                        setTimeout(() => { bPaddle.w = 90; }, 8000);
                    }
                    else if (drop.type === 'BALL') {
                        // 🛑 FIX: Increment Canvas hearts by +1 (Max 3)
                        if (gameHeartsRemaining < 3) {
                            gameHeartsRemaining++;
                        }
                        // Temporary ball expansion effect
                        bBall.r = 10;
                        setTimeout(() => { bBall.r = 6; }, 8000);
                    }

                    // Collect hone ke baad power-up screen se hata do
                    activeDropsArray.splice(dIndex, 1);

                } else if (drop.y > brickCanvasElement.height) {
                    // Agar power-up screen se neeche gir jaye toh use hata do
                    activeDropsArray.splice(dIndex, 1);
                }
            }


            // --- 7. BRICK RENDER & IMPACT MECHANICS ---
            let remainingActiveBricksCount = 0;

            activeBricksArray.forEach(br => {
                if (br.status > 0) {
                    if (br.special !== 'HIDDEN' && br.special !== 'BOSS') remainingActiveBricksCount++;
                    if (br.special === 'BOSS') remainingActiveBricksCount++;

                    if (br.special === 'HIDDEN') {

        // ===================================================================

                flappyParticles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,

                });

        }

        function frameUpdateFlappy() {
            if (!flappyCanvasElement || !flCtx) return;

            flappyTime += 0.05;

            // --- 1. DYNAMIC DIFFICULTY PROGRESSION ---
            let difficultyLevel = Math.floor(flappyScoreTracker / 5);
            let currentSpeed = 2.2 + Math.min(2.0, difficultyLevel * 0.3); // Caps at +2.0 speed

            // 🕳️ VERTICAL GAP: Upar aur neeche wale pipe ke beech ka rasta (Bird ke nikalne ki jagah)

            if (difficultyLevel >= 4) flappyLevelTheme = { sky: '#0f2027', pipe: '#e74c3c', ground: '#c0392b' }; // Lava / Expert
            else if (difficultyLevel >= 2) flappyLevelTheme = { sky: '#2b5876', pipe: '#f39c12', ground: '#d35400' }; // Sunset / Hard
            else flappyLevelTheme = { sky: '#70c5ce', pipe: '#2ecc71', ground: '#27ae60' }; // Day / Easy

            // --- 2. CAMERA SHAKE & PARALLAX BACKGROUND ---
            let camOffsetX = 0, camOffsetY = 0;

                camOffsetY = (Math.random() - 0.5) * flappyCameraShake;
                flappyCameraShake *= 0.85;
                if (flappyCameraShake < 0.5) flappyCameraShake = 0;
            }

            flCtx.save();
            flCtx.translate(camOffsetX, camOffsetY);

            // Deep Sky Background
            flCtx.fillStyle = flappyLevelTheme.sky;
            flCtx.fillRect(0, 0, flappyCanvasElement.width, flappyCanvasElement.height);

            // Parallax Clouds
            flCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            flappyClouds.forEach(cloud => {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.size < 0) { cloud.x = flappyCanvasElement.width + cloud.size; cloud.y = Math.random() * 150 + 20; }
                flCtx.beginPath();
                flCtx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                flCtx.arc(cloud.x + 15, cloud.y - 10, cloud.size * 0.8, 0, Math.PI * 2);
                flCtx.fill();
            });

            // --- 3. BIRD PHYSICS & ANIMATION ---
            let previousVelocity = fBird.velocity;
            fBird.velocity += 0.23;
            fBird.y += fBird.velocity;

            if (previousVelocity > 0 && fBird.velocity < -3) onFlappyJump();

            // Smooth Pitch Rotation
            let targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, fBird.velocity * 0.12));

            flCtx.save();
            flCtx.translate(50, fBird.y);
            flCtx.rotate(targetRotation);

            // Glowing Aura
            flCtx.shadowColor = '#f39c12';
            flCtx.shadowBlur = 12;

            // Plump 3D Bird Body (Spherical radial gradient)
            let birdBodyGrad = flCtx.createRadialGradient(-3, -3, 2, 0, 0, 15);
            birdBodyGrad.addColorStop(0, '#fff6a9');
            birdBodyGrad.addColorStop(0.35, '#ffd32a');
            birdBodyGrad.addColorStop(0.85, '#ff9f1a');
            birdBodyGrad.addColorStop(1, '#e58e26');
            flCtx.fillStyle = birdBodyGrad;
            flCtx.beginPath();
            flCtx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
            flCtx.fill();
            flCtx.shadowBlur = 0;

            // Rosy Cheek
            flCtx.fillStyle = "rgba(255, 107, 129, 0.55)";

            flCtx.arc(4, 2, 4, 0, Math.PI * 2);
            flCtx.fill();

            let flapSpeed = fBird.velocity < 0 ? 25 : 8;
            let wingY = Math.sin(flappyTime * flapSpeed) * 5;

            wingGrad.addColorStop(0, '#fff3a3');
            wingGrad.addColorStop(0.5, '#ffa801');
            wingGrad.addColorStop(1, '#d35400');

            let beakGrad = flCtx.createLinearGradient(10, -2, 22, 2);

            beakGrad.addColorStop(1, '#c0392b');

            flCtx.beginPath();

            fPipes.forEach((p, idx) => {

                // 3D Cylindrical Pipe Gradients
                let pipeGradTop = flCtx.createLinearGradient(p.x, 0, p.x + pipeW, 0);

    if (!spaceCanvasTouchBound) {
        const getCanvasTouchX = (e) => {
            const rect = spCanvasElement.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
            }
            const scaleX = spCanvasElement.width / (rect.width || 1);
            return (clientX - rect.left) * scaleX;
        };

            if (e.cancelable && e.type.startsWith('touch')) e.preventDefault();
            spaceTouchActive = true;
            spaceTouchTargetX = getCanvasTouchX(e) - (pShipObj.w / 2);

        spCanvasElement.addEventListener('touchend', onTouchEnd, { passive: false });
        spCanvasElement.addEventListener('touchcancel', onTouchEnd, { passive: false });

        window.addEventListener('touchend', onTouchEnd, { passive: false });
