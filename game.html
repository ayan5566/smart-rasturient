        function initSpaceShooterGame() {
            if (typeof loopTimerInstance !== 'undefined' && loopTimerInstance) {
                clearInterval(loopTimerInstance);
            }

            // Top-level global variables reset
            currentLevelState = 1;
            spaceMoveDir = 0;
            spaceTouchActive = false;

            // Bullet aur powerup arrays clean karein
            spaceBullets = [];

            powerUps = [];

            const sCanvas = document.getElementById('spaceCanvas');
            if (!sCanvas) return;

            spCanvasElement = sCanvas;
            spCtx = sCanvas.getContext('2d');

            // Initialize/calibrate deep cosmos background engine
            if (typeof initSpaceShooterBackground === 'function') {
                initSpaceShooterBackground(sCanvas.width, sCanvas.height);
            }

            // Reset touch target position to ship center
            spaceTouchTargetX = (sCanvas.width / 2) - 20;

            // Bind canvas direct touch/drag follow system
            if (!spaceCanvasTouchBound) {
                const getCanvasTouchX = (e) => {
                    const rect = spCanvasElement.getBoundingClientRect();
                    let clientX = e.clientX;
                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                    } else if (e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX;
                    }
                    const scaleX = spCanvasElement.width / (rect.width || 1);
                    return (clientX - rect.left) * scaleX;
                };

                const onTouchStart = (e) => {
                    if (e.cancelable && e.type.startsWith('touch')) e.preventDefault();
                    spaceTouchActive = true;
                    spaceTouchTargetX = getCanvasTouchX(e) - (pShipObj.w / 2);
                };

                const onTouchMove = (e) => {
                    if (!spaceTouchActive) return;
                    if (e.cancelable && e.type.startsWith('touch')) e.preventDefault();
                    spaceTouchTargetX = getCanvasTouchX(e) - (pShipObj.w / 2);
                };

                const onTouchEnd = (e) => {
                    spaceTouchActive = false;
                };

                // Touch events on canvas and window
                spCanvasElement.addEventListener('touchstart', onTouchStart, { passive: false });
                spCanvasElement.addEventListener('touchmove', onTouchMove, { passive: false });
                spCanvasElement.addEventListener('touchend', onTouchEnd, { passive: false });
                spCanvasElement.addEventListener('touchcancel', onTouchEnd, { passive: false });
                window.addEventListener('touchmove', onTouchMove, { passive: false });
                window.addEventListener('touchend', onTouchEnd, { passive: false });
                window.addEventListener('touchcancel', onTouchEnd, { passive: false });

                // Pointer/Mouse events for desktop & browser testing
                spCanvasElement.addEventListener('mousedown', onTouchStart);
                window.addEventListener('mousemove', onTouchMove);
                window.addEventListener('mouseup', onTouchEnd);

                spaceCanvasTouchBound = true;
            }

            // Player ship properties reset
            pShipObj = {
                x: (sCanvas.width / 2) - 20,
                y: sCanvas.height - 60,
                w: 40,
                h: 32,
                health: 5,
                maxHealth: 5
            };

            // Level setup function call
            if (typeof setupLevelParameters === 'function') {
                setupLevelParameters();
            }

            // 20ms fixed interval ticker loop
            loopTimerInstance = setInterval(frameUpdateSpace, 20);
        }

        // ===================================================================
        function frameUpdateSpace() {
            if (!spCanvasElement || !spCtx) return;

            // --- 1. CAMERA SHAKE & CONTEXT SETUP ---
            let camOffsetX = 0, camOffsetY = 0;
            if (spaceCameraShake > 0) {
                camOffsetX = (Math.random() - 0.5) * spaceCameraShake;
                camOffsetY = (Math.random() - 0.5) * spaceCameraShake;
                spaceCameraShake *= 0.85; // Smooth decay
                if (spaceCameraShake < 0.5) spaceCameraShake = 0;
            }

            spCtx.save();
            spCtx.translate(camOffsetX, camOffsetY);

            // --- 2. AAA DYNAMIC DEEP COSMOS BACKGROUND ---
            renderSpaceCosmicBackground(spCtx, spCanvasElement.width, spCanvasElement.height);

            // --- 3. STAGE TRANSITION (WITH BOSS ALARM & HUD BANNER) ---
            if (spaceTransitionCount > 0) {
                spaceTransitionCount--;
                let nextStage = currentLevelState;
                let isNextBoss = (nextStage === 5 || nextStage === 10);

                if (isNextBoss) {
                    let flash = Math.sin(spaceFrameTracker * 0.25) > 0;
                    spCtx.fillStyle = flash ? "rgba(231, 76, 60, 0.95)" : "rgba(241, 196, 15, 0.95)";
                    spCtx.font = "900 20px Segoe UI";
                    spCtx.textAlign = "center";
                    spCtx.shadowColor = "#e74c3c"; spCtx.shadowBlur = 18;
                    spCtx.fillText(nextStage === 10 ? "\u{1F480} APEX FINAL BOSS DETECTED \u{1F480}" : "\u26A0\uFE0F LEVEL 5 DREADNOUGHT ALERT \u26A0\uFE0F", spCanvasElement.width / 2, spCanvasElement.height / 2 - 12);
                    spCtx.shadowBlur = 0;
                    spCtx.font = "bold 13px Segoe UI";
                    spCtx.fillStyle = "#ffffff";
                    spCtx.fillText(nextStage === 10 ? "OMEGA WORLD-EATER TITAN IS DESCENDING!" : "GOLIATH DREADNOUGHT WARPING IN!", spCanvasElement.width / 2, (spCanvasElement.height / 2) + 14);
                    spCtx.font = "italic 11px Segoe UI";
                    spCtx.fillStyle = "rgba(255,255,255,0.75)";
                    spCtx.fillText("Deploy shields and evasive maneuvers!", spCanvasElement.width / 2, (spCanvasElement.height / 2) + 34);
                } else {
                    spCtx.fillStyle = `rgba(241, 196, 15, ${Math.min(1, spaceTransitionCount / 30)})`;
                    spCtx.font = "900 24px Segoe UI";
                    spCtx.textAlign = "center";
                    spCtx.shadowColor = "#f39c12"; spCtx.shadowBlur = 15;
                    spCtx.fillText(`STAGE ${currentLevelState - 1} CLEARED!`, spCanvasElement.width / 2, spCanvasElement.height / 2);
                    spCtx.shadowBlur = 0;
                    spCtx.font = "italic 12px Segoe UI";
                    spCtx.fillStyle = "rgba(255,255,255,0.7)";
                    spCtx.fillText(`Warping to Sector ${currentLevelState}...`, spCanvasElement.width / 2, (spCanvasElement.height / 2) + 30);
                }
                spCtx.textAlign = "start";
                if (spaceTransitionCount === 0) setupLevelParameters();
                spCtx.restore();
                return;
            }

            // --- 4. PLAYER MOVEMENT & RENDERING ---
            if (sShieldTimer > 0) sShieldTimer--;
            if (sMultiTimer > 0) sMultiTimer--;
            spaceFrameTracker++;

            // Smooth touch drag follow (lerp 0.18) with keyboard fallback
            if (spaceTouchActive) {
                pShipObj.x += (spaceTouchTargetX - pShipObj.x) * 0.18;
            } else if (spaceMoveDir !== 0) {
                pShipObj.x += spaceMoveDir;
            }
            if (pShipObj.x < 0) pShipObj.x = 0;
            if (pShipObj.x > spCanvasElement.width - pShipObj.w) pShipObj.x = spCanvasElement.width - pShipObj.w;

            // Advanced Spaceship Drawing
            spCtx.save();
            spCtx.translate(pShipObj.x + pShipObj.w / 2, pShipObj.y + pShipObj.h / 2);

            // Twin Ion Thruster Flames
            let currentVel = spaceTouchActive ? Math.abs(spaceTouchTargetX - pShipObj.x) * 0.1 : Math.abs(spaceMoveDir);
            let flameLen = 14 + Math.random() * 8 + (currentVel * 1.8);
            let thrusterColor = sMultiTimer > 0 ? "#ff4757" : "#00d2d3";

            spCtx.save();
            spCtx.shadowColor = thrusterColor;
            spCtx.shadowBlur = 16;
            // Left thruster flame
            spCtx.fillStyle = thrusterColor;
            spCtx.beginPath();
            spCtx.moveTo(-8, 14); spCtx.lineTo(-2, 14); spCtx.lineTo(-5, 14 + flameLen);
            spCtx.fill();
            // Right thruster flame
            spCtx.beginPath();
            spCtx.moveTo(2, 14); spCtx.lineTo(8, 14); spCtx.lineTo(5, 14 + flameLen);
            spCtx.fill();
            // Core white hot centers
            spCtx.fillStyle = "#ffffff";
            spCtx.beginPath();
            spCtx.moveTo(-6, 14); spCtx.lineTo(-4, 14); spCtx.lineTo(-5, 14 + flameLen * 0.5);
            spCtx.fill();
            spCtx.beginPath();
            spCtx.moveTo(4, 14); spCtx.lineTo(6, 14); spCtx.lineTo(5, 14 + flameLen * 0.5);
            spCtx.fill();
            spCtx.shadowBlur = 0;
            spCtx.restore();

            // Ship Hull (Titanium Aerodynamic Shading)
            let hullGrad = spCtx.createLinearGradient(0, -18, 0, 16);
            hullGrad.addColorStop(0, '#ffffff');
            hullGrad.addColorStop(0.35, '#dcdde1');
            hullGrad.addColorStop(1, '#718093');
            spCtx.fillStyle = hullGrad;
            spCtx.beginPath();
            spCtx.moveTo(0, -20); // Sharp nose
            spCtx.lineTo(20, 13);  // Right wingtip
            spCtx.lineTo(8, 14);   // Right engine
            spCtx.lineTo(0, 11);   // Tail notch
            spCtx.lineTo(-8, 14);  // Left engine
            spCtx.lineTo(-20, 13); // Left wingtip
            spCtx.closePath();
            spCtx.fill();

            // Wing Racing Accents (Cyan/Red Neon Trim)
            let trimGrad = spCtx.createLinearGradient(-15, 0, 15, 0);
            trimGrad.addColorStop(0, '#00d2d3');
            trimGrad.addColorStop(0.5, '#2e86de');
            trimGrad.addColorStop(1, '#00d2d3');
            spCtx.fillStyle = trimGrad;
            spCtx.beginPath(); spCtx.moveTo(0, -10); spCtx.lineTo(16, 11); spCtx.lineTo(7, 11); spCtx.fill();
            spCtx.beginPath(); spCtx.moveTo(0, -10); spCtx.lineTo(-16, 11); spCtx.lineTo(-7, 11); spCtx.fill();

            // Wingtip Laser Cannons
            spCtx.fillStyle = '#2f3542';
            spCtx.fillRect(-20, 4, 3, 10);
            spCtx.fillRect(17, 4, 3, 10);
            spCtx.fillStyle = '#00d2d3';
            spCtx.fillRect(-19, 2, 1.5, 3);
            spCtx.fillRect(18, 2, 1.5, 3);

            // High-Tech Cockpit Canopy
            let canopyGrad = spCtx.createRadialGradient(-1, -4, 1, 0, -2, 8);
            canopyGrad.addColorStop(0, '#70a1ff');
            canopyGrad.addColorStop(0.5, '#1e90ff');
            canopyGrad.addColorStop(1, '#0c2461');
            spCtx.fillStyle = canopyGrad;
            spCtx.beginPath();
            spCtx.ellipse(0, -3, 4.5, 9, 0, 0, Math.PI * 2);
            spCtx.fill();

            // Specular Glass Reflections
            spCtx.fillStyle = "rgba(255, 255, 255, 0.75)";
            spCtx.beginPath(); spCtx.ellipse(-1.2, -5, 1.5, 4, -0.1, 0, Math.PI * 2); spCtx.fill();

            // Energy Shield (Hexagonal ripple glow)
            if (sShieldTimer > 0) {
                spCtx.strokeStyle = `rgba(0, 240, 255, ${0.45 + Math.sin(spaceFrameTracker * 0.25) * 0.35})`;
                spCtx.lineWidth = 2.5;
                spCtx.beginPath();
                spCtx.arc(0, 0, 27 + Math.sin(spaceFrameTracker * 0.3) * 2, 0, Math.PI * 2);
                spCtx.stroke();
            }
            spCtx.restore();

            // --- 5. FIRING MECHANICS (WITH AUDIO & RECOIL) ---
            if (spaceFrameTracker % 12 === 0) {
                applySpaceCameraShake(1.5); // Micro-recoil
                if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'LASER_PLAYER');
                if (sMultiTimer > 0) {
                    spaceBullets.push(
                        { x: pShipObj.x + pShipObj.w / 2, y: pShipObj.y, dx: 0 },
                        { x: pShipObj.x + 6, y: pShipObj.y + 10, dx: -2 },
                        { x: pShipObj.x + pShipObj.w - 6, y: pShipObj.y + 10, dx: 2 }
                    );
                } else {
                    spaceBullets.push({ x: pShipObj.x + pShipObj.w / 2, y: pShipObj.y, dx: 0 });
                }
            }

            // --- 6. ADVANCED ENEMY AI & 10 DISTINCT PROCEDURAL SPACESHIPS ---
            let isRage = alienInvaderObj.isBoss && alienInvaderObj.health < alienInvaderObj.maxHealth * 0.42;

            // ===============================================================
            // 🏒 ICE HOCKEY STRIKER AI ENGINE (2D GLIDE, DODGE, LUNGE & REBOUND)
            // ===============================================================
            if (typeof alienInvaderObj.vx === 'undefined') {
                alienInvaderObj.vx = alienInvaderObj.dx || 1.8;
                alienInvaderObj.vy = 0;
                alienInvaderObj.aiState = 'PATROL';
                alienInvaderObj.aiTimer = 60;
                alienInvaderObj.lungeCooldown = 120;
                alienInvaderObj.bankAngle = 0;
                alienInvaderObj.chargeGlow = 0;
            }

            // Boss Entrance Animation
            if (alienInvaderObj.isBoss && alienInvaderObj.y < 35) {
                alienInvaderObj.y += 1.6;
            } else {
                let targetX = alienInvaderObj.x;
                let targetY = alienInvaderObj.y;
                let playerCenterX = pShipObj.x + pShipObj.w / 2;
                let alienCenterX = alienInvaderObj.x + alienInvaderObj.w / 2;

                if (alienInvaderObj.lungeCooldown > 0) alienInvaderObj.lungeCooldown--;
                if (alienInvaderObj.aiTimer > 0) alienInvaderObj.aiTimer--;

                // --- A. ICE HOCKEY BULLET EVASION (DEKE / DODGE) ---
                let incomingThreat = false;
                let threatBullet = null;
                for (let b of spaceBullets) {
                    if (b.y > alienInvaderObj.y - 10 && b.y < alienInvaderObj.y + 150) {
                        if (Math.abs(b.x - alienCenterX) < alienInvaderObj.w * 0.7) {
                            incomingThreat = true;
                            threatBullet = b;
                            break;
                        }
                    }
                }

                if (incomingThreat && alienInvaderObj.aiState === 'PATROL') {
                    let evadeDir = (threatBullet.x < alienCenterX) ? 1 : -1;
                    if (alienInvaderObj.x < 35) evadeDir = 1;
                    if (alienInvaderObj.x > spCanvasElement.width - alienInvaderObj.w - 35) evadeDir = -1;
                    alienInvaderObj.vx += evadeDir * (0.9 + (alienInvaderObj.level || 1) * 0.12);
                }

                // --- B. ICE HOCKEY TACTICAL STATE MACHINE ---
                switch (alienInvaderObj.aiState) {
                    case 'PATROL':
                        // Ice cruising: smooth figure-8 patrol while tracking player crease
                        let swayX = Math.sin(spaceFrameTracker * 0.04) * (spCanvasElement.width * 0.35);
                        targetX = (spCanvasElement.width / 2 - alienInvaderObj.w / 2) + swayX;
                        targetX += (playerCenterX - alienCenterX) * 0.28;
                        targetY = 40 + Math.sin(spaceFrameTracker * 0.06) * 14;

                        let accelX = (targetX - alienInvaderObj.x) * 0.04;
                        let accelY = (targetY - alienInvaderObj.y) * 0.04;
                        alienInvaderObj.vx += accelX;
                        alienInvaderObj.vy += accelY;

                        // Check for Slap-Shot / Breakaway Lunge trigger
                        if (alienInvaderObj.lungeCooldown <= 0 && alienInvaderObj.y >= 30) {
                            alienInvaderObj.aiState = 'LUNGE_PREP';
                            alienInvaderObj.aiTimer = 30; // 30 frames wind-up
                            alienInvaderObj.chargeGlow = 0;
                            if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'SHIELD_DEFLECT');
                        }
                        break;

                    case 'LUNGE_PREP':
                        // Slap-shot wind-up: draw back slightly into crease, charge ice aura
                        targetY = 25;
                        alienInvaderObj.vy += (targetY - alienInvaderObj.y) * 0.08;
                        alienInvaderObj.vx *= 0.86;
                        alienInvaderObj.chargeGlow = Math.min(1, (30 - alienInvaderObj.aiTimer) / 30);

                        // Sparking ice crystals
                        if (Math.random() < 0.6) {
                            spaceParticlesArray.push({
                                x: alienCenterX + (Math.random() - 0.5) * alienInvaderObj.w,
                                y: alienInvaderObj.y + alienInvaderObj.h,
                                vx: (Math.random() - 0.5) * 3,
                                vy: (Math.random() - 0.5) * 3,
                                size: 1.5 + Math.random() * 2,
                                color: '#00d2d3',
                                life: 1,
                                decay: 0.06
                            });
                        }

                        if (alienInvaderObj.aiTimer <= 0) {
                            alienInvaderObj.aiState = 'LUNGE_STRIKE';
                            alienInvaderObj.aiTimer = 38;
                            let lungeAim = (playerCenterX - alienCenterX) * 0.035;
                            alienInvaderObj.vx = lungeAim * 1.5;
                            alienInvaderObj.vy = 5.4 + ((alienInvaderObj.level || 1) * 0.22) * (isRage ? 1.3 : 1);
                            applySpaceCameraShake(3);
                            if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'BOSS_ALARM');
                        }
                        break;

                    case 'LUNGE_STRIKE':
                        // Breakaway rush towards player net
                        alienInvaderObj.chargeGlow = 1;
                        spaceParticlesArray.push({
                            x: alienCenterX + (Math.random() - 0.5) * (alienInvaderObj.w * 0.5),
                            y: alienInvaderObj.y,
                            vx: (Math.random() - 0.5) * 1.5,
                            vy: -2 - Math.random() * 2,
                            size: 2 + Math.random() * 2.5,
                            color: '#70a1ff',
                            life: 0.9,
                            decay: 0.05
                        });

                        // Deepest point reached -> Release Bouncing Hockey Puck Slap-Shot!
                        if (alienInvaderObj.y >= 210 || alienInvaderObj.aiTimer <= 0) {
                            let cx = alienCenterX;
                            let cy = alienInvaderObj.y + alienInvaderObj.h;
                            let aimAngle = Math.atan2(pShipObj.y - cy, playerCenterX - cx);
                            let puckSpeed = 5.0 + (alienInvaderObj.level || 1) * 0.18;

                            // Charged Bouncing Puck
                            enemyLasers.push({
                                x: cx, y: cy,
                                dx: Math.cos(aimAngle) * puckSpeed,
                                dy: Math.max(3.6, Math.sin(aimAngle) * puckSpeed),
                                color: '#00d2d3',
                                isPuck: true,
                                isHeavy: true
                            });

                            // Flanking slap-shot lasers
                            enemyLasers.push(
                                { x: cx - alienInvaderObj.w * 0.4, y: cy - 6, dx: -2.0, dy: 5.2, color: '#ff3838' },
                                { x: cx + alienInvaderObj.w * 0.4, y: cy - 6, dx: 2.0, dy: 5.2, color: '#ff3838' }
                            );

                            applySpaceCameraShake(4);
                            if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'ENEMY_LASER');

                            alienInvaderObj.aiState = 'RETREAT';
                            alienInvaderObj.aiTimer = 40;
                        }
                        break;

                    case 'RETREAT':
                        // Power skate back to defensive crease
                        alienInvaderObj.chargeGlow *= 0.9;
                        alienInvaderObj.vy = -4.4 - ((alienInvaderObj.level || 1) * 0.12);
                        alienInvaderObj.vx *= 0.94;

                        if (Math.random() < 0.5) {
                            spaceParticlesArray.push({
                                x: alienCenterX + (Math.random() - 0.5) * 16,
                                y: alienInvaderObj.y + alienInvaderObj.h,
                                vx: (Math.random() - 0.5) * 1.5,
                                vy: 3 + Math.random() * 2,
                                size: 2,
                                color: '#e74c3c',
                                life: 0.8,
                                decay: 0.08
                            });
                        }

                        if (alienInvaderObj.y <= 48 || alienInvaderObj.aiTimer <= 0) {
                            alienInvaderObj.aiState = 'PATROL';
                            alienInvaderObj.lungeCooldown = Math.max(80, 160 - ((alienInvaderObj.level || 1) * 8) + Math.random() * 40);
                            alienInvaderObj.chargeGlow = 0;
                        }
                        break;
                }

                // --- C. ICE FRICTION GLIDE PHYSICS ---
                let iceFriction = (alienInvaderObj.aiState === 'LUNGE_STRIKE') ? 0.98 : 0.94;
                alienInvaderObj.vx *= iceFriction;
                alienInvaderObj.vy *= (alienInvaderObj.aiState === 'LUNGE_STRIKE' || alienInvaderObj.aiState === 'RETREAT') ? 0.99 : 0.92;

                let maxVx = (alienInvaderObj.aiState === 'LUNGE_STRIKE') ? 5.8 : 3.8 + ((alienInvaderObj.level || 1) * 0.15);
                if (alienInvaderObj.vx > maxVx) alienInvaderObj.vx = maxVx;
                if (alienInvaderObj.vx < -maxVx) alienInvaderObj.vx = -maxVx;

                alienInvaderObj.x += alienInvaderObj.vx * (isRage ? 1.3 : 1);
                alienInvaderObj.y += alienInvaderObj.vy * (isRage ? 1.3 : 1);

                // --- D. AIR HOCKEY BOARD REBOUNDS (ELASTIC WALL BOUNCE) ---
                if (alienInvaderObj.x <= 4) {
                    alienInvaderObj.x = 4;
                    alienInvaderObj.vx = Math.abs(alienInvaderObj.vx) * 0.92 + 1.2;
                    createSpaceExplosion(4, alienInvaderObj.y + alienInvaderObj.h / 2, "#00d2d3", 6, false);
                } else if (alienInvaderObj.x >= spCanvasElement.width - alienInvaderObj.w - 4) {
                    alienInvaderObj.x = spCanvasElement.width - alienInvaderObj.w - 4;
                    alienInvaderObj.vx = -(Math.abs(alienInvaderObj.vx) * 0.92 + 1.2);
                    createSpaceExplosion(spCanvasElement.width - 4, alienInvaderObj.y + alienInvaderObj.h / 2, "#00d2d3", 6, false);
                }

                if (alienInvaderObj.y < 20) {
                    alienInvaderObj.y = 20;
                    alienInvaderObj.vy = Math.abs(alienInvaderObj.vy) * 0.8 + 0.6;
                } else if (alienInvaderObj.aiState === 'PATROL' && alienInvaderObj.y > 110) {
                    alienInvaderObj.vy = -Math.abs(alienInvaderObj.vy) * 0.8 - 0.6;
                }

                // Bank angle (skater leaning into turn)
                let targetBank = (alienInvaderObj.vx * 0.07);
                alienInvaderObj.bankAngle += (targetBank - alienInvaderObj.bankAngle) * 0.18;

                // --- E. HOCKEY BODY CHECK (COLLISION WITH PLAYER SHIP) ---
                if (alienInvaderObj.y + alienInvaderObj.h >= pShipObj.y &&
                    alienInvaderObj.y <= pShipObj.y + pShipObj.h &&
                    alienInvaderObj.x + alienInvaderObj.w >= pShipObj.x &&
                    alienInvaderObj.x <= pShipObj.x + pShipObj.w) {
                    
                    alienInvaderObj.vy = -6.5; // Elastic body check rebound
                    alienInvaderObj.aiState = 'RETREAT';
                    applySpaceCameraShake(12);
                    createSpaceExplosion((alienCenterX + playerCenterX) / 2, (alienInvaderObj.y + pShipObj.y) / 2, "#00d2d3", 18, false);
                    if (sShieldTimer > 0) {
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'SHIELD_DEFLECT');
                    } else {
                        pShipObj.health--;
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'ENEMY_HIT');
                    }
                    if (pShipObj.health <= 0) {
                        createSpaceExplosion(pShipObj.x + pShipObj.w / 2, pShipObj.y + pShipObj.h / 2, "#3498db", 30, true);
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'GAME_OVER');
                        finalizeFailedRun("💥 Spaceship Rammed & Destroyed! Try Again.");
                    }
                }
            }

            spCtx.save();
            spCtx.translate(alienInvaderObj.x + alienInvaderObj.w / 2, alienInvaderObj.y + alienInvaderObj.h / 2);
            spCtx.rotate(alienInvaderObj.bankAngle || 0);

            // Ice Hockey Slap-Shot / Lunge Charge Aura
            if (alienInvaderObj.chargeGlow > 0) {
                spCtx.save();
                spCtx.shadowColor = "#00d2d3";
                spCtx.shadowBlur = 18 * alienInvaderObj.chargeGlow;
                spCtx.strokeStyle = `rgba(0, 210, 211, ${alienInvaderObj.chargeGlow * 0.85})`;
                spCtx.lineWidth = 2.5;
                spCtx.beginPath();
                spCtx.arc(0, 0, (Math.max(alienInvaderObj.w, alienInvaderObj.h) / 2) + 6, 0, Math.PI * 2);
                spCtx.stroke();
                spCtx.restore();
            }

            // ===================================================================
            //10 DISTINCT ENEMY SPACESHIPS (ASCENDING DANGER + UNIQUE BOSSES)
            // ===================================================================
            let lvl = alienInvaderObj.level || currentLevelState;
            let w = alienInvaderObj.w;
            let h = alienInvaderObj.h;
            let hw = w / 2;
            let hh = h / 2;

            if (lvl === 1) {
                // --- 1. VIPER SCOUT DRONE (Light, agile, cyan & slate) ---
                spCtx.shadowColor = "#00d2d3"; spCtx.shadowBlur = 8;
                spCtx.fillStyle = "#1e272e";
                spCtx.beginPath();
                spCtx.moveTo(0, hh); spCtx.lineTo(hw, -hh + 6); spCtx.lineTo(hw - 6, -hh); spCtx.lineTo(0, -hh + 8); spCtx.lineTo(-hw + 6, -hh); spCtx.lineTo(-hw, -hh + 6);
                spCtx.closePath(); spCtx.fill();
                spCtx.strokeStyle = "#00d2d3"; spCtx.lineWidth = 1.5; spCtx.stroke();
                // Cyan sensor visor
                spCtx.fillStyle = "#00d2d3";
                spCtx.beginPath(); spCtx.ellipse(0, 0, 4, 8, 0, 0, Math.PI * 2); spCtx.fill();
                // Micro thrusters
                spCtx.fillStyle = "#54a0ff";
                spCtx.fillRect(-7, -hh, 3, 5 + Math.sin(spaceFrameTracker * 0.3) * 3);
                spCtx.fillRect(4, -hh, 3, 5 + Math.sin(spaceFrameTracker * 0.3) * 3);
                spCtx.shadowBlur = 0;

            } else if (lvl === 2) {
                // --- 2. SHADOW INTERCEPTOR (Stealth delta-fighter, crimson & carbon) ---
                spCtx.shadowColor = "#ff3838"; spCtx.shadowBlur = 10;
                spCtx.fillStyle = "#171b26";
                spCtx.beginPath();
                spCtx.moveTo(0, hh); spCtx.lineTo(hw, -hh + 4); spCtx.lineTo(hw * 0.6, -hh); spCtx.lineTo(0, -hh + 6); spCtx.lineTo(-hw * 0.6, -hh); spCtx.lineTo(-hw, -hh + 4);
                spCtx.closePath(); spCtx.fill();
                // Crimson razor wingtips
                spCtx.fillStyle = "#c0392b";
                spCtx.beginPath();
                spCtx.moveTo(hw * 0.5, 0); spCtx.lineTo(hw, -hh + 4); spCtx.lineTo(hw * 0.7, -hh + 12);
                spCtx.fill();
                spCtx.beginPath();
                spCtx.moveTo(-hw * 0.5, 0); spCtx.lineTo(-hw, -hh + 4); spCtx.lineTo(-hw * 0.7, -hh + 12);
                spCtx.fill();
                // Dual gun barrels
                spCtx.fillStyle = "#718093";
                spCtx.fillRect(-hw * 0.85, 0, 3, 10);
                spCtx.fillRect(hw * 0.85 - 3, 0, 3, 10);
                // Glowing amber cockpit
                spCtx.fillStyle = "#ff9f43";
                spCtx.beginPath(); spCtx.ellipse(0, -2, 3.5, 7, 0, 0, Math.PI * 2); spCtx.fill();
                spCtx.shadowBlur = 0;

            } else if (lvl === 3) {
                // --- 3. IRONCLAD RAIDER (Armored heavy gunship, gunmetal & hazard green) ---
                spCtx.shadowColor = "#2ed573"; spCtx.shadowBlur = 10;
                // Heavy armor chassis
                spCtx.fillStyle = "#2f3542";

                            { x: cx + 22, y: cy, dx: 1.8, dy: 4.8, color: '#00d2d3' }
                        );
                        break;
                    case 8: // Dark Harvester: Quad spread barrage
                        enemyLasers.push(
                            { x: cx - 30, y: cy, dx: -2.2, dy: 4.6, color: '#00ff88' },
                            { x: cx - 10, y: cy, dx: -0.7, dy: 5.2, color: '#00ff88' },
                            { x: cx + 10, y: cy, dx: 0.7, dy: 5.2, color: '#00ff88' },
                            { x: cx + 30, y: cy, dx: 2.2, dy: 4.6, color: '#00ff88' }
                        );
                        break;
                    case 9: // Apex Nemesis: 5-way quint-fan barrage + heavy center lance
                        let aim9 = ((pShipObj.x + pShipObj.w / 2) - cx) * 0.016;
                        enemyLasers.push(
                            { x: cx - 32, y: cy, dx: -2.6 + aim9, dy: 4.6, color: '#e056fd' },
                            { x: cx - 16, y: cy, dx: -1.2 + aim9, dy: 5.2, color: '#be2edd' },
                            { x: cx, y: cy, dx: aim9, dy: 6.0, color: '#ff3838', isHeavy: true },
                            { x: cx + 16, y: cy, dx: 1.2 + aim9, dy: 5.2, color: '#be2edd' },
                            { x: cx + 32, y: cy, dx: 2.6 + aim9, dy: 4.6, color: '#e056fd' }
                        );
                        break;
                    case 10: // Level 10 FINAL BOSS: Omega World-Eater
                        if (isRage) {
                            applySpaceCameraShake(4.5);
                            for (let i = 0; i < 8; i++) {

                                    x: cx, y: alienInvaderObj.y + 40,

                                { x: cx - 55, y: cy - 20, dx: -2.2, dy: 4.8, color: '#f1c40f' },

            // --- 8. POWERUPS ---

                if (pow.x > pShipObj.x && pow.x < pShipObj.x + pShipObj.w && pow.y > pShipObj.y && pow.y < pShipObj.y + pShipObj.h) {
                    createSpaceExplosion(pow.x, pow.y, spCtx.fillStyle, 10, false); // Collection spark
                    if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'POWERUP');

                    //FIX: Restores +2 HP per pickup, capped strictly at maxHealth
                    if (pow.type === 'H') {

                    if (pow.type === 'S') sShieldTimer = 350;
                    if (pow.type === 'M') sMultiTimer = 350;

                    powerUps.splice(pi, 1);

            });

            // --- 9. PLAYER BULLETS & IMPACTS ---
            spaceBullets.forEach((b, bi) => {
                b.y -= 8.5; b.x += b.dx;

                if (b.y < 0) { spaceBullets.splice(bi, 1); return; } // Range clean-up

                // Alien Collision
                if (b.x > alienInvaderObj.x && b.x < alienInvaderObj.x + alienInvaderObj.w && b.y < alienInvaderObj.y + alienInvaderObj.h && b.y > alienInvaderObj.y) {

                    createSpaceExplosion(b.x, b.y, "#f39c12", 5, false); // Impact sparks
                    if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'ENEMY_HIT');

                    if (alienInvaderObj.health <= 0) {
                        applySpaceCameraShake(alienInvaderObj.isBoss ? 32 : 9);
                        createSpaceExplosion(alienInvaderObj.x + alienInvaderObj.w / 2, alienInvaderObj.y + alienInvaderObj.h / 2, "#e74c3c", alienInvaderObj.isBoss ? 55 : 25, alienInvaderObj.isBoss);
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, alienInvaderObj.isBoss ? 'BOSS_BOOM' : 'EXPLOSION');

                        if (currentLevelState === (parseInt(rules.spaceTar) || 3)) {

            // --- 10. ENEMY LASERS & IMPACTS ---
            enemyLasers.forEach((el, eli) => {

                }

                let laserColor = el.color || "#ff4d4d";

                if (el.isPuck) {

                    spCtx.save();

                    spCtx.stroke();
                    spCtx.fillStyle = "#ffffff";

                    spCtx.fillStyle = laserColor;
                    spCtx.beginPath(); spCtx.arc(el.x, el.y, isHeavy ? 5.5 : 3.8, 0, Math.PI * 2); spCtx.fill();
                    spCtx.fillStyle = "#ffffff";
                    spCtx.beginPath(); spCtx.arc(el.x, el.y, isHeavy ? 2.8 : 1.8, 0, Math.PI * 2); spCtx.fill();
                }
                spCtx.shadowBlur = 0;

                if (el.y > spCanvasElement.height + 10 || el.x < -15 || el.x > spCanvasElement.width + 15) { enemyLasers.splice(eli, 1); return; }

                if (el.x > pShipObj.x && el.x < pShipObj.x + pShipObj.w && el.y > pShipObj.y && el.y < pShipObj.y + pShipObj.h) {
                    enemyLasers.splice(eli, 1);
                    applySpaceCameraShake(6);
                    createSpaceExplosion(el.x, el.y, "#3498db", 8, false); // Shield/Hull spark

                    if (sShieldTimer > 0) {
                        // Shield absorbed hit!
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'SHIELD_DEFLECT');
                    } else {
                        // Hull damaged
                        pShipObj.health--;
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'ENEMY_HIT');
                    }

                    if (pShipObj.health <= 0) {
                        createSpaceExplosion(pShipObj.x + pShipObj.w / 2, pShipObj.y + pShipObj.h / 2, "#3498db", 30, true);
                        if (typeof triggerAudioBeepAlert === 'function') triggerAudioBeepAlert(null, 'GAME_OVER');
                        finalizeFailedRun("\u{1F4A5} Spaceship Destroyed! Try Again.");

            });

            // --- 11. RENDER PARTICLE ENGINE ---
            for (let i = spaceParticlesArray.length - 1; i >= 0; i--) {
                let p = spaceParticlesArray[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) { spaceParticlesArray.splice(i, 1); continue; }
                spCtx.globalAlpha = p.life;
                spCtx.fillStyle = p.color;
                spCtx.beginPath(); spCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); spCtx.fill();
                spCtx.globalAlpha = 1.0;
            }

            spCtx.restore(); // Restore from camera shake BEFORE drawing HUD

            // --- 12. SLEEK MODERN HUD ---
            spCtx.textAlign = "start";

            spCtx.fillStyle = "rgba(15, 23, 42, 0.75)";

            if (alienInvaderObj.isBoss && alienInvaderObj.y >= 35 && alienInvaderObj.health > 0) {

                let barW = 180;
                let barX = (spCanvasElement.width / 2) - (barW / 2);
                let barY = 40;

                // Frame
                spCtx.fillStyle = "rgba(10, 15, 30, 0.85)";
                spCtx.beginPath();
                spCtx.roundRect(barX - 4, barY - 14, barW + 8, 26, 6);
                spCtx.fill();
                spCtx.strokeStyle = isRage ? "#ff3838" : (alienInvaderObj.isFinalBoss ? "#f1c40f" : "#9b59b6");
                spCtx.lineWidth = 1.5;
                spCtx.stroke();

                // Bar fill
                let hpGrad = spCtx.createLinearGradient(barX, barY, barX + barW, barY);
                if (isRage) {
                    hpGrad.addColorStop(0, "#ff0033");
                    hpGrad.addColorStop(1, "#ff6b81");
                } else if (alienInvaderObj.isFinalBoss) {
                    hpGrad.addColorStop(0, "#e67e22");
                    hpGrad.addColorStop(0.5, "#f1c40f");
                    hpGrad.addColorStop(1, "#e74c3c");
                } else {
                    hpGrad.addColorStop(0, "#8e44ad");
                    hpGrad.addColorStop(1, "#e056fd");
                }

                spCtx.fillStyle = "rgba(255,255,255,0.1)";
                spCtx.fillRect(barX, barY - 2, barW, 10);
                spCtx.fillStyle = hpGrad;
                spCtx.fillRect(barX, barY - 2, barW * bossHpPct, 10);

                // Label
                spCtx.fillStyle = "#ffffff";
                spCtx.font = "bold 9px Segoe UI";
                spCtx.textAlign = "center";
                let bossTitle = alienInvaderObj.isFinalBoss ? "\u{1F480} OMEGA WORLD-EATER" : "\u{1F525} GOLIATH DREADNOUGHT";
                if (isRage) bossTitle += " [ENRAGED!]";
                spCtx.fillText(bossTitle, spCanvasElement.width / 2, barY - 5);
            }
        }
        // ===================================================================

        var spaceCameraShake = 0;

        function initSpaceShooterBackground(cWidth, cHeight) {
            var w = cWidth || (spCanvasElement ? spCanvasElement.width : 320);

            // 5. Floating Cosmic Ion Stardust Motes
            spaceCosmicDust = [];
            for (var i = 0; i < 22; i++) {

        // Initialize immediately with default bounds
        initSpaceShooterBackground(320, 400);

        function renderSpaceCosmicBackground(ctx, w, h) {
            if (!spaceBgInitialized || cosmicBackgroundStars.length === 0) {
                initSpaceShooterBackground(w, h);
            }

            var isWarp = (typeof spaceTransitionCount !== 'undefined' && spaceTransitionCount > 0);
            var lvl = typeof currentLevelState !== 'undefined' ? currentLevelState : 1;
            var isBoss = (lvl === 5 || lvl === 10);
            var isRage = (typeof alienInvaderObj !== 'undefined' && alienInvaderObj && alienInvaderObj.isBoss && alienInvaderObj.health < alienInvaderObj.maxHealth * 0.42);

            // -------------------------------------------------------------
            // 1. DYNAMIC DEEP SPACE CANVASES GRADIENT (SECTOR-ADAPTIVE VOID)
            // -------------------------------------------------------------
            var bgGrad = ctx.createLinearGradient(0, 0, 0, h);
            if (isBoss) {
                // Menacing Abyssal Ruby/Crimson Void
                bgGrad.addColorStop(0, '#0a0307');
                bgGrad.addColorStop(0.5, '#13040c');
                bgGrad.addColorStop(1, '#050104');
            } else if (lvl === 3 || lvl === 4 || lvl === 7) {
                // Ion Storm / Toxic Nebula Realm (Emerald & Cyan Undertone)
                bgGrad.addColorStop(0, '#02090c');
                bgGrad.addColorStop(0.5, '#041318');
                bgGrad.addColorStop(1, '#010609');
            } else {
                // Deep Stellar Void (Obsidian & Electric Sapphire Abyss)
                bgGrad.addColorStop(0, '#03050c');
                bgGrad.addColorStop(0.5, '#080c1b');
                bgGrad.addColorStop(1, '#020308');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            // Subtle Deep Space Star Dust Horizon Glow
            var horizonGlow = ctx.createRadialGradient(w * 0.5, h * 0.45, 10, w * 0.5, h * 0.45, w * 0.85);
            if (isBoss) {
                horizonGlow.addColorStop(0, 'rgba(235, 47, 86, 0.08)');
                horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else {
                horizonGlow.addColorStop(0, 'rgba(108, 92, 231, 0.06)');
                horizonGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            }
            ctx.fillStyle = horizonGlow;
            ctx.fillRect(0, 0, w, h);

            // -------------------------------------------------------------
            // 2. VOLUMETRIC GLOWING NEBULA CLOUDS (ORGANIC RADIAL GRADIENTS)
            // -------------------------------------------------------------
            for (var i = 0; i < spaceNebulaClouds.length; i++) {
                var neb = spaceNebulaClouds[i];
                neb.y += neb.speed * (isWarp ? 4.5 : 1);
                if (neb.y - neb.baseR > h) {
                    neb.y = -neb.baseR;
                    neb.x = Math.random() * w;
                }
                var curR = neb.baseR + Math.sin(spaceFrameTracker * neb.pulseSpeed + neb.phase) * 12;

                var nebGrad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, Math.max(10, curR));
                if (isBoss) {
                    nebGrad.addColorStop(0, 'rgba(235, 47, 86, 0.16)');
                    nebGrad.addColorStop(0.45, 'rgba(214, 48, 49, 0.07)');
                    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else if (neb.type === 0) {
                    // Electric Violet
                    nebGrad.addColorStop(0, 'rgba(138, 43, 226, 0.15)');
                    nebGrad.addColorStop(0.5, 'rgba(108, 92, 231, 0.06)');
                    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else if (neb.type === 1) {
                    // Deep Space Cyan
                    nebGrad.addColorStop(0, 'rgba(0, 210, 255, 0.14)');
                    nebGrad.addColorStop(0.5, 'rgba(9, 132, 227, 0.05)');
                    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else if (neb.type === 2) {
                    // Magenta Flare
                    nebGrad.addColorStop(0, 'rgba(253, 121, 168, 0.12)');
                    nebGrad.addColorStop(0.5, 'rgba(232, 67, 147, 0.05)');
                    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else {
                    // Solar Amber / Gold
                    nebGrad.addColorStop(0, 'rgba(254, 202, 87, 0.10)');
                    nebGrad.addColorStop(0.5, 'rgba(225, 112, 85, 0.04)');
                    nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }
                ctx.fillStyle = nebGrad;
                ctx.beginPath();
                ctx.arc(neb.x, neb.y, Math.max(10, curR), 0, Math.PI * 2);
                ctx.fill();
            }

            // -------------------------------------------------------------
            // 3. MAJESTIC CELESTIAL BODIES (PLANETS & GAS GIANTS WITH RINGS)
            // -------------------------------------------------------------
            for (var p = 0; p < spaceCelestialBodies.length; p++) {
                var planet = spaceCelestialBodies[p];
                planet.y += planet.speed * (isWarp ? 3.5 : 1);
                if (planet.y - planet.radius * 2 > h) {
                    planet.y = -planet.radius * 2;
                    planet.x = 40 + Math.random() * (w - 80);
                    planet.radius = 32 + Math.random() * 16;
                    planet.bodyType = isBoss ? 'crimson_death_orb' : (lvl >= 6 ? 'golden_gas_giant' : 'ringed_gas_giant');
                }

                ctx.save();
                ctx.translate(planet.x, planet.y);

                var isRinged = (planet.bodyType === 'ringed_gas_giant' || planet.bodyType === 'golden_gas_giant');
                var pr = planet.radius;

                // A. Back half of planetary ring (behind planet)
                if (isRinged) {
                    ctx.save();
                    ctx.rotate(planet.ringAngle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, pr * 2.2, pr * 0.55, 0, Math.PI, Math.PI * 2);
                    ctx.strokeStyle = planet.bodyType === 'golden_gas_giant' ? 'rgba(254, 202, 87, 0.35)' : 'rgba(116, 185, 255, 0.35)';
                    ctx.lineWidth = pr * 0.28;
                    ctx.stroke();
                    ctx.restore();
                }

                // B. Atmospheric Rim Glow
                ctx.save();
                ctx.shadowColor = isBoss ? '#ff3838' : (planet.bodyType === 'golden_gas_giant' ? '#f39c12' : '#00d2d3');
                ctx.shadowBlur = 18;
                ctx.fillStyle = isBoss ? 'rgba(255, 56, 56, 0.2)' : 'rgba(0, 210, 255, 0.18)';
                ctx.beginPath();
                ctx.arc(0, 0, pr + 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // C. 3D Spherical Shading with Light Source from Upper-Left
                var pGrad = ctx.createRadialGradient(-pr * 0.35, -pr * 0.35, pr * 0.08, 0, 0, pr);
                if (isBoss) {
                    pGrad.addColorStop(0, '#ff7675');
                    pGrad.addColorStop(0.4, '#d63031');
                    pGrad.addColorStop(0.85, '#2d3436');
                    pGrad.addColorStop(1, '#050204');
                } else if (planet.bodyType === 'golden_gas_giant') {
                    pGrad.addColorStop(0, '#ffeaa7');
                    pGrad.addColorStop(0.35, '#fdcb6e');
                    pGrad.addColorStop(0.7, '#e17055');
                    pGrad.addColorStop(1, '#0b0c10');
                } else {
                    pGrad.addColorStop(0, '#a0e6ff');
                    pGrad.addColorStop(0.35, '#0984e3');
                    pGrad.addColorStop(0.75, '#1b2a4a');
                    pGrad.addColorStop(1, '#05070e');
                }
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.arc(0, 0, pr, 0, Math.PI * 2);
                ctx.fill();

                // D. Atmospheric Cloud Bands on Gas Giant
                ctx.save();
                ctx.clip(); // Restrict bands inside the sphere
                ctx.rotate(planet.ringAngle);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(-pr, -pr * 0.3, pr * 2, pr * 0.14);
                ctx.fillRect(-pr, pr * 0.08, pr * 2, pr * 0.18);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
                ctx.fillRect(-pr, -pr * 0.12, pr * 2, pr * 0.16);
                ctx.fillRect(-pr, pr * 0.32, pr * 2, pr * 0.12);
                ctx.restore();

                // E. Front half of planetary ring (in front of planet)
                if (isRinged) {
                    ctx.save();
                    ctx.rotate(planet.ringAngle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, pr * 2.2, pr * 0.55, 0, 0, Math.PI);
                    ctx.strokeStyle = planet.bodyType === 'golden_gas_giant' ? 'rgba(254, 202, 87, 0.45)' : 'rgba(160, 230, 255, 0.45)';
                    ctx.lineWidth = pr * 0.28;
                    ctx.stroke();

                    // Cassini Division Gap in the Ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, pr * 2.2, pr * 0.55, 0, 0, Math.PI);
                    ctx.strokeStyle = 'rgba(3, 5, 12, 0.7)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore();
            }

            // -------------------------------------------------------------
            // 4. TRIPLE-LAYER PARALLAX STARFIELD & HYPERSPACE WARP
            // -------------------------------------------------------------
            for (var s = 0; s < cosmicBackgroundStars.length; s++) {
                var star = cosmicBackgroundStars[s];

                // Warp speed acceleration vs normal cruising velocity
                var starSpeed = star.speed * (isWarp ? (star.layer === 3 ? 12 : (star.layer === 2 ? 8 : 5)) : 1);
                star.y += starSpeed;

                if (star.y > h + 10) {
                    star.y = -6;
                    star.x = Math.random() * w;
                }

                if (isWarp) {
                    // Hyperspace Warp Jump Light Streaks!
                    var streakLen = starSpeed * 5.5 + (star.layer * 6);
                    ctx.save();
                    ctx.strokeStyle = star.layer === 3 ? '#00ffff' : (star.layer === 2 ? '#74b9ff' : 'rgba(255, 255, 255, 0.7)');
                    ctx.lineWidth = star.size * (star.layer === 3 ? 1.4 : 1.0);
                    ctx.beginPath();
                    ctx.moveTo(star.x, star.y);
                    ctx.lineTo(star.x, Math.max(0, star.y - streakLen));
                    ctx.stroke();
                    ctx.restore();
                } else if (star.layer === 3) {
                    // Layer 3: Foreground Fast Stars with subtle motion blur
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = star.size;
                    ctx.beginPath();
                    ctx.moveTo(star.x, star.y);
                    ctx.lineTo(star.x, star.y - (star.speed * 2.2));
                    ctx.stroke();
                    // Crisp star core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (star.layer === 2) {
                    // Layer 2: Mid-Field Stars with Dynamic Twinkle & Shimmer
                    var alpha = Math.max(0.2, Math.min(1.0, star.baseAlpha + Math.sin(spaceFrameTracker * star.twinkleSpeed + star.twinkleOffset) * 0.35));
                    ctx.fillStyle = star.color;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // 4-Point Cross Diffraction Flare on brightest stars
                    if (star.hasFlare && alpha > 0.75) {
                        ctx.strokeStyle = star.color;
                        ctx.lineWidth = 0.8;
                        var fl = star.size * 2.2;
                        ctx.beginPath();
                        ctx.moveTo(star.x - fl, star.y); ctx.lineTo(star.x + fl, star.y);
                        ctx.moveTo(star.x, star.y - fl); ctx.lineTo(star.x, star.y + fl);
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1.0;
                } else {
                    // Layer 1: Distant Deep Stars (Smooth organic twinkling)
                    var alpha1 = Math.max(0.15, Math.min(0.85, star.baseAlpha + Math.sin(spaceFrameTracker * star.twinkleSpeed + star.twinkleOffset) * 0.25));
                    ctx.fillStyle = star.color;
                    ctx.globalAlpha = alpha1;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            // -------------------------------------------------------------
            // 5. DYNAMIC SHOOTING STARS / METEORS
            // -------------------------------------------------------------
            if (!isWarp && Math.random() < 0.009 && spaceShootingStars.length < 2) {
                spaceShootingStars.push({
                    x: Math.random() * w * 0.9,
                    y: Math.random() * (h * 0.4),
                    vx: 4.5 + Math.random() * 3.5,
                    vy: 5.5 + Math.random() * 4.0,
                    len: 40 + Math.random() * 35,
                    life: 1.0,
                    decay: 0.035 + Math.random() * 0.02,
                    color: Math.random() > 0.4 ? '#00ffff' : '#ffffff'
                });
            }

            for (var m = spaceShootingStars.length - 1; m >= 0; m--) {
                var meteor = spaceShootingStars[m];
                meteor.x += meteor.vx;
                meteor.y += meteor.vy;
                meteor.life -= meteor.decay;

                if (meteor.life <= 0 || meteor.x > w + 50 || meteor.y > h + 50) {
                    spaceShootingStars.splice(m, 1);
                    continue;
                }

                ctx.save();
                var tailGrad = ctx.createLinearGradient(
                    meteor.x, meteor.y,
                    meteor.x - (meteor.vx * meteor.len * 0.2),
                    meteor.y - (meteor.vy * meteor.len * 0.2)
                );
                tailGrad.addColorStop(0, meteor.color === '#00ffff' ? 'rgba(0, 242, 254, ' + meteor.life + ')' : 'rgba(255, 255, 255, ' + meteor.life + ')');
                tailGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.strokeStyle = tailGrad;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(meteor.x, meteor.y);
                ctx.lineTo(meteor.x - (meteor.vx * meteor.len * 0.2), meteor.y - (meteor.vy * meteor.len * 0.2));
                ctx.stroke();

                // Bright Burning Meteor Head
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = meteor.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(meteor.x, meteor.y, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // -------------------------------------------------------------
            // 6. PROCEDURAL SHADED 3D ASTEROIDS / DEBRIS
            // -------------------------------------------------------------
            for (var d = 0; d < spaceDebrisArray.length; d++) {
                var deb = spaceDebrisArray[d];
                deb.y += deb.speed * (isWarp ? 4 : 1);
                deb.rot += deb.rotSpeed;

                if (deb.y > h + 20) {
                    deb.y = -15;
                    deb.x = Math.random() * w;
                }

                ctx.save();
                ctx.translate(deb.x, deb.y);
                ctx.rotate(deb.rot);

                // Shaded Poly Asteroid Rock
                ctx.beginPath();
                var verts = deb.vertices || [{ x: -deb.size, y: -deb.size }, { x: deb.size, y: -deb.size }, { x: deb.size, y: deb.size }, { x: -deb.size, y: deb.size }];
                ctx.moveTo(verts[0].x, verts[0].y);
                for (var vi = 1; vi < verts.length; vi++) {
                    ctx.lineTo(verts[vi].x, verts[vi].y);
                }
                ctx.closePath();

                // Two-tone rock facet shading
                ctx.fillStyle = deb.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // Surface Craters / Specular Edge Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.beginPath();
                ctx.arc(-deb.size * 0.25, -deb.size * 0.25, deb.size * 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // -------------------------------------------------------------
            // 7. AMBIENT ION COSMIC DUST MOTES
            // -------------------------------------------------------------
            for (var cd = 0; cd < spaceCosmicDust.length; cd++) {
                var dust = spaceCosmicDust[cd];
                dust.y += dust.speed * (isWarp ? 3.5 : 1);
                dust.x += dust.driftX;

                if (dust.y > h + 5) {
                    dust.y = -5;
                    dust.x = Math.random() * w;
                }

                ctx.fillStyle = dust.color;
                ctx.globalAlpha = dust.alpha * (0.8 + Math.sin(spaceFrameTracker * 0.05 + cd) * 0.2);
                ctx.beginPath();
                ctx.arc(dust.x, dust.y, dust.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // -------------------------------------------------------------
            // 8. BOSS SECTOR EMERGENCY HAZARD AURA & PERIMETER VIGNETTE
            // -------------------------------------------------------------
            if (isBoss) {
                var alarmPulse = (Math.sin(spaceFrameTracker * (isRage ? 0.28 : 0.12)) + 1) * 0.5;
                var alertVignette = ctx.createRadialGradient(w * 0.5, h * 0.5, w * 0.35, w * 0.5, h * 0.5, w * 0.78);
                var alertAlpha = isRage ? (0.15 + alarmPulse * 0.22) : (0.08 + alarmPulse * 0.14);

                alertVignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                alertVignette.addColorStop(0.7, 'rgba(235, 47, 86, ' + (alertAlpha * 0.5) + ')');
                alertVignette.addColorStop(1, 'rgba(255, 0, 60, ' + alertAlpha + ')');

                ctx.fillStyle = alertVignette;
                ctx.fillRect(0, 0, w, h);
            }
        }

        function playHkSound(type, param) {
            try {
                const ctx = getHkAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;

                if (type === 'PUCK_HIT') {
                    const speed = Math.min(param || 8, 20);
                    // High-attack acoustic mallet click
                    const clickOsc = ctx.createOscillator();
                    const clickGain = ctx.createGain();
                    clickOsc.type = 'triangle';
                    clickOsc.frequency.setValueAtTime(650 + speed * 25, now);
                    clickOsc.frequency.exponentialRampToValueAtTime(140, now + 0.025);
                    clickGain.gain.setValueAtTime(0.35, now);
                    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
                    clickOsc.connect(clickGain);
                    clickGain.connect(ctx.destination);
                    clickOsc.start(now);
                    clickOsc.stop(now + 0.025);

                    // Deep mechanical body thud
                    const thudOsc = ctx.createOscillator();
                    const thudGain = ctx.createGain();
                    thudOsc.type = 'sine';
                    thudOsc.frequency.setValueAtTime(240 + speed * 8, now);
                    thudOsc.frequency.exponentialRampToValueAtTime(65, now + 0.075);
                    thudGain.gain.setValueAtTime(0.28, now);
                    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
                    thudOsc.connect(thudGain);
                    thudGain.connect(ctx.destination);
                    thudOsc.start(now);
                    thudOsc.stop(now + 0.075);
                } else if (type === 'WALL_BOUNCE') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(190, now + 0.05);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'GOAL_PLAYER') {
                    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'sawtooth';
                        o.frequency.setValueAtTime(f, now + idx * 0.06);
                        g.gain.setValueAtTime(0.2, now + idx * 0.06);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.start(now + idx * 0.06);
                        o.stop(now + idx * 0.06 + 0.25);
                    });
                } else if (type === 'GOAL_CHEF') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(90, now + 0.32);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.32);
                } else if (type === 'MILESTONE') {
                    const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.5];
                    notes.forEach((f, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'square';
                        o.frequency.setValueAtTime(f, now + idx * 0.07);
                        g.gain.setValueAtTime(0.18, now + idx * 0.07);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.start(now + idx * 0.07);
                        o.stop(now + idx * 0.07 + 0.3);
                    });
                }
            } catch (e) { }
        }
