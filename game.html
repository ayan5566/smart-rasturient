                canvas.addEventListener('pointerdown', handleStart, { passive: false });
                window.addEventListener('pointermove', handleMove, { passive: false });
                window.addEventListener('pointerup', handleEnd, { passive: false });
                window.addEventListener('pointercancel', handleEnd, { passive: false });

                canvas.addEventListener('touchstart', handleStart, { passive: false });
                canvas.addEventListener('touchmove', handleMove, { passive: false });
                canvas.addEventListener('touchend', handleEnd, { passive: false });

                isHockeyInputBound = true;
            }

            loopTimerInstance = setInterval(frameUpdateAirHockey, 16);
        }

        // ===================================================================
        // 🏒 AIR HOCKEY MAIN LOOP: PHYSICS, CHEF AI & RENDERING
        // ===================================================================
        function frameUpdateAirHockey() {
            if (!hockeyCanvasElement || !hkCtx || activeGameMode !== 'HOCKEY') return;

            hkChefAuraAngle += 0.05;
            if (hkChefAI.dialogueTimer > 0) hkChefAI.dialogueTimer--;

            // 1. Handle Pause / Celebration
            if (hkGameState === 'GOAL_PAUSE') {
                hkPauseTimer--;
                if (hkPauseTimer <= 0) {
                    hkGameState = 'PLAYING';
                    hkBannerText = '';
                }
            }

            // 2. Player Striker Physics Update
            if (hkGameState === 'PLAYING') {
                const targetX = hkPlayer.targetX;
                const targetY = hkPlayer.targetY;
                hkPlayer.vx = (targetX - hkPlayer.x);
                hkPlayer.vy = (targetY - hkPlayer.y);
                hkPlayer.x = targetX;
                hkPlayer.y = targetY;
            }

            // 3. Smart Chef AI Logic (Corner-Aware & Dynamic Scaling)
            if (hkGameState === 'PLAYING') {
                const speedBoost = Math.min(hkScore.player * 1.0, 4.5);
                hkChefAI.currentSpeed = hkChefAI.baseSpeed + speedBoost;

                const goalCenter = hkTable.width / 2;
                const puckInChefZone = hkPuck.y < (hkTable.height * 0.5);
                let aiTargetX = goalCenter;
                let aiTargetY = hkTable.height * 0.16;

                const minChefX = hkChefAI.radius + 12;
                const maxChefX = hkTable.width - hkChefAI.radius - 12;
                const minChefY = hkChefAI.radius + 12;
                const maxChefY = (hkTable.height * 0.48) - hkChefAI.radius;

                // Check if puck is in AI's deep corner or back zone (behind AI or near top wall)
                const isDeepInCorner = hkPuck.y < minChefY + 35 && (hkPuck.x < hkTable.width * 0.35 || hkPuck.x > hkTable.width * 0.65);
                const isBehindAi = hkPuck.y < hkChefAI.y + 10;

                if (puckInChefZone) {
                    if (isDeepInCorner || isBehindAi) {
                        // FIX: When puck is in corner or behind AI, DO NOT charge into the corner/wall!
                        // Back off slightly toward center and position laterally to sweep or let corner deflectors reflect the puck
                        if (hkPuck.x < goalCenter) {
                            aiTargetX = Math.max(goalCenter - 25, hkPuck.x + hkChefAI.radius + 35);
                            aiTargetY = Math.max(minChefY + 30, hkPuck.y + 25);
                        } else {
                            aiTargetX = Math.min(goalCenter + 25, hkPuck.x - hkChefAI.radius - 35);
                            aiTargetY = Math.max(minChefY + 30, hkPuck.y + 25);
                        }
                    } else {
                        // Offensive / Defensive strike - keep AI slightly behind the puck to drive it forward
                        const lateralOffset = (hkPuck.x - goalCenter) * 0.12;
                        aiTargetX = hkPuck.x - lateralOffset;
                        aiTargetY = Math.max(minChefY, hkPuck.y - hkChefAI.radius - 14);
                    }
                } else {
                    // Puck in Player's zone: AI guards its goal
                    const predictedX = hkPuck.x + (hkPuck.vx * 8);
                    const goalMouthLeft = goalCenter - (hkTable.goalWidth / 2) + 20;
                    const goalMouthRight = goalCenter + (hkTable.goalWidth / 2) - 20;
                    aiTargetX = Math.max(goalMouthLeft, Math.min(goalMouthRight, predictedX));
                    aiTargetY = hkTable.height * 0.14 + Math.sin(hkChefAuraAngle * 1.5) * 8;
                }

                // AI Movement towards target
                const dx = aiTargetX - hkChefAI.x;
                const dy = aiTargetY - hkChefAI.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 1.5) {
                    const step = Math.min(dist, hkChefAI.currentSpeed);
                    hkChefAI.vx = (dx / dist) * step;
                    hkChefAI.vy = (dy / dist) * step;
                    hkChefAI.x += hkChefAI.vx;
                    hkChefAI.y += hkChefAI.vy;
                } else {
                    hkChefAI.vx = 0;
                    hkChefAI.vy = 0;
                }

                // Clamp AI inside its half
                hkChefAI.x = Math.max(minChefX, Math.min(maxChefX, hkChefAI.x));
                hkChefAI.y = Math.max(minChefY, Math.min(maxChefY, hkChefAI.y));
            }

            // 4. Puck Physics (2 sub-steps for smooth collision and anti-tunneling)
            if (hkGameState === 'PLAYING') {
                const subSteps = 2;
                const goalLeft = (hkTable.width - hkTable.goalWidth) / 2;
                const goalRight = (hkTable.width + hkTable.goalWidth) / 2;
                const railInset = 10;
                const bevel = hkTable.cornerBevel || 42;
                const nDiag = 0.70710678; // 1 / Math.sqrt(2)

                for (let step = 0; step < subSteps; step++) {
                    hkPuck.x += (hkPuck.vx / subSteps);
                    hkPuck.y += (hkPuck.vy / subSteps);

                    hkPuck.vx *= Math.pow(hkPuck.friction, 1 / subSteps);
                    hkPuck.vy *= Math.pow(hkPuck.friction, 1 / subSteps);

                    const currentVel = Math.hypot(hkPuck.vx, hkPuck.vy);
                    if (currentVel > hkPuck.maxSpeed) {
                        hkPuck.vx = (hkPuck.vx / currentVel) * hkPuck.maxSpeed;
                        hkPuck.vy = (hkPuck.vy / currentVel) * hkPuck.maxSpeed;
                    }

                    // --- 4A. ANGLED CORNER DEFLECTORS (PHYSICAL BEVELS) ---
                    // Top-Left Corner Deflector
                    const dTopLeft = (hkPuck.x - railInset) + (hkPuck.y - railInset);
                    if (dTopLeft < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dTopLeft;
                        hkPuck.x += overlap * nDiag;
                        hkPuck.y += overlap * nDiag;
                        const vDot = hkPuck.vx * nDiag + hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx - 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy - 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx < 2) hkPuck.vx = 2.5;
                            if (hkPuck.vy < 2) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 8, 1.4);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Top-Right Corner Deflector
                    const dTopRight = (hkTable.width - railInset - hkPuck.x) + (hkPuck.y - railInset);
                    if (dTopRight < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dTopRight;
                        hkPuck.x -= overlap * nDiag;
                        hkPuck.y += overlap * nDiag;
                        const vDot = -hkPuck.vx * nDiag + hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx + 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy - 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx > -2) hkPuck.vx = -2.5;
                            if (hkPuck.vy < 2) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 8, 1.4);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Bottom-Left Corner Deflector
                    const dBotLeft = (hkPuck.x - railInset) + (hkTable.height - railInset - hkPuck.y);
                    if (dBotLeft < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dBotLeft;
                        hkPuck.x += overlap * nDiag;
                        hkPuck.y -= overlap * nDiag;
                        const vDot = hkPuck.vx * nDiag - hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx - 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy + 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx < 2) hkPuck.vx = 2.5;
                            if (hkPuck.vy > -2) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00ffff', 8, 1.4);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // Bottom-Right Corner Deflector
                    const dBotRight = (hkTable.width - railInset - hkPuck.x) + (hkTable.height - railInset - hkPuck.y);
                    if (dBotRight < bevel + hkPuck.radius) {
                        const overlap = (bevel + hkPuck.radius) - dBotRight;
                        hkPuck.x -= overlap * nDiag;
                        hkPuck.y -= overlap * nDiag;
                        const vDot = -hkPuck.vx * nDiag - hkPuck.vy * nDiag;
                        if (vDot < 0) {
                            hkPuck.vx = (hkPuck.vx + 2 * vDot * nDiag) * 1.05;
                            hkPuck.vy = (hkPuck.vy + 2 * vDot * nDiag) * 1.05;
                            if (hkPuck.vx > -2) hkPuck.vx = -2.5;
                            if (hkPuck.vy > -2) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00ffff', 8, 1.4);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4B. WALL COLLISION: SIDES ---
                    if (hkPuck.x - hkPuck.radius < railInset) {
                        hkPuck.x = railInset + hkPuck.radius;
                        hkPuck.vx = Math.abs(hkPuck.vx) * 0.98;
                        if (hkPuck.vx < 1.5) hkPuck.vx = 2.0;
                        createHkSparks(hkPuck.x, hkPuck.y, '#00ffff', 6, 1);
                        playHkSound('WALL_BOUNCE');
                    } else if (hkPuck.x + hkPuck.radius > hkTable.width - railInset) {
                        hkPuck.x = hkTable.width - railInset - hkPuck.radius;
                        hkPuck.vx = -Math.abs(hkPuck.vx) * 0.98;
                        if (hkPuck.vx > -1.5) hkPuck.vx = -2.0;
                        createHkSparks(hkPuck.x, hkPuck.y, '#00ffff', 6, 1);
                        playHkSound('WALL_BOUNCE');
                    }

                    // --- 4C. WALL COLLISION: TOP (CHEF SIDE) ---
                    if (hkPuck.y - hkPuck.radius < railInset) {
                        if (hkPuck.x >= goalLeft && hkPuck.x <= goalRight) {
                            if (hkPuck.y < -4) {
                                handleGoalScored('PLAYER');
                                break;
                            }
                        } else {
                            hkPuck.y = railInset + hkPuck.radius;
                            hkPuck.vy = Math.abs(hkPuck.vy) * 0.98;
                            if (hkPuck.vy < 1.5) hkPuck.vy = 2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#ff007f', 6, 1);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4D. WALL COLLISION: BOTTOM (PLAYER SIDE) ---
                    if (hkPuck.y + hkPuck.radius > hkTable.height - railInset) {
                        if (hkPuck.x >= goalLeft && hkPuck.x <= goalRight) {
                            if (hkPuck.y > hkTable.height + 4) {
                                handleGoalScored('CHEF');
                                break;
                            }
                        } else {
                            hkPuck.y = hkTable.height - railInset - hkPuck.radius;
                            hkPuck.vy = -Math.abs(hkPuck.vy) * 0.98;
                            if (hkPuck.vy > -1.5) hkPuck.vy = -2.5;
                            createHkSparks(hkPuck.x, hkPuck.y, '#00ffff', 6, 1);
                            playHkSound('WALL_BOUNCE');
                        }
                    }

                    // --- 4E. STRIKER VS PUCK COLLISION ---
                    function resolveStrikerPuck(striker, isPlayer) {
                        const cdx = hkPuck.x - striker.x;
                        const cdy = hkPuck.y - striker.y;
                        const dist = Math.hypot(cdx, cdy);
                        const minDist = hkPuck.radius + striker.radius;

                        if (dist < minDist && dist > 0.001) {
                            const nx = cdx / dist;
                            const ny = cdy / dist;

                            // Prevent sandwich/pinching against walls
                            if (!isPlayer && hkPuck.y < 35 && ny < 0) {
                                striker.y = Math.max(striker.radius + 15, striker.y + 4);
                                hkPuck.vy = Math.max(4.0, Math.abs(hkPuck.vy) + 2.0);
                                hkPuck.vx += (hkPuck.x < goalCenter ? 2.5 : -2.5);
                            } else {
                                hkPuck.x = striker.x + nx * (minDist + 1);
                                hkPuck.y = striker.y + ny * (minDist + 1);
                            }

                            const rvx = hkPuck.vx - striker.vx;
                            const rvy = hkPuck.vy - striker.vy;
                            const velAlongNorm = rvx * nx + rvy * ny;

                            if (velAlongNorm < 0) {
                                const elasticity = 1.32;
                                const impulse = -(1 + elasticity) * velAlongNorm;
                                hkPuck.vx += nx * impulse + striker.vx * 0.65;
                                hkPuck.vy += ny * impulse + striker.vy * 0.65;

                                const hitSpeed = Math.hypot(hkPuck.vx, hkPuck.vy);
                                playHkSound('PUCK_HIT', hitSpeed);
                                createHkSparks(striker.x + nx * striker.radius, striker.y + ny * striker.radius, isPlayer ? '#00ffff' : '#ffaa00', 10, 1.3);

                                if (hitSpeed > 10) hkCameraShake = 5;
                            } else {
                                hkPuck.vx += nx * 2.5;
                                hkPuck.vy += ny * 2.5;
                            }
                        }
                    }

                    resolveStrikerPuck(hkPlayer, true);
                    resolveStrikerPuck(hkChefAI, false);
                }

                // --- 4F. ANTI-STUCK CYBER AIR-JET WATCHDOG ---
                const currentSpeed = Math.hypot(hkPuck.vx, hkPuck.vy);
                const isNearAiCorner = hkPuck.y < 95 && (hkPuck.x < 95 || hkPuck.x > hkTable.width - 95);
                const isNearDeadZone = hkPuck.y < 42;

                if (currentSpeed < 1.0 || (isNearAiCorner && currentSpeed < 2.0) || (isNearDeadZone && currentSpeed < 1.8)) {
                    hkPuckStuckCounter = (hkPuckStuckCounter || 0) + 1;
                    if (hkPuckStuckCounter > 40) { // ~0.65 seconds
                        const angleToCenter = Math.atan2((hkTable.height / 2) - hkPuck.y, (hkTable.width / 2) - hkPuck.x);
                        const kickSpeed = 6.0 + Math.random() * 2.0;
                        hkPuck.vx = Math.cos(angleToCenter) * kickSpeed;
                        hkPuck.vy = Math.sin(angleToCenter) * kickSpeed;
                        createHkSparks(hkPuck.x, hkPuck.y, '#39ff14', 18, 2.0);
                        playHkSound('WALL_BOUNCE');
                        hkChefAI.dialogue = "Chef AI: Corner jet activated! Puck cleared! 💨";
                        hkChefAI.dialogueTimer = 140;
                        hkPuckStuckCounter = 0;
                    }
                } else {
                    hkPuckStuckCounter = 0;
                }

                hkPuck.trail.unshift({ x: hkPuck.x, y: hkPuck.y });
                if (hkPuck.trail.length > 8) hkPuck.trail.pop();
            }

            // 5. Goal Scored Handler
            function handleGoalScored(scorer) {
                hkGameState = 'GOAL_PAUSE';
                hkPauseTimer = 75;
                hkCameraShake = 16;

                if (scorer === 'PLAYER') {
                    hkScore.player++;
                    hkBannerText = '⚡ GOAL FOR PLAYER! ⚡';
                    hkBannerColor = '#00ffff';
                    playHkSound('GOAL_PLAYER');
                    createHkConfetti(hkPuck.x, 20);

                    const taunts = [
                        'Chef AI: Nice shot! Let me turn up the heat! 🔥',
                        'Chef AI: Wow, quick wrist! Time to get serious! 🔪',
                        'Chef AI: Chef Master Mode Sizzling! ⚡👨‍🍳',
                        'Chef AI: Incredible angle! You are good! 🍳',
                        'Chef AI: MASTER OF THE AIR RINK! 🏆'
                    ];
                    hkChefAI.dialogue = taunts[Math.min(hkScore.player - 1, taunts.length - 1)];
                    hkChefAI.dialogueTimer = 220;

                    const targetTar = parseInt((window.rules && window.rules.hockeyTar) || 5);
                    const targetDisc = parseInt((window.rules && window.rules.hockeyDisc) || 15);

                    if (hkScore.player >= targetTar) {
                        playHkSound('MILESTONE');
                        createHkConfetti(hkTable.width / 2, hkTable.height / 2);
                        if (typeof triggerRewardCoupon === 'function') {
                            triggerRewardCoupon(targetDisc);
                        }
                        hkBannerText = `🏆 ${targetDisc}% OFF UNLOCKED! 🏆`;
                        hkBannerColor = '#39ff14';
                    }

                    resetHkPuck(false);
                } else {
                    hkScore.chef++;
                    hkBannerText = '👨‍🍳 CHEF AI SCORED! 👨‍🍳';
                    hkBannerColor = '#ff007f';
                    playHkSound('GOAL_CHEF');
                    createHkSparks(hkPuck.x, hkTable.height - 20, '#ff007f', 30, 2);

                    const chefBrags = [
                        'Chef AI: Order up! Chef scores! 👨‍🍳🔥',
                        'Chef AI: Secret recipe smash! Delicious! 🍕',
                        'Chef AI: Too fast for you, customer! ⚡'
                    ];
                    hkChefAI.dialogue = chefBrags[Math.floor(Math.random() * chefBrags.length)];
                    hkChefAI.dialogueTimer = 200;

                    resetHkPuck(true);
                }
            }

            // 6. Draw Table Scene
            renderCyberAirHockeyScene();
        }

        // ===================================================================
        // 🎨 AIR HOCKEY HIGH-AESTHETIC CYBER TABLE RENDERER
        // ===================================================================
        function renderCyberAirHockeyScene() {
            const ctx = hkCtx;
            const W = hkTable.width;
            const H = hkTable.height;
            const goalLeft = (W - hkTable.goalWidth) / 2;
            const goalRight = (W + hkTable.goalWidth) / 2;

            ctx.save();

            if (hkCameraShake > 0) {
                const sx = (Math.random() - 0.5) * hkCameraShake;
                const sy = (Math.random() - 0.5) * hkCameraShake;
                ctx.translate(sx, sy);
                hkCameraShake *= 0.88;
                if (hkCameraShake < 0.2) hkCameraShake = 0;
            }

            // Rink Gradient
            const rinkGrad = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, H * 0.7);
            rinkGrad.addColorStop(0, '#0d1326');
            rinkGrad.addColorStop(0.7, '#070a16');
            rinkGrad.addColorStop(1, '#03050a');
            ctx.fillStyle = rinkGrad;
            ctx.fillRect(0, 0, W, H);

            // Cyber Grid Lines
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 32;
            for (let x = 10; x < W - 10; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 10);
                ctx.lineTo(x, H - 10);
                ctx.stroke();
            }
            for (let y = 10; y < H - 10; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(10, y);
                ctx.lineTo(W - 10, y);
                ctx.stroke();
            }

            // Center Line
            const centerY = H / 2;
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(12, centerY);
            ctx.lineTo(W - 12, centerY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Ring
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(W / 2, centerY, 44, 0, Math.PI * 2);
            ctx.stroke();

            ctx.save();
            ctx.translate(W / 2, centerY);
            ctx.rotate(hkChefAuraAngle);
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, 26, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.shadowBlur = 0;
            ctx.font = '22px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText('⚡', W / 2, centerY);

            // Goals
            // Top Goal Mouth (Chef)
            ctx.fillStyle = 'rgba(255, 0, 127, 0.25)';
            ctx.fillRect(goalLeft, 0, hkTable.goalWidth, 14);
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 12;
            ctx.strokeRect(goalLeft, 0, hkTable.goalWidth, 14);
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.4)';
            ctx.lineWidth = 1;
            for (let gx = goalLeft + 12; gx < goalRight; gx += 14) {
                ctx.beginPath();
                ctx.moveTo(gx, 0);
                ctx.lineTo(gx, 14);
                ctx.stroke();
            }

            // Bottom Goal Mouth (Player)
            ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
            ctx.fillRect(goalLeft, H - 14, hkTable.goalWidth, 14);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.strokeRect(goalLeft, H - 14, hkTable.goalWidth, 14);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            for (let gx = goalLeft + 12; gx < goalRight; gx += 14) {
                ctx.beginPath();
                ctx.moveTo(gx, H - 14);
                ctx.lineTo(gx, H);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Outer Rails with Angled Corner Bumpers
            const bevel = hkTable.cornerBevel || 42;
            const rInset = 10;
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Chef Half Rails (Pink Neon)
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.85)';
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            // Top Left Rail + Corner Bevel
            ctx.moveTo(goalLeft, rInset);
            ctx.lineTo(rInset + bevel, rInset);
            ctx.lineTo(rInset, rInset + bevel);
            ctx.lineTo(rInset, centerY);
            // Top Right Rail + Corner Bevel
            ctx.moveTo(goalRight, rInset);
            ctx.lineTo(W - rInset - bevel, rInset);
            ctx.lineTo(W - rInset, rInset + bevel);
            ctx.lineTo(W - rInset, centerY);
            ctx.stroke();

            // Player Half Rails (Cyan Neon)
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.85)';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            // Bottom Left Rail + Corner Bevel
            ctx.moveTo(rInset, centerY);
            ctx.lineTo(rInset, H - rInset - bevel);
            ctx.lineTo(rInset + bevel, H - rInset);
            ctx.lineTo(goalLeft, H - rInset);
            // Bottom Right Rail + Corner Bevel
            ctx.moveTo(W - rInset, centerY);
            ctx.lineTo(W - rInset, H - rInset - bevel);
            ctx.lineTo(W - rInset - bevel, H - rInset);
            ctx.lineTo(goalRight, H - rInset);
            ctx.stroke();

            // Corner Jet / Booster indicator markers
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(57, 255, 20, 0.45)';
            [
                { x: rInset + 8, y: rInset + 8 },
                { x: W - rInset - 8, y: rInset + 8 },
                { x: rInset + 8, y: H - rInset - 8 },
                { x: W - rInset - 8, y: H - rInset - 8 }
            ].forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Puck Trail
            for (let i = 0; i < hkPuck.trail.length; i++) {
                const tr = hkPuck.trail[i];
                const trAlpha = (1 - (i / hkPuck.trail.length)) * 0.45;
                const trRad = hkPuck.radius * (1 - (i / hkPuck.trail.length) * 0.4);
                ctx.fillStyle = `rgba(0, 255, 255, ${trAlpha})`;
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, trRad, 0, Math.PI * 2);
                ctx.fill();
            }

            // Glowing Puck
            ctx.save();
            ctx.shadowColor = '#f1c40f';
            ctx.shadowBlur = 14;
            const puckGrad = ctx.createRadialGradient(hkPuck.x, hkPuck.y, 2, hkPuck.x, hkPuck.y, hkPuck.radius);
            puckGrad.addColorStop(0, '#ffffff');
            puckGrad.addColorStop(0.5, '#f1c40f');
            puckGrad.addColorStop(1, '#e67e22');
            ctx.fillStyle = puckGrad;
            ctx.beginPath();
            ctx.arc(hkPuck.x, hkPuck.y, hkPuck.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(hkPuck.x - 3, hkPuck.y - 3, hkPuck.radius * 0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Chef AI Mallet
            ctx.save();
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 16;
            const chefGrad = ctx.createRadialGradient(hkChefAI.x, hkChefAI.y, 4, hkChefAI.x, hkChefAI.y, hkChefAI.radius);
            chefGrad.addColorStop(0, '#ffa502');
            chefGrad.addColorStop(0.6, '#ff4757');
            chefGrad.addColorStop(1, '#2f3542');
            ctx.fillStyle = chefGrad;
            ctx.beginPath();
            ctx.arc(hkChefAI.x, hkChefAI.y, hkChefAI.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.font = '16px Segoe UI';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('👨‍🍳', hkChefAI.x, hkChefAI.y);
            ctx.restore();

            // Player Mallet
            ctx.save();
            ctx.shadowColor = '#00d2d3';
            ctx.shadowBlur = 18;
            const plyrGrad = ctx.createRadialGradient(hkPlayer.x, hkPlayer.y, 4, hkPlayer.x, hkPlayer.y, hkPlayer.radius);
            plyrGrad.addColorStop(0, '#ffffff');
            plyrGrad.addColorStop(0.5, '#00d2d3');
            plyrGrad.addColorStop(1, '#0984e3');
            ctx.fillStyle = plyrGrad;
            ctx.beginPath();
            ctx.arc(hkPlayer.x, hkPlayer.y, hkPlayer.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(hkPlayer.x, hkPlayer.y, hkPlayer.radius * 0.38, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0984e3';
            ctx.beginPath();
            ctx.arc(hkPlayer.x, hkPlayer.y, hkPlayer.radius * 0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Particles
            for (let i = hkParticles.length - 1; i >= 0; i--) {
                const p = hkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) {
                    hkParticles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // HUD
            ctx.font = '900 18px Segoe UI, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillStyle = '#ff4757';
            ctx.fillText(`👨‍🍳 Chef: ${hkScore.chef}`, 20, 32);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(`Player: ${hkScore.player} 🏒`, W - 20, 32);

            // Chef Dialogue
            if (hkChefAI.dialogue && hkChefAI.dialogueTimer > 0) {
                const bubbleY = 52;
                ctx.font = 'bold 11px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                const textWidth = ctx.measureText(hkChefAI.dialogue).width;
                const bubbleW = textWidth + 24;

                ctx.fillStyle = 'rgba(20, 25, 40, 0.88)';
                ctx.strokeStyle = 'rgba(255, 71, 87, 0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect((W - bubbleW) / 2, bubbleY, bubbleW, 22, 11);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.fillText(hkChefAI.dialogue, W / 2, bubbleY + 15);
            }

            // Target Matrix Progress
            const targetTar = parseInt((window.rules && window.rules.hockeyTar) || 5);
            const targetDisc = parseInt((window.rules && window.rules.hockeyDisc) || 15);
            const isCompleted = hkScore.player >= targetTar;

            const footerY = H - 24;
            ctx.font = 'bold 11px Segoe UI, sans-serif';
            ctx.textAlign = 'center';

            ctx.fillStyle = isCompleted ? '#39ff14' : 'rgba(255, 255, 255, 0.75)';
            const targetText = isCompleted
                ? `🎉 Target Achieved: ${targetDisc}% OFF Unlocked!`
                : `🎯 Target: Score ${targetTar} Goals for ${targetDisc}% OFF (${hkScore.player}/${targetTar})`;
            ctx.fillText(targetText, W / 2, footerY);

            // Goal / Milestone Overlay Banner
            if (hkBannerText && hkGameState === 'GOAL_PAUSE') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.fillRect(0, centerY - 38, W, 76);

                ctx.font = '900 20px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = hkBannerColor;
                ctx.shadowColor = hkBannerColor;
                ctx.shadowBlur = 15;
                ctx.fillText(hkBannerText, W / 2, centerY + 7);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // Global exports
        if (typeof safeExport === 'function') {
            safeExport('initAirHockeyGame', typeof initAirHockeyGame !== 'undefined' ? initAirHockeyGame : undefined);
            safeExport('frameUpdateAirHockey', typeof frameUpdateAirHockey !== 'undefined' ? frameUpdateAirHockey : undefined);
        }
        window.initAirHockeyGame = initAirHockeyGame;
        window.frameUpdateAirHockey = frameUpdateAirHockey;

        window.returnToCustomerMenu = returnToCustomerMenu;
    </script>
</body>

</html>
