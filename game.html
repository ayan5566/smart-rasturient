    <script>
        function handleGameIconError(img, fallbackEmoji) {
            if (!img) return;
            if (!img.dataset.retried) {
                img.dataset.retried = "1";
                // 1. Try repo subdirectory path if hosted on GitHub Pages (e.g. /smart-rasturient/)
                var pathParts = window.location.pathname.split('/').filter(Boolean);
                var filename = img.getAttribute('src').split('/').pop();
                if (pathParts.length > 0 && !window.location.pathname.endsWith('.html')) {
                    img.src = '/' + pathParts[0] + '/assets/icons/' + filename;
                    return;
                } else if (pathParts.length > 1) {
                    img.src = '/' + pathParts[0] + '/assets/icons/' + filename;
                    return;
                }
            }
            // 2. If the file is missing or not yet pushed to GitHub, show sleek fallback emoji
            img.style.display = 'none';
            if (img.parentNode && !img.parentNode.querySelector('.game-fallback-emoji')) {
                var span = document.createElement('span');
                span.className = 'game-fallback-emoji';
                span.style.fontSize = '26px';
                span.style.lineHeight = '1';
                span.style.display = 'block';
                span.style.marginBottom = '4px';
                span.innerText = fallbackEmoji || '🎮';
                img.parentNode.insertBefore(span, img);
            }
        }
        window.handleGameIconError = handleGameIconError;
    </script>

    <script>

        // ===================================================================
        // 🛡️ SECURITY MODULE V9: UNLOCKED TOUCH CLICKS + ZERO FREEZE LAG
        // ===================================================================
        (function bootIndestructibleArcadeInputEngine() {
            document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
            document.addEventListener('selectstart', function (e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return true;
                e.preventDefault(); return false;
            });
            document.addEventListener('touchstart', function (e) {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: true });
            document.addEventListener('keydown', function (e) {
                if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'x' || e.key === 'X' || e.key === 'v' || e.key === 'V' || e.key === 'u' || e.key === 'U')) {
                    e.preventDefault(); return false;
                }
            }, false);
            console.log("🌊 Active Flow: Touch clicks unlocked perfectly. Arcade input engine operational.");

            const bindTouchEvents = (element, dirValue) => {
                if (!element) return;

                // Prevent ghost clicks and touch emulation lag on Android
                const handleStart = (e) => {
                    if (e.cancelable) e.preventDefault();
                    brickPaddleDir = dirValue;
                };

                const handleEnd = (e) => {
                    if (e.cancelable) e.preventDefault();
                    if ((dirValue < 0 && brickPaddleDir < 0) || (dirValue > 0 && brickPaddleDir > 0)) {
                        brickPaddleDir = 0;
                    }
                };

                element.addEventListener('touchstart', handleStart, { passive: false });
                element.addEventListener('touchend', handleEnd, { passive: false });
                element.addEventListener('touchcancel', handleEnd, { passive: false });

                element.addEventListener('mousedown', (e) => { brickPaddleDir = dirValue; });
                element.addEventListener('mouseup', (e) => {
                    if ((dirValue < 0 && brickPaddleDir < 0) || (dirValue > 0 && brickPaddleDir > 0)) brickPaddleDir = 0;
                });
                element.addEventListener('mouseleave', (e) => {
                    if ((dirValue < 0 && brickPaddleDir < 0) || (dirValue > 0 && brickPaddleDir > 0)) brickPaddleDir = 0;
                });
            };

        function onSnakeGameOver() { triggerAudioBeepAlert(null, 'GAME_OVER'); }
        function onSnakeCombo() { triggerAudioBeepAlert(null, 'COMBO'); }

        function createSnakeParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                snakeParticlesArray.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    life: 1.0, decay: Math.random() * 0.05 + 0.02, color: color
                });
            }
        }

        // ===================================================================
        // 🐍 CORE INITIALIZATION (OVERRIDES EXISTING INIT)
        // ===================================================================
        function initSnakeGameLoop() {
            clearInterval(loopTimerInstance);
            const sCanvas = document.getElementById('snakeCanvas');
            if (sCanvas) {
                snakeCanvasElement = sCanvas;
                snCtx = sCanvas.getContext('2d');
            }
            if (!snakeCanvasElement) return;

            // Bind direct swipe gestures to snakeCanvas
            if (!snakeCanvasTouchBound && snakeCanvasElement) {
                snakeCanvasElement.addEventListener('touchstart', function (e) {
                    if (e.touches && e.touches.length > 0) {
                        snakeSwipeStartX = e.touches[0].clientX;
                        snakeSwipeStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                snakeCanvasElement.addEventListener('touchmove', function (e) {
                    if (e.cancelable) e.preventDefault();
                }, { passive: false });

                snakeCanvasElement.addEventListener('touchend', function (e) {
                    if (e.changedTouches && e.changedTouches.length > 0) {
                        const dx = e.changedTouches[0].clientX - snakeSwipeStartX;
                        const dy = e.changedTouches[0].clientY - snakeSwipeStartY;
                        const absX = Math.abs(dx);
                        const absY = Math.abs(dy);
                        if (Math.max(absX, absY) > 25) {
                            if (absX > absY) {
                                setSnakeDirection(dx > 0 ? 'RIGHT' : 'LEFT');
                            } else {
                                setSnakeDirection(dy > 0 ? 'DOWN' : 'UP');
                            }
                        }
                    }
                }, { passive: true });
                snakeCanvasTouchBound = true;
            }

            // Include px, py to store previous grid locations for 60FPS smooth interpolation
            snakeArr = [
                { x: 80, y: 80, px: 80, py: 80 },
                { x: 60, y: 80, px: 60, py: 80 },
                { x: 40, y: 80, px: 40, py: 80 }
            ];
            currentSnakeVector = { x: 20, y: 0 };
            snakeLastMovedVector = { x: 20, y: 0 };
            snakeScoreCounter = 0;

            // Reset progression variables
            snakeTickAccumulator = 0;
            snakeCurrentTickRate = 140;
            snakeComboCount = 1;
            snakeComboTimeLeft = 0;
            snakeObstaclesArray = [];
            snakePowerUpObj = null;
            snakeParticlesArray = [];

            // Generate background ambient stars once to prevent GC spikes
            snakeBgStars = [];
            for (let i = 0; i < 25; i++) {
                snakeBgStars.push({ x: Math.random() * 400, y: Math.random() * 400, speed: Math.random() * 0.5 + 0.1 });
            }

            generateSnakeFoodLocation();

            // 🔥 FRAME UPGRADE: Engine runs at 16ms (~60 FPS) for smooth visual interpolation
            loopTimerInstance = setInterval(frameUpdateSnake, 16);
        }
        window.initSnakeGameLoop = initSnakeGameLoop;

        function generateSnakeFoodLocation() {
            let maxGridCols = Math.floor(snakeCanvasElement.width / 20);
            let maxGridRows = Math.floor((snakeCanvasElement.height - 20) / 20);
            let valid = false;

            while (!valid) {
                snakeFoodUnit = {
                    x: Math.floor(Math.random() * maxGridCols) * 20,
                    y: Math.floor(Math.random() * maxGridRows + 1) * 20
                };
                valid = true;
                // Verify it doesn't spawn on snake
                for (let c of snakeArr) if (c.x === snakeFoodUnit.x && c.y === snakeFoodUnit.y) valid = false;
                // Verify it doesn't spawn on obstacles
                for (let o of snakeObstaclesArray) if (o.x === snakeFoodUnit.x && o.y === snakeFoodUnit.y) valid = false;
            }
        }

        function generateSnakeObstacle() {
            let maxGridCols = Math.floor(snakeCanvasElement.width / 20);
            let maxGridRows = Math.floor((snakeCanvasElement.height - 20) / 20);
            let obs = { x: Math.floor(Math.random() * maxGridCols) * 20, y: Math.floor(Math.random() * maxGridRows + 1) * 20 };
            // Safety check to avoid spawning near head or food
            if (Math.abs(obs.x - snakeArr[0].x) > 40 && Math.abs(obs.y - snakeArr[0].y) > 40) {
                snakeObstaclesArray.push(obs);
            }
        }

        // ===================================================================
        // 🐍 AAA RENDERING & LOGIC TICK ENGINE (60 FPS + INTERPOLATION)
        // ===================================================================
        function frameUpdateSnake() {
            if (!snakeCanvasElement || !snCtx || !snakeArr || snakeArr.length === 0) return;

            snakeTimeVisual += 0.05;
            snakeTickAccumulator += 16; // 16ms rendering delta

            // --- COMBO TIMERS ---
            if (snakeComboTimeLeft > 0) {
                snakeComboTimeLeft -= 16;
                if (snakeComboTimeLeft <= 0) snakeComboCount = 1; // Reset combo if too slow
            }

            // --- LOGIC TICK (Executes only when accumulated time exceeds speed rate) ---
            if (snakeTickAccumulator >= snakeCurrentTickRate) {
                snakeTickAccumulator -= snakeCurrentTickRate;
                snakeLastMovedVector = { ...currentSnakeVector }; // Lock movement vector to prevent quick-turn suicide

                // Save previous positions for smooth lerping
                for (let i = 0; i < snakeArr.length; i++) {
                    snakeArr[i].px = snakeArr[i].x;
                    snakeArr[i].py = snakeArr[i].y;
                }

                let nextHead = {
                    x: snakeArr[0].x + currentSnakeVector.x,
                    y: snakeArr[0].y + currentSnakeVector.y,
                    px: snakeArr[0].x, // Anchor visual start point
                    py: snakeArr[0].y
                };

                // 1. Wall Collision (Admin Grid Boundaries)
                if (nextHead.x < 0 || nextHead.x >= snakeCanvasElement.width || nextHead.y < 20 || nextHead.y >= snakeCanvasElement.height) {
                    onSnakeGameOver();
                    createSnakeParticles(snakeArr[0].x, snakeArr[0].y, '#ff4d4d', 30);
                    finalizeFailedRun("💥 Snake Hit The Grid Wall!");
                    return;
                }

                // 2. Self Collision
                for (let i = 1; i < snakeArr.length; i++) {
                    if (nextHead.x === snakeArr[i].x && nextHead.y === snakeArr[i].y) {
                        onSnakeGameOver();
                        createSnakeParticles(nextHead.x, nextHead.y, '#e74c3c', 30);
                        finalizeFailedRun("💥 Snake Tangled Itself!");
                        return;
                    }
                }

                // 3. Obstacle Collision
                for (let obs of snakeObstaclesArray) {
                    if (nextHead.x === obs.x && nextHead.y === obs.y) {
                        onSnakeGameOver();
                        createSnakeParticles(nextHead.x, nextHead.y, '#95a5a6', 30);
                        finalizeFailedRun("💥 Snake Hit A Laser Barrier!");
                        return;
                    }
                }

                snakeArr.unshift(nextHead);

                // 4. Food Collection Logic
                if (nextHead.x === snakeFoodUnit.x && nextHead.y === snakeFoodUnit.y) {
                    // Combo System Check
                    if (snakeComboTimeLeft > 0) {
                        snakeComboCount = Math.min(5, snakeComboCount + 1);
                        onSnakeCombo();
                    }

                    snakeScoreCounter += snakeComboCount;
                    snakeComboTimeLeft = 3500; // 3.5 seconds to maintain combo
                    onSnakeEatFood();

                    createSnakeParticles(snakeFoodUnit.x + 10, snakeFoodUnit.y + 10, '#2ecc71', 15);
                    generateSnakeFoodLocation();

                    // Difficulty Escalation: Speed Boost & Obstacles
                    snakeCurrentTickRate = Math.max(55, 140 - (Math.floor(snakeScoreCounter / 5) * 5));
                    if (snakeScoreCounter > 20 && snakeScoreCounter % 15 === 0 && snakeObstaclesArray.length < 8) {
                        generateSnakeObstacle();
                    }

                    // PowerUp Spawner (10% chance)
                    if (!snakePowerUpObj && Math.random() < 0.1) {
                        let maxC = Math.floor(snakeCanvasElement.width / 20);
                        let maxR = Math.floor((snakeCanvasElement.height - 20) / 20);
                        snakePowerUpObj = { x: Math.floor(Math.random() * maxC) * 20, y: Math.floor(Math.random() * maxR + 1) * 20, life: 6000 };
                    }

                    // 🔥 Reward System Trigger (Untouched Logic)
                    if (snakeScoreCounter >= (parseInt(rules.snakeTar) || 10)) {
                        triggerRewardCoupon(parseInt(rules.snakeDisc) || 0);
                    }
                } else {
                    snakeArr.pop();
                }

                // 5. PowerUp Collection Logic
                if (snakePowerUpObj) {
                    snakePowerUpObj.life -= snakeCurrentTickRate;
                    if (snakePowerUpObj.life <= 0) snakePowerUpObj = null; // Despawn
                    else if (nextHead.x === snakePowerUpObj.x && nextHead.y === snakePowerUpObj.y) {
                        snakeScoreCounter += 5; // Bonus points
                        snakeComboCount = 5; // Max combo boost
                        snakeComboTimeLeft = 5000;
                        createSnakeParticles(snakePowerUpObj.x + 10, snakePowerUpObj.y + 10, '#f1c40f', 25);
                        onSnakePowerUp();
                        snakePowerUpObj = null;
                    }
                }
            }

            // --- RENDERING PHASE (Smooth Interpolation) ---
            // Lerp factor is between 0.0 and 1.0 representing progression between logic grid ticks
            let lerpP = snakeTickAccumulator / snakeCurrentTickRate;

            snCtx.clearRect(0, 0, snakeCanvasElement.width, snakeCanvasElement.height);

            // 1. Dynamic Cyber Background
            let bgGrad = snCtx.createLinearGradient(0, 20, 0, snakeCanvasElement.height);
            bgGrad.addColorStop(0, '#090a0f');
            bgGrad.addColorStop(1, '#111522');
            snCtx.fillStyle = bgGrad;
            snCtx.fillRect(0, 20, snakeCanvasElement.width, snakeCanvasElement.height - 20);

            // Floating matrix particles
            snCtx.fillStyle = 'rgba(0, 210, 211, 0.15)';
            snakeBgStars.forEach(s => {
                s.y -= s.speed;
                if (s.y < 20) s.y = snakeCanvasElement.height;
                snCtx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Subtle Micro-Camera Follow Effect
            let visualHeadX = snakeArr[0].px + (snakeArr[0].x - snakeArr[0].px) * lerpP;
            let visualHeadY = snakeArr[0].py + (snakeArr[0].y - snakeArr[0].py) * lerpP;

            let targetCamX = (snakeCanvasElement.width / 2) - visualHeadX;
            let targetCamY = ((snakeCanvasElement.height + 20) / 2) - visualHeadY;

            // Clamp limits so boundaries aren't heavily distorted
            targetCamX = Math.max(-10, Math.min(10, targetCamX * 0.05));
            targetCamY = Math.max(-10, Math.min(10, targetCamY * 0.05));

            snakeCameraOffset.x += (targetCamX - snakeCameraOffset.x) * 0.1;
            snakeCameraOffset.y += (targetCamY - snakeCameraOffset.y) * 0.1;

            snCtx.save();
            snCtx.translate(snakeCameraOffset.x, snakeCameraOffset.y);

            // 2. Draw Obstacles (Glowing Red Boxes)
            snCtx.shadowColor = '#e74c3c';
            snakeObstaclesArray.forEach(obs => {
                snCtx.shadowBlur = 10 + Math.sin(snakeTimeVisual) * 5;
                snCtx.fillStyle = '#c0392b';
                snCtx.beginPath(); snCtx.roundRect(obs.x + 2, obs.y + 2, 16, 16, 4); snCtx.fill();
                snCtx.fillStyle = '#e74c3c';
                snCtx.beginPath(); snCtx.roundRect(obs.x + 4, obs.y + 4, 8, 8, 2); snCtx.fill();
            });
            snCtx.shadowBlur = 0;

            // 3. Draw Premium Food (High-End 3D Glowing Golden Apple)
            snCtx.save();
            let foodYOffset = Math.sin(snakeTimeVisual * 2.5) * 2.5;
            let fx = snakeFoodUnit.x + 10;
            let fy = snakeFoodUnit.y + 10 + foodYOffset;

            // Pulsing golden aura
            snCtx.shadowColor = '#f1c40f';
            snCtx.shadowBlur = 14 + Math.sin(snakeTimeVisual * 3) * 6;

            // Apple body gradient (3D spherical shading)
            let appleGrad = snCtx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, 8);
            appleGrad.addColorStop(0, '#fff6a9');
            appleGrad.addColorStop(0.4, '#f1c40f');
            appleGrad.addColorStop(0.85, '#d35400');
            appleGrad.addColorStop(1, '#962d00');
            snCtx.fillStyle = appleGrad;
            snCtx.beginPath();
            snCtx.arc(fx - 2.5, fy, 5.5, 0, Math.PI * 2);
            snCtx.arc(fx + 2.5, fy, 5.5, 0, Math.PI * 2);
            snCtx.fill();

            // Apple top stem
            snCtx.shadowBlur = 0;
            snCtx.strokeStyle = '#5d4037';
            snCtx.lineWidth = 1.6;
            snCtx.beginPath();
            snCtx.moveTo(fx, fy - 4);
            snCtx.quadraticCurveTo(fx + 2, fy - 8, fx + 3.5, fy - 9);
            snCtx.stroke();

            // Little green leaf
            snCtx.fillStyle = '#2ecc71';
            snCtx.beginPath();
            snCtx.ellipse(fx + 3, fy - 7, 3, 1.5, Math.PI / 4, 0, Math.PI * 2);
            snCtx.fill();

            // Specular shine dot
            snCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            snCtx.beginPath();
            snCtx.arc(fx - 2, fy - 2.5, 1.4, 0, Math.PI * 2);
            snCtx.fill();
            snCtx.restore();

            // Draw PowerUp (If Active - Shimmering Star Core)
            if (snakePowerUpObj) {
                snCtx.save();
                let pOffset = Math.cos(snakeTimeVisual * 3.5) * 3;
                let px = snakePowerUpObj.x + 10;
                let py = snakePowerUpObj.y + 10 + pOffset;
                snCtx.shadowColor = '#00ffff';
                snCtx.shadowBlur = 18;
                snCtx.fillStyle = '#00ffff';
                snCtx.beginPath(); snCtx.arc(px, py, 6, 0, Math.PI * 2); snCtx.fill();
                snCtx.fillStyle = '#ffffff';
                snCtx.beginPath(); snCtx.arc(px, py, 3, 0, Math.PI * 2); snCtx.fill();
                snCtx.restore();
            }

            // 4. Draw Smooth Interpolated Snake Body with 3D Cyber Scales
            for (let i = snakeArr.length - 1; i >= 0; i--) {
                let segment = snakeArr[i];
                let drawX = segment.px + (segment.x - segment.px) * lerpP;
                let drawY = segment.py + (segment.y - segment.py) * lerpP;

                let sSize = 18 - (i * 0.18);
                if (sSize < 9) sSize = 9;
                let sOffset = (20 - sSize) / 2;

                if (i === 0) {
                    // HEAD GRAPHICS (Sleek Cybernetic Viper)
                    snCtx.save();
                    snCtx.shadowColor = '#2ecc71';
                    snCtx.shadowBlur = 12;

                    let headGrad = snCtx.createLinearGradient(drawX, drawY, drawX + 20, drawY + 20);
                    headGrad.addColorStop(0, '#2ecc71');
                    headGrad.addColorStop(1, '#1b7943');
                    snCtx.fillStyle = headGrad;
                    snCtx.beginPath();
                    snCtx.roundRect(drawX + 1, drawY + 1, 18, 18, 9);
                    snCtx.fill();
                    snCtx.shadowBlur = 0;

                    // Glowing Reptile Eyes looking towards movement
                    let eyeOffsetX = (currentSnakeVector.x / 20) * 3.5;
                    let eyeOffsetY = (currentSnakeVector.y / 20) * 3.5;
                    let lx = drawX + 6 + eyeOffsetX;
                    let ly = drawY + 6 + eyeOffsetY;
                    let rx = drawX + 14 + eyeOffsetX;
                    let ry = drawY + 6 + eyeOffsetY;

                    // Gold eye sockets
                    snCtx.fillStyle = '#f1c40f';
                    snCtx.beginPath(); snCtx.arc(lx, ly, 3.2, 0, Math.PI * 2); snCtx.fill();
                    snCtx.beginPath(); snCtx.arc(rx, ry, 3.2, 0, Math.PI * 2); snCtx.fill();

                    // Slit pupils
                    snCtx.fillStyle = '#0b0d14';
                    snCtx.beginPath(); snCtx.ellipse(lx, ly, 1.0, 2.4, 0, 0, Math.PI * 2); snCtx.fill();
                    snCtx.beginPath(); snCtx.ellipse(rx, ry, 1.0, 2.4, 0, 0, Math.PI * 2); snCtx.fill();

                    // Animated Forked Tongue
                    snCtx.fillStyle = "#ff4d4d";
                    let tLen = 4 + Math.sin(snakeTimeVisual * 6) * 4;
                    if (currentSnakeVector.x > 0) {
                        snCtx.fillRect(drawX + 19, drawY + 9, tLen, 2);
                        snCtx.fillRect(drawX + 19 + tLen, drawY + 7, 2, 2);
                        snCtx.fillRect(drawX + 19 + tLen, drawY + 11, 2, 2);
                    } else if (currentSnakeVector.x < 0) {
                        snCtx.fillRect(drawX - tLen + 1, drawY + 9, tLen, 2);
                        snCtx.fillRect(drawX - tLen - 1, drawY + 7, 2, 2);
                        snCtx.fillRect(drawX - tLen - 1, drawY + 11, 2, 2);
                    } else if (currentSnakeVector.y > 0) {
                        snCtx.fillRect(drawX + 9, drawY + 19, 2, tLen);
                        snCtx.fillRect(drawX + 7, drawY + 19 + tLen, 2, 2);
                        snCtx.fillRect(drawX + 11, drawY + 19 + tLen, 2, 2);
                    } else if (currentSnakeVector.y < 0) {
                        snCtx.fillRect(drawX + 9, drawY - tLen + 1, 2, tLen);
                        snCtx.fillRect(drawX + 7, drawY - tLen - 1, 2, 2);
                        snCtx.fillRect(drawX + 11, drawY - tLen - 1, 2, 2);
                    }
                    snCtx.restore();
                } else {
                    // BODY SEGMENTS (3D Cylindrical Shading + Dorsal Ridge Line)
                    snCtx.save();
                    let tFraction = i / snakeArr.length;
                    let r = Math.round(46 * (1 - tFraction) + 10 * tFraction);
                    let g = Math.round(204 * (1 - tFraction) + 140 * tFraction);
                    let b = Math.round(113 * (1 - tFraction) + 180 * tFraction);

                    let segGrad = snCtx.createLinearGradient(drawX + sOffset, drawY + sOffset, drawX + sOffset + sSize, drawY + sOffset + sSize);
                    segGrad.addColorStop(0, `rgb(${Math.min(255, r + 40)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 40)})`);
                    segGrad.addColorStop(0.5, `rgb(${r}, ${g}, ${b})`);
                    segGrad.addColorStop(1, `rgb(${Math.max(0, r - 30)}, ${Math.max(0, g - 40)}, ${Math.max(0, b - 30)})`);

                    snCtx.fillStyle = segGrad;
                    snCtx.beginPath();
                    snCtx.roundRect(drawX + sOffset, drawY + sOffset, sSize, sSize, sSize * 0.4);
                    snCtx.fill();

                    // Subtle neon spine highlight
                    if (sSize > 12) {
                        snCtx.fillStyle = 'rgba(255, 255, 255, 0.28)';
                        snCtx.beginPath();
                        snCtx.arc(drawX + 10, drawY + 10, 2, 0, Math.PI * 2);
                        snCtx.fill();
                    }
                    snCtx.restore();
                }
            }

            // 5. Render Particle System
            for (let i = snakeParticlesArray.length - 1; i >= 0; i--) {
                let p = snakeParticlesArray[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) { snakeParticlesArray.splice(i, 1); continue; }
                snCtx.globalAlpha = Math.max(0, p.life);
                snCtx.fillStyle = p.color;
                snCtx.beginPath(); snCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); snCtx.fill();
            }
            snCtx.globalAlpha = 1.0;
            snCtx.restore(); // Restore Camera

            // --- 6. UPGRADED HUD RENDERING (Screen Space) ---
            snCtx.fillStyle = "rgba(15, 17, 26, 0.9)";
            snCtx.fillRect(0, 0, snakeCanvasElement.width, 22);
            snCtx.strokeStyle = "rgba(0, 210, 211, 0.3)";
            snCtx.beginPath(); snCtx.moveTo(0, 22); snCtx.lineTo(snakeCanvasElement.width, 22); snCtx.stroke();

            // Top Left: Score
            snCtx.fillStyle = "white";
            snCtx.font = "bold 11px Segoe UI";
            snCtx.textAlign = "left";
            let targetGoalMax = parseInt(rules.snakeTar) || 10;
            snCtx.fillText(`🍎 ${snakeScoreCounter} / ${targetGoalMax}`, 10, 15);

            // Top Center: Combo Display
            if (snakeComboCount > 1) {
                snCtx.fillStyle = "#f39c12";
                snCtx.textAlign = "center";
                snCtx.shadowColor = '#e67e22'; snCtx.shadowBlur = 5;
                let cScale = 11 + Math.sin(snakeTimeVisual * 4) * 2; // Pulsing combo text
                snCtx.font = `900 ${cScale}px Segoe UI`;
                snCtx.fillText(`COMBO x${snakeComboCount}`, snakeCanvasElement.width / 2, 16);
                snCtx.shadowBlur = 0;

                // Combo Timeout Bar under header
                snCtx.fillStyle = 'rgba(243, 156, 18, 0.2)';
                snCtx.fillRect(0, 22, snakeCanvasElement.width, 3);
                snCtx.fillStyle = '#f1c40f';
                let barW = (snakeComboTimeLeft / 3500) * snakeCanvasElement.width;
                snCtx.fillRect(0, 22, barW, 3);
            }

            // Top Right: Speed Level
            snCtx.fillStyle = "#bdc3c7";
            snCtx.font = "bold 10px Segoe UI";
            snCtx.textAlign = "right";
            let spdLevel = Math.max(1, 15 - Math.floor(snakeCurrentTickRate / 10));
            snCtx.fillText(`⚡ Lvl ${spdLevel}`, snakeCanvasElement.width - 10, 15);
        }

        // Fixed Input Handler: Prevents rapid double-tap self collisions
        function setSnakeDirection(dirVector) {
            if (dirVector === 'UP' && snakeLastMovedVector.y === 0) currentSnakeVector = { x: 0, y: -20 };
            if (dirVector === 'DOWN' && snakeLastMovedVector.y === 0) currentSnakeVector = { x: 0, y: 20 };
            if (dirVector === 'LEFT' && snakeLastMovedVector.x === 0) currentSnakeVector = { x: -20, y: 0 };
            if (dirVector === 'RIGHT' && snakeLastMovedVector.x === 0) currentSnakeVector = { x: 20, y: 0 };
        }
        window.setSnakeDirection = setSnakeDirection;
        // ===================================================================
        // 🏢 TOWER BLOXX: HIGH-FIDELITY NATURAL ENGINE & SOUND SYSTEM
        // ===================================================================

        function getTwAudioCtx() {
            try {
                if (!twAudioCtx) {
                    const AudioClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioClass) twAudioCtx = new AudioClass();
                }
                if (twAudioCtx && twAudioCtx.state === 'suspended') {
                    twAudioCtx.resume().catch(() => {});
                }
            } catch (e) {}
            return twAudioCtx;
        }

        function playTowerSound(type, param) {
            try {
                const ctx = getTwAudioCtx();
                if (!ctx) return;
                const now = ctx.currentTime;

                if (type === 'DROP') {
                    // Crisp mechanical cable release latch click
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.04);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);

                    // Aerodynamic wind rush whoosh
                    const bufSize = Math.floor(ctx.sampleRate * 0.20);
                    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                    const out = noiseBuf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) {
                        out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.45));
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuf;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(550, now);
                    filter.frequency.exponentialRampToValueAtTime(180, now + 0.20);
                    filter.Q.value = 2.2;
                    const nGain = ctx.createGain();
                    nGain.gain.setValueAtTime(0.22, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(ctx.destination);
                    noise.start(now);

                } else if (type === 'IMPACT_PERFECT') {
                    // 1. Deep solid bass impact kick
                    const bass = ctx.createOscillator();
                    const bGain = ctx.createGain();
                    bass.type = 'sine';
                    bass.frequency.setValueAtTime(150, now);
                    bass.frequency.exponentialRampToValueAtTime(42, now + 0.16);
                    bGain.gain.setValueAtTime(0.42, now);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    bass.connect(bGain);
                    bGain.connect(ctx.destination);
                    bass.start(now);
                    bass.stop(now + 0.16);

                    // 2. Harmonic crystal chime arpeggio scaling with combo streak
                    const combo = Math.max(1, param || 1);
                    const rootScale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];
                    const baseFreq = rootScale[(combo - 1) % rootScale.length];
                    const chord = [baseFreq, baseFreq * 1.2599, baseFreq * 1.4983, baseFreq * 2.0];

                    chord.forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, now + idx * 0.025);
                        g.gain.setValueAtTime(0.18, now + idx * 0.025);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.025 + 0.38);
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.start(now + idx * 0.025);
                        o.stop(now + idx * 0.025 + 0.38);
                    });

                } else if (type === 'IMPACT_GOOD') {
                    // Solid natural masonry landing thud
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(170, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);

                    // Masonry settling grit crunch
                    const bufSize = Math.floor(ctx.sampleRate * 0.07);
                    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                    const out = noiseBuf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.35));
                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuf;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1300, now);
                    const nGain = ctx.createGain();
                    nGain.gain.setValueAtTime(0.15, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(ctx.destination);
                    noise.start(now);

                } else if (type === 'WOBBLE') {
                    // Structural stress creak
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.19);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.20);

                } else if (type === 'LEVEL_UP') {
                    // Triumphant 5-note brass fanfare
                    const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
                    notes.forEach((f, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(f, now + idx * 0.07);
                        g.gain.setValueAtTime(0.20, now + idx * 0.07);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.32);
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.start(now + idx * 0.07);
                        o.stop(now + idx * 0.07 + 0.32);
                    });

                } else if (type === 'REWARD') {
                    // Jackpot sparkle bells for discount coupon
                    const notes = [1046.5, 1318.5, 1567.98, 2093.0];
                    notes.forEach((f, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'sine';
                        o.frequency.setValueAtTime(f, now + idx * 0.06);
                        g.gain.setValueAtTime(0.22, now + idx * 0.06);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.35);
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.start(now + idx * 0.06);
                        o.stop(now + idx * 0.06 + 0.35);
                    });

                } else if (type === 'COLLAPSE') {
                    // Deep tumbling rumble and masonry collapse
                    const rumble = ctx.createOscillator();
                    const rGain = ctx.createGain();
                    rumble.type = 'sawtooth';
                    rumble.frequency.setValueAtTime(95, now);
                    rumble.frequency.linearRampToValueAtTime(30, now + 0.65);
                    rGain.gain.setValueAtTime(0.38, now);
                    rGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    rumble.connect(rGain);
                    rGain.connect(ctx.destination);
                    rumble.start(now);
                    rumble.stop(now + 0.65);

                    // Shattering debris crunch
                    const bufSize = Math.floor(ctx.sampleRate * 0.50);
                    const noiseBuf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
                    const out = noiseBuf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.40));
                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuf;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(750, now);
                    filter.frequency.linearRampToValueAtTime(220, now + 0.50);
                    filter.Q.value = 1.3;
                    const nGain = ctx.createGain();
                    nGain.gain.setValueAtTime(0.30, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.50);
                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(ctx.destination);
                    noise.start(now);
                }
            } catch (e) {}
        }

        function initTowerVFXState() {
            towerTargetCameraY = 0;
            towerSmoothCameraY = 0;
            towerCameraZoom = 1.0;
            towerTargetZoom = 1.0;
            towerFloatingTexts = [];
            towerParticlesArray = [];
            towerShockwavesArray = [];
            towerDebrisArray = [];
            towerPerfectCombo = 0;
            towerMaxCombo = 0;
            towerGlowFlashAlpha = 0;
            towerStackSquashY = 0;
            towerStackSwayAngle = 0;
            towerStackSwayVel = 0;
            towerGameState = 'PLAYING';
            towerCollapseAnim = null;
            towerClawOpen = 0;
            shootingStarState = null;

            // Animated Living Birds (Floors 0-16)
            towerBirdsArray = [];
            const canvasW = towerCanvasElement ? towerCanvasElement.width : 360;
            for (let i = 0; i < 5; i++) {
                towerBirdsArray.push({
                    x: Math.random() * canvasW,
                    y: 70 + Math.random() * 130,
                    speed: 0.9 + Math.random() * 0.7,
                    size: 3.5 + Math.random() * 1.5,
                    wingPhase: Math.random() * Math.PI * 2
                });
            }

            // Animated City Traffic with Distinct Vehicle Models (Floors 0-16)
            towerCarsArray = [
                { type: 'TAXI', x: canvasW * 0.15, speed: 1.5, lane: 0, color: '#facc15' },
                { type: 'SEDAN', x: canvasW * 0.58, speed: 1.8, lane: 0, color: '#38bdf8' },
                { type: 'BUS', x: canvasW * 0.88, speed: -1.2, lane: 1, color: '#0284c7' },
                { type: 'SEDAN', x: canvasW * 0.32, speed: -1.6, lane: 1, color: '#ef4444' }
            ];
        }

        function initTowerBloxxGame() {
            clearInterval(loopTimerInstance);
            if (!towerCanvasElement) towerCanvasElement = document.getElementById('towerCanvas');
            if (!twCtx) twCtx = towerCanvasElement.getContext('2d');

            towerScoreCounter = 0;
            currentTowerLevelState = 1;
            isTowerBlockDropping = false;
            towerCameraOffsetOffsetY = 0;
            towerVisualVibrationScaleX = 0;
            towerHasTapped = false;
            activeTowerBlocksArray = [];

            initTowerVFXState();

            // Rich multi-magnitude stars for stratosphere and cosmos
            towerStarsArray = [];
            const canvasW = towerCanvasElement.width;
            const canvasH = towerCanvasElement.height;
            for (let i = 0; i < 75; i++) {
                towerStarsArray.push({
                    x: Math.random() * canvasW,
                    y: Math.random() * canvasH,
                    size: Math.random() * 2.2 + 0.5,
                    alpha: Math.random(),
                    twinkleSpeed: 0.02 + Math.random() * 0.04,
                    color: ['#ffffff', '#fff7e6', '#e0f7fa', '#ffebee', '#ede7f6'][Math.floor(Math.random() * 5)]
                });
            }

            // Procedural volumetric drifting cumulus clouds
            towerCloudsArray = [];
            for (let i = 0; i < 7; i++) {
                towerCloudsArray.push({
                    x: Math.random() * canvasW,
                    y: Math.random() * (canvasH * 0.65),
                    speed: 0.22 + Math.random() * 0.35,
                    radius: 20 + Math.random() * 16,
                    density: 0.4 + Math.random() * 0.4
                });
            }

            // 🧱 RESPONSIVE ARCHITECTURAL BLOCK SIZING
            // Proportional to canvas width for crisp architectural details
            let squareBlockWidth = Math.min(54, Math.max(44, Math.round(canvasW * 0.15)));
            let squareBlockHeight = Math.round(squareBlockWidth * 0.88);

            // Grand Foundation Ground Floor (Floor 0)
            // Sits elevated atop the grand granite plaza podium (canvasH - 36), separated cleanly from street level
            activeTowerBlocksArray.push({
                x: (canvasW / 2) - (squareBlockWidth / 2),
                y: canvasH - 36 - squareBlockHeight,
                w: squareBlockWidth,
                h: squareBlockHeight,
                color: '#2c3e50',
                isAnchor: true
            });

            // ⛓️ INDUSTRIAL CRANE & PENDULUM PIVOT SETUP
            let chainLength = 110;
            let swingSpeed = calculateTowerSwingSpeed(0);

            currentSwingingBlock = {
                pivotX: canvasW / 2,
                pivotY: 0,
                length: chainLength,
                maxAngle: Math.PI / 2.7,
                swingTimer: 0,
                speed: swingSpeed,
                w: squareBlockWidth,
                h: squareBlockHeight,
                x: 0,
                y: 0,
                dropX: 0,
                dropY: 0,
                dropSpeedY: 2.4,
                dropAccY: 0.58,
                color: '#f39c12'
            };

            // Unified Mobile / Desktop Click & Touch Interaction
            const handleDropAction = (e) => {
                if (e) {
                    e.preventDefault();
                    if (e.stopPropagation) e.stopPropagation();
                }
                getTwAudioCtx(); // Wake up audio context on interaction

                if (towerGameState === 'PLAYING' && !isTowerBlockDropping && activeGameMode === 'TOWER') {
                    isTowerBlockDropping = true;
                    towerHasTapped = true;
                    currentSwingingBlock.dropX = currentSwingingBlock.x;
                    currentSwingingBlock.dropY = currentSwingingBlock.y;
                    currentSwingingBlock.dropSpeedY = 2.4;
                    currentSwingingBlock.dropAccY = 0.58;
                    towerClawOpen = 1.0;
                    playTowerSound('DROP');
                }
            };

            towerCanvasElement.onclick = handleDropAction;
            towerCanvasElement.ontouchstart = handleDropAction;

            loopTimerInstance = setInterval(frameUpdateTowerBloxx, 16);
        }

        // 📊 Calculate Level based on placed floors
        function calculateTowerLevel(floorCount) {
            return Math.min(5, Math.floor(floorCount / 10) + 1);
        }

        // ⚡ HARD PROGRESSIVE SPEED SCALING
        function calculateTowerSwingSpeed(floorCount) {
            let baseSpeed = 0.038;
            let maxSpeed = 0.125;
            let calculatedSpeed = baseSpeed + (floorCount * 0.0022);
            return Math.min(maxSpeed, calculatedSpeed);
        }

        // 🌌 CONTINUOUS 50-FLOOR DYNAMIC ATMOSPHERE & ENVIRONMENT
        function render50FloorAtmosphere(floorCount) {
            let w = towerCanvasElement.width;
            let h = towerCanvasElement.height;
            let progress = Math.min(floorCount / 50, 1.0);

            let grad = twCtx.createLinearGradient(0, 0, 0, h);

            if (progress < 0.20) {
                // Tier 1 (Floors 0-10): Bright Sunny Morning & Daytime Sky
                let factor = progress / 0.20;
                grad.addColorStop(0, interpolateColor('#2980b9', '#3498db', factor));
                grad.addColorStop(0.35, interpolateColor('#6dd5fa', '#5dade2', factor));
                grad.addColorStop(1, interpolateColor('#ffffff', '#d4e6f1', factor));
            } else if (progress < 0.40) {
                // Tier 2 (Floors 11-20): Radiant Golden Hour & Sunset Sky
                let factor = (progress - 0.20) / 0.20;
                grad.addColorStop(0, interpolateColor('#1a2a6c', '#2c3e50', factor));
                grad.addColorStop(0.4, interpolateColor('#b21f1f', '#e67e22', factor));
                grad.addColorStop(1, interpolateColor('#fdbb2d', '#f39c12', factor));
            } else if (progress < 0.60) {
                // Tier 3 (Floors 21-30): Twilight Violet Dusk
                let factor = (progress - 0.40) / 0.20;
                grad.addColorStop(0, interpolateColor('#141e30', '#0f2027', factor));
                grad.addColorStop(0.5, interpolateColor('#243b55', '#203a43', factor));
                grad.addColorStop(1, interpolateColor('#5d4157', '#2c5364', factor));
            } else if (progress < 0.80) {
                // Tier 4 (Floors 31-40): Upper Stratosphere & Crescent Moon Night
                let factor = (progress - 0.60) / 0.20;
                grad.addColorStop(0, interpolateColor('#0a0e17', '#030712', factor));
                grad.addColorStop(0.6, interpolateColor('#0f172a', '#0b1120', factor));
                grad.addColorStop(1, interpolateColor('#1e293b', '#111827', factor));
            } else {
                // Tier 5 (Floors 41-50): Deep Cosmic Exosphere, Radiant Nebulae & Aurora
                let factor = (progress - 0.80) / 0.20;
                grad.addColorStop(0, '#020308');
                grad.addColorStop(0.5, interpolateColor('#0a0518', '#030010', factor));
                grad.addColorStop(1, interpolateColor('#15082a', '#050212', factor));
            }

            twCtx.fillStyle = grad;
            twCtx.fillRect(0, 0, w, h);

            // ☀️ 1. SUN / SUNSET ORB (Floors 0-25)
            if (progress < 0.50) {
                twCtx.save();
                let sunProgress = progress / 0.50;
                let sunX = w * 0.78;
                let sunY = 55 + sunProgress * (h * 0.45);
                let sunRadius = 24 - sunProgress * 4;

                let sunCorona = twCtx.createRadialGradient(sunX, sunY, sunRadius * 0.2, sunX, sunY, sunRadius * 2.8);
                if (progress < 0.20) {
                    sunCorona.addColorStop(0, 'rgba(255, 255, 235, 0.95)');
                    sunCorona.addColorStop(0.3, 'rgba(255, 235, 170, 0.45)');
                    sunCorona.addColorStop(1, 'rgba(255, 240, 200, 0)');
                } else {
                    sunCorona.addColorStop(0, 'rgba(255, 210, 120, 0.95)');
                    sunCorona.addColorStop(0.4, 'rgba(243, 156, 18, 0.55)');
                    sunCorona.addColorStop(1, 'rgba(231, 76, 60, 0)');
                }
                twCtx.fillStyle = sunCorona;
                twCtx.beginPath();
                twCtx.arc(sunX, sunY, sunRadius * 2.8, 0, Math.PI * 2);
                twCtx.fill();

                twCtx.fillStyle = progress < 0.20 ? '#fffef0' : '#ffeaa7';
                twCtx.beginPath();
                twCtx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
                twCtx.fill();
                twCtx.restore();
            }

            // 🕊️ 2. LIVING BIRDS IN NATURAL FLOCK FLIGHT (Floors 0-18)
            if (progress < 0.36) {
                twCtx.save();
                twCtx.strokeStyle = progress < 0.20 ? 'rgba(30, 41, 59, 0.65)' : 'rgba(248, 250, 252, 0.55)';
                twCtx.lineWidth = 1.6;
                twCtx.lineCap = 'round';
                towerBirdsArray.forEach(bird => {
                    bird.x += bird.speed;
                    if (bird.x > w + 25) bird.x = -25;
                    bird.wingPhase += 0.16;
                    let wingSpan = bird.size || 4;
                    let wingY = Math.sin(bird.wingPhase) * (wingSpan * 0.7);

                    twCtx.beginPath();
                    twCtx.moveTo(bird.x - wingSpan, bird.y + wingY);
                    twCtx.quadraticCurveTo(bird.x - (wingSpan * 0.4), bird.y - 1, bird.x, bird.y);
                    twCtx.quadraticCurveTo(bird.x + (wingSpan * 0.4), bird.y - 1, bird.x + wingSpan, bird.y + wingY);
                    twCtx.stroke();
                });
                twCtx.restore();
            }

            // 🌙 3. STARS, CRESCENT MOON, AURORA & NEBULA (Floors 22-50)
            if (progress > 0.38) {
                let celestialAlpha = Math.min((progress - 0.38) / 0.25, 1.0);
                twCtx.save();

                // Multi-magnitude twinkling stars
                towerStarsArray.forEach(star => {
                    star.alpha += star.twinkleSpeed;
                    let currentAlpha = (Math.sin(star.alpha) + 1) / 2 * celestialAlpha;
                    twCtx.fillStyle = star.color || '#ffffff';
                    twCtx.globalAlpha = currentAlpha;
                    twCtx.beginPath();
                    twCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    twCtx.fill();
                });
                twCtx.globalAlpha = 1.0;

                // Detailed Crescent Moon (Floors 28-50)
                if (progress > 0.52) {
                    let moonX = w * 0.82;
                    let moonY = 68;
                    let moonRad = 16;

                    // Lunar glow halo
                    let moonHalo = twCtx.createRadialGradient(moonX, moonY, moonRad * 0.8, moonX, moonY, moonRad * 3.2);
                    moonHalo.addColorStop(0, 'rgba(224, 242, 254, 0.35)');
                    moonHalo.addColorStop(1, 'rgba(224, 242, 254, 0)');
                    twCtx.fillStyle = moonHalo;
                    twCtx.beginPath();
                    twCtx.arc(moonX, moonY, moonRad * 3.2, 0, Math.PI * 2);
                    twCtx.fill();

                    // Crescent body
                    twCtx.fillStyle = '#f8fafc';
                    twCtx.beginPath();
                    twCtx.arc(moonX, moonY, moonRad, 0, Math.PI * 2);
                    twCtx.fill();

                    twCtx.fillStyle = '#050816';
                    twCtx.beginPath();
                    twCtx.arc(moonX - 5, moonY - 3, moonRad * 0.88, 0, Math.PI * 2);
                    twCtx.fill();
                }

                // Cosmic Aurora & Swirling Nebulae (Floors 40-50)
                if (progress > 0.75) {
                    let auroraAlpha = Math.min((progress - 0.75) / 0.25, 0.45);
                    let cosmicGrad = twCtx.createLinearGradient(0, 0, w, 220);
                    cosmicGrad.addColorStop(0, `rgba(168, 85, 247, ${auroraAlpha * 0.5})`);
                    cosmicGrad.addColorStop(0.4, `rgba(6, 182, 212, ${auroraAlpha * 0.4})`);
                    cosmicGrad.addColorStop(0.8, `rgba(236, 72, 153, ${auroraAlpha * 0.35})`);
                    cosmicGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                    twCtx.fillStyle = cosmicGrad;
                    twCtx.fillRect(0, 0, w, 240);

                    // Distant Curved Blue Earth Horizon (Floors 46-50)
                    if (progress > 0.88) {
                        let earthAlpha = Math.min((progress - 0.88) / 0.12, 0.85);
                        twCtx.save();
                        twCtx.globalAlpha = earthAlpha;
                        let earthGrad = twCtx.createRadialGradient(w / 2, h + 180, 220, w / 2, h + 180, 360);
                        earthGrad.addColorStop(0, '#1e3a8a');
                        earthGrad.addColorStop(0.65, '#0284c7');
                        earthGrad.addColorStop(0.88, '#38bdf8');
                        earthGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                        twCtx.fillStyle = earthGrad;
                        twCtx.beginPath();
                        twCtx.arc(w / 2, h + 180, 360, Math.PI, Math.PI * 2);
                        twCtx.fill();
                        twCtx.restore();
                    }
                }

                // Luminous Shooting Star Meteors
                if (progress > 0.60) {
                    if (!shootingStarState && Math.random() < 0.022) {
                        shootingStarState = {
                            x: Math.random() * (w * 0.85),
                            y: Math.random() * (h * 0.35),
                            len: 35 + Math.random() * 45,
                            speed: 9 + Math.random() * 4,
                            alpha: 1.0
                        };
                    }
                    if (shootingStarState) {
                        twCtx.save();
                        let sGrad = twCtx.createLinearGradient(
                            shootingStarState.x, shootingStarState.y,
                            shootingStarState.x - shootingStarState.len, shootingStarState.y + shootingStarState.len
                        );
                        sGrad.addColorStop(0, `rgba(255, 255, 255, ${shootingStarState.alpha})`);
                        sGrad.addColorStop(0.5, `rgba(56, 189, 248, ${shootingStarState.alpha * 0.6})`);
                        sGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        twCtx.strokeStyle = sGrad;
                        twCtx.lineWidth = 2.0;
                        twCtx.beginPath();
                        twCtx.moveTo(shootingStarState.x, shootingStarState.y);
                        twCtx.lineTo(shootingStarState.x - shootingStarState.len, shootingStarState.y + shootingStarState.len);
                        twCtx.stroke();

                        shootingStarState.x += shootingStarState.speed;
                        shootingStarState.y += shootingStarState.speed;
                        shootingStarState.alpha -= 0.038;
                        if (shootingStarState.alpha <= 0) shootingStarState = null;
                        twCtx.restore();
                    }
                }
                twCtx.restore();
            }

            // 🏙️ 4. PARALLAX CITY FOUNDATION (Floors 0-20)
            let parallaxOffsetY = towerSmoothCameraY * 0.28;
            renderGroundAndCityFoundation(progress, parallaxOffsetY);

            // ☁️ 5. VOLUMETRIC DRIFTING CUMULUS CLOUDS (Floors 8-36)
            if (progress > 0.12 && progress < 0.72) {
                twCtx.save();
                let cloudFade = Math.sin(Math.min(1, Math.max(0, (progress - 0.12) / 0.60)) * Math.PI);
                let cloudAlpha = Math.max(0, 0.42 * cloudFade);

                towerCloudsArray.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x - cloud.radius * 2 > w) cloud.x = -cloud.radius * 2;
                    let cloudY = cloud.y + (towerSmoothCameraY * 0.16);

                    // 3D Shaded Cloud Body
                    let cGrad = twCtx.createLinearGradient(cloud.x, cloudY - cloud.radius, cloud.x, cloudY + cloud.radius);
                    if (progress < 0.25) {
                        cGrad.addColorStop(0, `rgba(255, 255, 255, ${cloudAlpha})`);
                        cGrad.addColorStop(1, `rgba(226, 232, 240, ${cloudAlpha * 0.8})`);
                    } else {
                        cGrad.addColorStop(0, `rgba(254, 215, 170, ${cloudAlpha})`);
                        cGrad.addColorStop(1, `rgba(168, 85, 247, ${cloudAlpha * 0.75})`);
                    }
                    twCtx.fillStyle = cGrad;
                    twCtx.beginPath();
                    twCtx.arc(cloud.x, cloudY, cloud.radius, 0, Math.PI * 2);
                    twCtx.arc(cloud.x + (cloud.radius * 0.7), cloudY - (cloud.radius * 0.35), cloud.radius * 0.85, 0, Math.PI * 2);
                    twCtx.arc(cloud.x - (cloud.radius * 0.7), cloudY - (cloud.radius * 0.25), cloud.radius * 0.75, 0, Math.PI * 2);
                    twCtx.arc(cloud.x + (cloud.radius * 1.3), cloudY + (cloud.radius * 0.1), cloud.radius * 0.6, 0, Math.PI * 2);
                    twCtx.fill();
                });
                twCtx.restore();
            }

            // =========================================================================
            // 5. LAYER 5: FOREGROUND CITY AVENUE & REALISTIC VEHICLES

            let roadY = sidewalkY + sidewalkH;

            towerCarsArray.forEach(car => {
                car.x += car.speed;
                if (car.speed > 0 && car.x > w + 40) car.x = -40;
                if (car.speed < 0 && car.x < -40) car.x = w + 40;

                let carY = car.lane === 0 ? (roadY + 4) : (roadY + 13);

                    twCtx.roundRect(car.x - 10, carY + 1, cW, cH, 2.5);

                    // Aerodynamic Windshield
                    twCtx.fillStyle = '#38bdf8';
                    twCtx.fillRect(car.x - (dir > 0 ? 3 : 6), carY + 1, 5, 3);

                    twCtx.fillStyle = '#475569';
                    twCtx.beginPath();
                    twCtx.arc(car.x - 6, carY + cH + 0.5, 2, 0, Math.PI * 2);

                    twCtx.fillStyle = '#ffffff';

                    twCtx.fillStyle = '#ef4444';
                    twCtx.fillRect(car.x - (dir * 10.5), carY + 2.5, 1.5, 2.5);

            twCtx.restore();

        // 🏙️ NATURAL REALISTIC SKYSCRAPER FLOOR ARCHITECTURE
        function drawStylizedSquareBlock(x, y, w, h, hexColor, floorIndex, isAnchor) {
            twCtx.save();

            twCtx.fillStyle = 'rgba(0, 0, 0, 0.38)';

            let blockGrad = twCtx.createLinearGradient(x, y, x, y + h);
            blockGrad.addColorStop(0, lightenColor(hexColor, 28));
            blockGrad.addColorStop(0.25, hexColor);
            blockGrad.addColorStop(1, darkenColor(hexColor, 32));

            twCtx.fillStyle = blockGrad;
            twCtx.beginPath();
            twCtx.roundRect(x, y, w, h, 4);

            twCtx.fillStyle = 'rgba(15, 23, 42, 0.65)';

                // ========================================================

                let lobbyY = y + 4;

                // Grand glass rotunda interior
                let rotundaGrad = twCtx.createLinearGradient(lobbyX, lobbyY, lobbyX, lobbyY + lobbyH);
                rotundaGrad.addColorStop(0, '#fef08a');
